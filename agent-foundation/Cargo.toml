[package]
name = "browseros-agent-foundation"
version = "0.1.0"
edition = "2021"
license = "MulanPSL-2.0"
publish = false
description = "Standalone, non-integrated BrowserOS Agent Channel foundation prototype"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
uuid = { version = "1", features = ["serde", "v4"] }
