[package]
name = "browseros-agent-foundation"
version = "0.1.0"
edition = "2021"
license = "MulanPSL-2.0"
publish = false
description = "Standalone BrowserOS Agent foundation with opt-in Tauri experiment host"

[features]
default = []
durable-sqlite = ["dep:rusqlite"]
adapter-rig = ["dep:rig-core", "dep:futures"]
adapter-rmcp = ["dep:rmcp"]
adapter-acp = ["dep:agent-client-protocol", "dep:futures"]
adapter-all = ["adapter-rig", "adapter-rmcp", "adapter-acp"]
experimental-rig-run = ["dep:rig-agent"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "io-util"] }
uuid = { version = "1", features = ["serde", "v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
rig-core = { version = "=0.43.0", default-features = false, optional = true }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "server", "transport-async-rw"], optional = true }
agent-client-protocol = { version = "=3.6.0", default-features = false, optional = true }
futures = { version = "0.3", optional = true }
rig-agent = { version = "=0.43.0", default-features = false, optional = true }
