[package]
name = "tauri-plugin-browser-tabs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
links = "tauri-plugin-browser-tabs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { workspace = true, features = ["unstable", "wry"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
browseros-platform-security = { path = "../../../crates/browseros-platform-security" }
windows-sys = { version = "=0.60.2", features = ["Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
windows = "=0.61.3"
webview2-com = "=0.38.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2.0", features = ["v2_22"] }
java_script_core = { package = "javascriptcore-rs", version = "=1.1" }
cairo-rs = { version = "0.18", features = ["png"] }
