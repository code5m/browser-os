[workspace]
members = ["crates/tauri-plugin-browser-tabs", "examples/basic/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/tauri-browser-tabs"
homepage = "https://github.com/your-org/tauri-browser-tabs"
description = "A Tauri v2 plugin for embedding multiple browser tabs as child webviews"
keywords = ["tauri", "webview", "browser", "tabs", "plugin"]
categories = ["gui", "web-programming"]

[workspace.dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
parking_lot = "0.12"
