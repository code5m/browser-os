[package]
name = "mvp-browser-os"
version = "0.1.0"
description = "极智简单 · 浏览器OS融合 MVP"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-plugin-shell = "2"
# 子 webview（浏览器页签/宫格）统一由 browser-tabs 插件管理：
# 全链路 Logical 坐标 + Linux WebKitGTK size_allocate 修复
tauri-plugin-browser-tabs = { path = "../tauri-browser-tabs/crates/tauri-plugin-browser-tabs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
git2 = "0.19"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
url = "2"
urlencoding = "2"
# GTK 用于方案 C3：在 GTK 后端用 gtk::Overlay + gtk::Fixed 承载内嵌子 webview
# （wry 依赖的 gtk 同为 0.18，已在 lockfile 中，无需额外下载）
gtk = "0.18"
# wry 0.55（与 tauri-runtime-wry 内部版本一致，同一实例）：直接用其 WebViewBuilder / WebView
# 在 gtk::Fixed 中创建内嵌子 webview（方案 C3）
wry = "0.55"
open = "5"
arboard = "3"
portable-pty = "0.8"
freedesktop-icons = "0.4"
strip-ansi-escapes = "0.2"
# crashlog：stderr fd 镜像 + 致命信号捕获
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
