[package]
name = "mvp-browser-os"
version = "0.1.0"
description = "极智简单 · 浏览器OS融合 MVP"
edition = "2021"

# M5-1.a：纯逻辑库边界。阶段一采用「同 package 双 target」——lib 与 bin 共处本 package，
# 不改跨 crate 依赖图、编译模型变化最小。阶段二再按需提升为 workspace member。
#
# ⚠️ 编译器守不住 core 的纯洁性：package 级 [dependencies] 对 lib 与 bin 同时生效，
# 因此 core 内直接引用 Tauri 的 API **照样可以编译通过**。边界只能由
# `scripts/check-core-boundary.py`（已接入 pre-merge）在静态层断言。
[lib]
name = "mvp_core"
path = "src/lib.rs"

# M5-W10 A3：MCP stdio-prep 骨架的 feature 门控。默认构建（`cargo build` / `cargo test`
# 不带 --features mcp）不编译该骨架；仅 `cargo build --features mcp` / `cargo test --features mcp`
# 才纳入。骨架为纯 std + serde_json（复用 crate::mcp 注册表/策略接线），不引入任何新依赖，
# 故默认构建 / 依赖图 / 包体积零变化。W10 Hard Stop：MCP server 运行时依赖不得进入 default 构建；
# 若未来确需引入，须 optional + required-features 隔离（见 scripts/check-mcp-policy.py 的 MCP_SERVER_GATED 守门）。
[features]
mcp = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset"] }
# M1-4：单实例——应用已运行时再次 xdg-open（第二实例）把 argv 中的 http(s) URL
# 路由给首个实例的内嵌页签，而不是另起窗口。grid 子进程走独立 Builder 不受其影响。
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# 子 webview（浏览器页签/宫格）统一由 browser-tabs 插件管理：
# 全链路 Logical 坐标 + Linux WebKitGTK size_allocate 修复
tauri-plugin-browser-tabs = { path = "../tauri-browser-tabs/crates/tauri-plugin-browser-tabs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
git2 = "0.19"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
url = "2"
urlencoding = "2"
# M0-4.a：原 gtk/wry 直接依赖是为「方案 C3（gtk::Overlay + gtk::Fixed 承载内嵌子 webview）」
# 准备的，实际实现走的是方案 D（Window::add_child），源码中零 `gtk::` / `wry::` 引用，
# 属于会被误读为「已有原生内嵌层」的死亡依赖，已连同过时 C3 注释一并移除。
# 若将来真的要上 C3，请重新引入并在代码里给出引用点，不要只加依赖。
open = "5"
arboard = "3"
portable-pty = "0.8"
freedesktop-icons = "0.4"
strip-ansi-escapes = "0.2"
# crashlog：stderr fd 镜像 + 致命信号捕获
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
mysql = "28.0.2"
postgres = "0.19.14"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
