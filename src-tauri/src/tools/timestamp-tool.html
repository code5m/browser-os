<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>时间戳转换</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --code-bg: #f3f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --primary: #818cf8;
        --primary-light: rgba(129,140,248,0.12);
        --success: #34d399;
        --danger: #f87171;
        --warning: #fbbf24;
        --border: #334155;
        --shadow: 0 2px 8px rgba(0,0,0,0.25);
        --code-bg: #0f172a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 80px;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    header { text-align: center; padding: 24px 0 16px; }
    header h1 { margin: 0 0 6px; font-size: 1.6rem; color: var(--primary); }
    header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 14px; font-size: 1.1rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text);
      background: var(--card);
      transition: border-color .15s, box-shadow .15s;
      -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row .field { flex: 1; min-width: 140px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 14px; border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: transform .05s, opacity .15s; -webkit-tap-highlight-color: transparent;
      background: var(--primary); color: #fff;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
    .btn-block { width: 100%; }
    .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .actions .btn { flex: 1; min-width: 96px; }
    .out-list { list-style: none; margin: 0; padding: 0; }
    .out-list li {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; background: var(--code-bg); border-radius: 8px; margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .out-list .k { color: var(--muted); font-size: 0.8rem; flex-shrink: 0; }
    .out-list .v {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      word-break: break-all; text-align: right; color: var(--primary); font-weight: 600;
    }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .badge-success { background: rgba(16,185,129,0.15); color: var(--success); }
    .badge-danger { background: rgba(239,68,68,0.15); color: var(--danger); }
    .badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); }
    .desc-box { margin-top: 12px; padding: 12px; background: var(--code-bg); border-radius: 8px; border-left: 4px solid var(--muted); font-size: 0.9rem; }
    .desc-box.error { border-left-color: var(--danger); background: rgba(239,68,68,0.08); }
    .desc-box.success { border-left-color: var(--success); background: rgba(16,185,129,0.08); }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
    .copy-toast {
      position: fixed; top: 16px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--text); color: var(--bg);
      padding: 8px 16px; border-radius: 999px;
      font-size: 0.85rem; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; z-index: 200;
    }
    .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 20px 0 30px; }
    @media (max-width: 480px) {
      header h1 { font-size: 1.4rem; }
      .out-list li { flex-direction: column; align-items: flex-start; gap: 4px; }
      .out-list .v { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>时间戳转换</h1>
      <p>秒 / 毫秒 ↔ 本地 / UTC / ISO 8601</p>
    </header>

    <section class="card">
      <h2>时间戳 → 时间</h2>
      <div class="row">
        <div class="field">
          <label for="tsInput">时间戳（10 位秒 / 13 位毫秒，自动识别）</label>
          <input id="tsInput" type="text" inputmode="numeric" placeholder="例如 1693804800 或 1693804800000">
        </div>
        <div class="field" style="flex:0 0 auto; display:flex; align-items:flex-end;">
          <button class="btn btn-ghost" id="nowBtn">现在</button>
        </div>
      </div>
      <div id="tsMsg" class="desc-box" style="display:none;"></div>
      <ul class="out-list" id="tsOut"></ul>
    </section>

    <section class="card">
      <h2>时间 → 时间戳</h2>
      <label for="dateInput">日期字符串（如 2023-09-04 12:00:00，留空则用当前时间）</label>
      <input id="dateInput" type="text" placeholder="2023-09-04 12:00:00">
      <div class="actions">
        <button class="btn btn-primary" id="toTsBtn">转换</button>
        <button class="btn btn-ghost" id="clearBtn">清空</button>
      </div>
      <div id="dateMsg" class="desc-box" style="display:none;"></div>
      <ul class="out-list" id="dateOut"></ul>
    </section>

    <footer>单文件 HTML，纯离线，保存后随时带走使用</footer>
  </div>

  <div class="copy-toast" id="copyToast">已复制</div>

  <script>
    const $ = id => document.getElementById(id);
    const tsInput = $('tsInput'), dateInput = $('dateInput');
    const tsOut = $('tsOut'), dateOut = $('dateOut');
    const tsMsg = $('tsMsg'), dateMsg = $('dateMsg');
    const copyToast = $('copyToast');

    function showMsg(el, type, html) {
      el.style.display = 'block';
      el.className = 'desc-box ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
      el.innerHTML = html;
    }
    function clearMsg(el) { el.style.display = 'none'; el.innerHTML = ''; }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => toast()).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); toast();
      });
    }
    function toast() {
      copyToast.classList.add('show');
      setTimeout(() => copyToast.classList.remove('show'), 1500);
    }
    function pad(n) { return String(n).padStart(2, '0'); }
    function fmtLocal(d) {
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    function timeAgo(d) {
      const diff = Date.now() - d.getTime();
      const abs = Math.abs(diff);
      const sign = diff < 0 ? '后' : '前';
      if (abs < 60000) return '刚刚';
      const m = Math.round(abs / 60000);
      if (m < 60) return `${m} 分钟${sign}`;
      const h = Math.round(m / 60);
      if (h < 24) return `${h} 小时${sign}`;
      const day = Math.round(h / 24);
      return `${day} 天${sign}`;
    }

    function tsToTime() {
      clearMsg(tsMsg);
      const raw = tsInput.value.trim();
      if (!raw) { tsOut.innerHTML = ''; showMsg(tsMsg, 'warn', '<span class="badge badge-warning">空</span> 请输入时间戳'); return; }
      const num = Number(raw);
      if (!isFinite(num)) { tsOut.innerHTML = ''; showMsg(tsMsg, 'error', '<span class="badge badge-danger">无效</span> 时间戳必须为数字'); return; }
      const isSec = String(Math.floor(Math.abs(num))).length <= 10;
      const ms = isSec ? num * 1000 : num;
      const d = new Date(ms);
      if (isNaN(d.getTime())) { tsOut.innerHTML = ''; showMsg(tsMsg, 'error', '<span class="badge badge-danger">越界</span> 无法解析为有效时间'); return; }
      const items = [
        ['本地时间', fmtLocal(d)],
        ['UTC', d.toUTCString()],
        ['ISO 8601', d.toISOString()],
        ['相对', timeAgo(d)]
      ];
      tsOut.innerHTML = items.map(([k, v]) =>
        `<li><span class="k">${k}</span><span class="v" data-v="${v}">${v}</span></li>`
      ).join('');
      tsOut.querySelectorAll('.v').forEach(el => {
        el.style.cursor = 'pointer';
        el.title = '点击复制';
        el.onclick = () => copyText(el.dataset.v);
      });
      showMsg(tsMsg, 'success', `<span class="badge badge-success">已识别</span> 按${isSec ? '秒' : '毫秒'}解析`);
    }

    function timeToTs() {
      clearMsg(dateMsg);
      const raw = dateInput.value.trim();
      let d;
      if (!raw) d = new Date();
      else {
        // 兼容 "2023-09-04 12:00:00" 中的空格（Safari 不直接认）
        d = new Date(raw.replace(' ', 'T'));
        if (isNaN(d.getTime())) d = new Date(raw);
      }
      if (isNaN(d.getTime())) { dateOut.innerHTML = ''; showMsg(dateMsg, 'error', '<span class="badge badge-danger">无效</span> 无法解析该日期'); return; }
      const ms = d.getTime();
      const items = [
        ['毫秒', String(ms)],
        ['秒', String(Math.floor(ms / 1000))]
      ];
      dateOut.innerHTML = items.map(([k, v]) =>
        `<li><span class="k">${k}</span><span class="v" data-v="${v}">${v}</span></li>`
      ).join('');
      dateOut.querySelectorAll('.v').forEach(el => {
        el.style.cursor = 'pointer';
        el.title = '点击复制';
        el.onclick = () => copyText(el.dataset.v);
      });
      showMsg(dateMsg, 'success', `<span class="badge badge-success">完成</span>`);
    }

    function fillNow() {
      tsInput.value = String(Date.now());
      tsToTime();
    }

    $('nowBtn').onclick = fillNow;
    $('toTsBtn').onclick = timeToTs;
    $('clearBtn').onclick = () => { dateInput.value = ''; dateOut.innerHTML = ''; clearMsg(dateMsg); };
    tsInput.addEventListener('input', tsToTime);
    dateInput.addEventListener('input', timeToTs);

    try {
      const saved = localStorage.getItem('tsToolDate');
      if (saved) dateInput.value = saved;
    } catch (e) {}
    dateInput.addEventListener('input', () => { try { localStorage.setItem('tsToolDate', dateInput.value); } catch (e) {} });

    fillNow();
  </script>
</body>
</html>
