name: Mirror GitHub to Gitee Retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-retired:
    runs-on: ubuntu-latest
    steps:
      - name: Automatic Gitee mirror retired
        run: |
          echo "GITEE_MIRROR_RESULT=RETIRED"
          echo "GitHub code5m/browser-os master is the only writable source of truth."
          echo "Automatic branch/tag mirroring to Gitee is intentionally disabled."
