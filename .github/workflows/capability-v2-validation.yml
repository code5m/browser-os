name: BrowserOS Full Validation

on:
  # Full validation is for ready-to-merge PRs, master, and explicit manual runs.
  # Developer pushes use BrowserOS Developer Feedback instead.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      native_mode:
        description: "Optional native checks (default OFF); choose Rust tests, installed GUI, or GUI + 5min resources"
        type: choice
        required: true
        default: "off"
        options:
          - "off"
          - "rust-tests"
          - "packaged-gui"
          - "packaged-resource"

concurrency:
  group: browseros-full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    # Read-only diagnostic export, never modifies or pushes source. The complete
    # tracked checkout (including public/) is kept separately from dependencies.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.number == 35
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export exact committed input and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/browseros-source-commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/browseros-source.tar.gz" HEAD
          npm ci
          tar -czf "$RUNNER_TEMP/browseros-node-modules.tar.gz" node_modules
          git diff --exit-code HEAD -- package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: browseros-source-input-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/browseros-source-commit.txt
            ${{ runner.temp }}/browseros-source.tar.gz
            ${{ runner.temp }}/browseros-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 3
  impact:
    # Draft PRs are deliberately excluded; ready_for_review runs full checks.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      supply_node: ${{ steps.detect.outputs.supply_node }}
      supply_rust: ${{ steps.detect.outputs.supply_rust }}
      native_mode: ${{ steps.native_mode.outputs.native_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Determine changed-file risk (fail closed)
        env:
          CI_COMPARE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_COMPARE_HEAD: ${{ github.sha }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        run: |
          python3 scripts/ci-impact.py --self-test
          python3 scripts/ci-impact.py --gha
      - id: native_mode
        name: Select optional native verification mode
        env:
          CI_NATIVE_MODE_INPUT: ${{ inputs.native_mode || '' }}
          CI_NATIVE_MODE_DEFAULT: ${{ vars.CI_NATIVE_MODE || 'off' }}
          CI_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 scripts/check-ci-native-mode.py --self-test
          python3 scripts/check-ci-validation-contract.py
          python3 scripts/check-ci-native-mode.py --gha

  # Compile current frontendDist ONCE, then share SHA-verified bytes across
  # validate and the optional native job. Master comparison is a separate SHA.
  frontend-build:
    needs: impact
    if: needs.impact.outputs.mode != 'docs' || needs.impact.outputs.native_mode != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build frontend once for this exact source
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          git rev-parse HEAD > browseros-ci-source-sha.txt
      - name: Upload checksum-bound frontend build
        uses: actions/upload-artifact@v4
        with:
          name: browseros-ci-dist-${{ github.sha }}
          path: |
            dist/
            browseros-ci-source-sha.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

  validate:
    needs: [impact, frontend-build]
    if: always() && needs.impact.result == 'success' && (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Reduce temporary debug-symbol storage, not tests, assertions or features.
      # Release profile unchanged; current frontend size caps and master delta are verified below.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Legacy UI safety checks
        if: needs.impact.outputs.mode != 'docs'
        run: |
          python3 scripts/check-git-ui-policy.py --self-test
          python3 scripts/check-git-ui-policy.py
          python3 scripts/check-scheduler-ui-policy.py --self-test
          python3 scripts/check-scheduler-ui-policy.py
      - name: Install headless test deps only (no native WebKit build)
        if: needs.impact.outputs.mode == 'full'
        run: |
          df -h . /tmp
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11
      - name: Setup Node
        if: needs.impact.outputs.mode != 'docs'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        if: needs.impact.outputs.mode == 'full'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install frontend dependencies
        if: needs.impact.outputs.mode != 'docs'
        run: npm ci
      - name: Capability, architecture and engineering governance checks
        if: needs.impact.outputs.mode != 'docs'
        run: npm run check
      - name: Rust runtime semantic negative fixtures
        if: needs.impact.outputs.mode == 'full'
        run: node scripts/check-rust-runtime-semantics.mjs --self-test
      - name: Rust cross-layer contract fixtures and blocking gate
        if: needs.impact.outputs.mode == 'full'
        run: |
          python3 scripts/generate-rust-crosslayer-contracts.py --self-test
          npm run check:rust-contracts
          npm run --silent analyze:native-impact -- --command db_query > /tmp/native-impact-db-query.json
          python3 -m json.tool /tmp/native-impact-db-query.json >/dev/null
      - name: Native semantic and evidence fixture tests
        if: needs.impact.outputs.mode == 'full'
        run: |
          node scripts/check-native-semantic-closure.mjs --self-test
          node scripts/check-evidence-lifecycle.mjs --self-test
          node scripts/generate-sbom.mjs --self-test
      - name: Runtime startup checks
        if: needs.impact.outputs.mode == 'full'
        run: npm run check:runtime
      - name: Download one SHA-bound frontend build
        if: needs.impact.outputs.mode != 'docs'
        uses: actions/download-artifact@v4
        with:
          name: browseros-ci-dist-${{ github.sha }}
          path: .
      - name: Verify frontend dist belongs to this exact SHA
        if: needs.impact.outputs.mode != 'docs'
        run: |
          test -s dist/index.html
          test "$(cat browseros-ci-source-sha.txt)" = "$(git rev-parse HEAD)"
      - name: Terminal production bundle differential tests
        if: needs.impact.outputs.mode != 'docs'
        run: node scripts/check-xterm-bundle.mjs
      - name: Terminal Chromium DOM differential tests
        if: needs.impact.outputs.mode == 'full'
        run: dbus-run-session -- node scripts/check-xterm-dom.mjs
      # Check the exact shipped bytes against approved finite caps and the
      # same-run master increment; do not report obsolete cumulative M0 breaches.
      - name: Audited frontend size (approved caps, exact hashes, master delta)
        if: needs.impact.outputs.mode == 'full'
        env:
          SIZE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/master' }}
        run: |
          python3 scripts/check-frontend-size-dual-budget.py --self-test
          python3 scripts/check-frontend-size-dual-budget.py --master-ref "$SIZE_BASE_REF" \
            --out /tmp/browseros-frontend-size-budget.json \
            --editor-out /tmp/browseros-editor-budget-audit.json
      - name: Upload frontend size budget evidence
        if: always() && needs.impact.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: browseros-frontend-size-budget-${{ github.run_id }}
          path: |
            /tmp/browseros-frontend-size-budget.json
            /tmp/browseros-editor-budget-audit.json
          if-no-files-found: warn
      - name: Semantic dependency and bundle evidence
        id: semantic_evidence
        if: needs.impact.outputs.mode == 'full'
        run: |
          node scripts/analyze-semantic-dependencies.mjs --self-test
          node scripts/report-build-assets.mjs --self-test
          npm run --silent analyze:semantic-dependencies > /tmp/browseros-semantic-dependencies.json
          npm run --silent analyze:bundle > /tmp/browseros-build-assets.json
      - name: Upload semantic and bundle evidence
        if: always() && needs.impact.outputs.mode == 'full' && steps.semantic_evidence.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: browseros-semantic-footprint-${{ github.run_id }}
          path: |
            /tmp/browseros-semantic-dependencies.json
            /tmp/browseros-build-assets.json
          if-no-files-found: error
          retention-days: 14
      # Installed GUI and resource sampling are optional and happen in the
      # single native job, not as a mandatory step in every PR.
      - name: Module and installer footprint evidence
        if: needs.impact.outputs.mode == 'full'
        run: |
          python3 scripts/measure-capability-footprint.py --self-test
          python3 scripts/measure-capability-footprint.py --out /tmp/browseros-footprint.json
      - name: Upload footprint evidence
        if: always() && needs.impact.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: browseros-footprint-${{ github.run_id }}
          path: /tmp/browseros-footprint.json
          if-no-files-found: warn
          retention-days: 14
      - name: Resource governance and visual comparison
        id: resource_evidence
        if: needs.impact.outputs.mode == 'full'
        run: |
          node scripts/generate-footprint-review.mjs --self-test
          node scripts/benchmark-resource-scenarios.mjs --self-test
          node scripts/check-duplicate-css.mjs --self-test
          npm run --silent analyze:css-duplicates > /tmp/browseros-css-audit.json
          node scripts/generate-footprint-review.mjs \
            --before docs/engineering/footprint-baselines/master-7ae6fa86.json \
            --after /tmp/browseros-footprint.json \
            --bundle /tmp/browseros-build-assets.json \
            --out /tmp/browseros-size-comparison.html \
            --out-json /tmp/browseros-size-comparison.json
      - name: Upload resource governance evidence
        if: always() && needs.impact.outputs.mode == 'full' && steps.resource_evidence.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: browseros-resource-governance-${{ github.run_id }}
          path: |
            /tmp/browseros-css-audit.json
            /tmp/browseros-size-comparison.html
            /tmp/browseros-size-comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Branch diff whitespace check
        if: needs.impact.outputs.mode == 'full'
        run: git diff --check origin/master...HEAD -- . ':(exclude)logs/m0-baseline/**'
      - name: Verify committed source is unchanged after validation
        if: needs.impact.outputs.mode == 'full'
        run: git diff --exit-code HEAD -- src src-tauri scripts docs package.json package-lock.json vite.config.ts .github
      - name: Full pre-merge gate
        id: pre_merge
        if: needs.impact.outputs.mode == 'full'
        shell: bash
        env:
          M0_BASE_REF: origin/master
          PREMERGE_REUSE_FRONTEND: '1'
          PREMERGE_SKIP_NATIVE_COMPILE: '1'
        run: |
          set -o pipefail
          bash scripts/pre-merge.sh 2>&1 | tee "$RUNNER_TEMP/browseros-pre-merge.log"
      - name: Upload pre-merge diagnostics
        if: always() && needs.impact.outputs.mode == 'full' && steps.pre_merge.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: browseros-pre-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/browseros-pre-merge.log
          if-no-files-found: error
          retention-days: 14
      - name: Runner disk diagnostics
        if: always() && needs.impact.outputs.mode == 'full'
        run: |
          df -h . /tmp
          du -sh src-tauri/target tauri-browser-tabs/target 2>/dev/null || true

      - name: Validation coverage report (SKIPPED is never PASS)
        if: always()
        env:
          NATIVE_MODE: ${{ needs.impact.outputs.native_mode }}
        run: |
          {
            echo "### BrowserOS validation coverage"
            echo "Native mode: $NATIVE_MODE"
            echo "One exact-commit frontend production build is shared by all lanes."
            if [ "$NATIVE_MODE" = "off" ]; then
              echo "Rust compilation/tests: SKIPPED (not PASS)."
              echo "Installed GUI and sustained resources: SKIPPED (not PASS)."
            else
              echo "Rust/installed GUI evidence is produced by the optional native-regression job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Exactly ONE mutually exclusive native build invocation per opted-in run:
  # rust-tests = cargo test; packaged-gui/resource = one Tauri release build.
  # The validated prebuilt frontend is reused, not rebuilt by Tauri.
  native-regression:
    needs: [impact, frontend-build]
    if: always() && needs.impact.result == 'success' && needs.frontend-build.result == 'success' && needs.impact.outputs.native_mode != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Linux WebKit and display deps (opt-in only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xauth dbus-x11
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend tools without compiling frontend
        run: npm ci
      - name: Download the one exact-SHA frontend build
        uses: actions/download-artifact@v4
        with:
          name: browseros-ci-dist-${{ github.sha }}
          path: .
      - name: Verify frontend provenance
        run: |
          test -s dist/index.html
          test "$(cat browseros-ci-source-sha.txt)" = "$(git rev-parse HEAD)"
      - name: Check Rust formatting (no compilation)
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
          cargo fmt --manifest-path tauri-browser-tabs/Cargo.toml --all --check
      - name: Compile and test Rust once (rust-tests mode)
        if: needs.impact.outputs.native_mode == 'rust-tests'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build/install/cold-start one Release (packaged-gui mode)
        if: needs.impact.outputs.native_mode == 'packaged-gui'
        run: dbus-run-session -- xvfb-run -a bash scripts/verify-installed-client.sh --install --prebuilt-frontend
      - name: Build/install/cold-start/sample one Release (packaged-resource mode)
        if: needs.impact.outputs.native_mode == 'packaged-resource'
        run: dbus-run-session -- xvfb-run -a bash scripts/verify-installed-client.sh --install --prebuilt-frontend --resource-minutes 5
      - name: Verify installer provenance without recompilation
        if: needs.impact.outputs.native_mode == 'packaged-gui' || needs.impact.outputs.native_mode == 'packaged-resource'
        run: |
          test -f src-tauri/target/release/bundle/deb/mvp-browser-os_0.1.0_amd64.deb
          git rev-parse HEAD > /tmp/browseros-native-source-sha
          sha256sum src-tauri/target/release/bundle/deb/mvp-browser-os_0.1.0_amd64.deb > /tmp/browseros-native-package-sha256
      - name: Tauri GUI regression with the SAME compiled Release
        if: needs.impact.outputs.native_mode == 'packaged-gui' || needs.impact.outputs.native_mode == 'packaged-resource'
        shell: bash
        run: |
          set +e
          dbus-run-session -- xvfb-run -a python3 scripts/m0-6c-gui-regression.py --no-build --evidence-dir /tmp/m0-6c-browseros
          status=$?
          echo "===== M0-6.c GUI summary ====="
          cat /tmp/m0-6c-browseros/summary.md 2>/dev/null || true
          echo "===== M0-6.c app log tail ====="
          tail -n 120 /tmp/m0-6c-browseros/app.log 2>/dev/null || true
          exit "$status"
      - name: Upload opted-in GUI evidence
        if: always() && (needs.impact.outputs.native_mode == 'packaged-gui' || needs.impact.outputs.native_mode == 'packaged-resource')
        uses: actions/upload-artifact@v4
        with:
          name: browseros-gui-evidence-${{ github.run_id }}
          path: |
            /tmp/m0-6c-browseros/summary.md
            /tmp/m0-6c-browseros/driver-report.json
            /tmp/m0-6c-browseros/mock-events.jsonl
            /tmp/m0-6c-browseros/summary.json
            /tmp/m0-6c-browseros/app.log
            /tmp/mvp-browser-os-verify-startup.log
            /tmp/browseros-native-source-sha
            /tmp/browseros-native-package-sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Upload opted-in sustained resource evidence
        if: always() && needs.impact.outputs.native_mode == 'packaged-resource'
        uses: actions/upload-artifact@v4
        with:
          name: browseros-installed-resource-${{ github.run_id }}
          path: |
            /tmp/browseros-installed-resource.json
            /tmp/browseros-native-resource.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report selected native test coverage
        if: always()
        env:
          NATIVE_MODE: ${{ needs.impact.outputs.native_mode }}
        run: |
          echo "Optional native mode: $NATIVE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Only one Rust compilation path was selected; native outcome must be checked separately." >> "$GITHUB_STEP_SUMMARY"
