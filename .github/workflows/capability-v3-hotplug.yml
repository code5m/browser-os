name: BrowserOS Hot-Plug Acceptance

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: browseros-hotplug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      supply_node: ${{ steps.detect.outputs.supply_node }}
      supply_rust: ${{ steps.detect.outputs.supply_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Determine changed-file risk (fail closed)
        env:
          CI_COMPARE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_COMPARE_HEAD: ${{ github.sha }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        run: |
          python3 scripts/ci-impact.py --self-test
          python3 scripts/ci-impact.py --gha
  hot-plug:
    needs: impact
    if: needs.impact.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unified Hot-Plug Acceptance
        run: node scripts/check-hot-plug-acceptance.mjs
