name: BrowserOS Reviewed Patch Transport

# Temporary development transport, not a validation gate. Applies only the
# reviewed checksum-pinned patch, commits before CI, and never writes master.
on:
  push:
    branches: [feature/developer-studio-unified-20261016]
    paths: [scripts/pr35-reviewed.patch.gz]
permissions:
  contents: read
concurrency:
  group: browseros-pr35-reviewed-patch
  cancel-in-progress: false
jobs:
  commit-reviewed-source:
    if: github.repository == 'code5m/browser-os' && github.ref == 'refs/heads/feature/developer-studio-unified-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PATCH_BASE: 38b579e36b348a1080e4641e521f5ea01fec8c83
      EXPECTED_HEAD: ${{ github.sha }}
      PATCH_SHA256: bedbba29b0a325b3959e91326e2ac9e386f7e205ed4bac7517f52331a1d2ad1a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check base, checksum and exact transport scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$PATCH_BASE"
          test "$GITHUB_REF_NAME" = 'feature/developer-studio-unified-20261016'
          python3 - <<'PY'
          import gzip, hashlib, os, pathlib, subprocess
          expected={'.github/workflows/pr35-reviewed-patch.yml','scripts/pr35-reviewed.patch.gz','docs/engineering/governance.json'}
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['PATCH_BASE'],'HEAD'],text=True).splitlines())
          assert actual==expected, ('unexpected transport changes',actual)
          payload=gzip.decompress(pathlib.Path('scripts/pr35-reviewed.patch.gz').read_bytes())
          assert hashlib.sha256(payload).hexdigest()==os.environ['PATCH_SHA256'], 'patch checksum mismatch'
          pathlib.Path(os.environ['RUNNER_TEMP'],'reviewed.patch').write_bytes(payload)
          PY
          git apply --index --check "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
      - name: Format reviewed Rust source before commit
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Verify write scope and publish ordinary source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed={'docs/engineering/DEVELOPER-STUDIO-UNIFIED-DELIVERY.md','docs/engineering/PR35-BUILD-DEPENDENCY-DECISION-20261016.md','docs/engineering/PR35-REGRESSION-CLOSURE-20261016.md','package.json','scripts/check-command-domain-policy.py','scripts/check-git-studio-source-isolation.mjs','scripts/check-git-ui-logic.mjs','scripts/check-image-preview-policy.py','scripts/check-pr35-dependency-freeze.py','scripts/check-script-domain-policy.py','src-tauri/src/capabilities/database/mysql_studio_e2e.rs','src-tauri/src/capabilities/database/table_data.rs','src/capabilities/git/ui/GitStudio.vue'}
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed==allowed and not untracked, ('write scope mismatch',changed,untracked)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/feature/developer-studio-unified-20261016 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'BrowserOS Integration Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close PR35 repository isolation and dependency-policy regressions'
          git push origin HEAD:refs/heads/feature/developer-studio-unified-20261016
          echo "Committed source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Transport only. No test or merge acceptance is asserted. Remove temporary workflow and payload before final CI/merge.' >> "$GITHUB_STEP_SUMMARY"
