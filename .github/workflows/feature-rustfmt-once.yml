name: One-time Feature Rustfmt
on:
  push:
    branches:
      - feature/jetbrains-import-native-git-context-20261014
    paths:
      - .github/workflows/feature-rustfmt-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jetbrains-import-native-git-context-20261014
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust, remove this temporary workflow, and push no-force
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git rm .github/workflows/feature-rustfmt-once.yml
          git add src-tauri/src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "style(rust): format IDEA and local Git native changes"
          git push origin HEAD:refs/heads/feature/jetbrains-import-native-git-context-20261014
