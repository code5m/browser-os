name: BrowserOS MySQL Runtime E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/src/capabilities/database/**"
      - "src/capabilities/database/**"
      - "src/utils/dbUi.ts"
      - ".github/workflows/mysql-runtime-e2e.yml"
  pull_request:
    branches: [master]
    paths:
      - "src-tauri/src/capabilities/database/**"
      - "src/capabilities/database/**"
      - "src/utils/dbUi.ts"
      - ".github/workflows/mysql-runtime-e2e.yml"

permissions:
  contents: read

concurrency:
  group: browseros-mysql-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      # Both providers use disposable local service containers, not developer
      # or production credentials. They share a single Rust compilation job.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: browseros_e2e
          POSTGRES_USER: browseros_ci
          POSTGRES_PASSWORD: browseros-postgres-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U browseros_ci -d browseros_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: browseros-root-test
          MYSQL_DATABASE: browseros_e2e
          MYSQL_USER: browseros_ci
          MYSQL_PASSWORD: browseros-ci-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pbrowseros-root-test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare embedded Tauri frontend
        run: |
          npm ci
          NODE_OPTIONS=--max-old-space-size=3072 npm run build
      - name: MySQL real driver integration test
        env:
          BROWSEROS_MYSQL_E2E_PASSWORD: browseros-ci-pass
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked mysql_real_e2e -- --ignored --nocapture
      - name: PostgreSQL real driver binary and bigint round trip
        env:
          BROWSEROS_POSTGRES_E2E_PASSWORD: browseros-postgres-fixture
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked postgres_real_e2e_bigint_binary_roundtrip -- --ignored --nocapture
