name: BrowserOS Developer Studio Builder

# Last source-consolidation run. Workflow removal is performed by the connected
# GitHub integration, never by granting the Actions token workflow-write access.
on:
  push:
    branches: [feature/developer-studio-unified-20261016]
    paths:
      - scripts/developer-studio/audit_repair.py
      - scripts/developer-studio/finalize-audit.py
      - scripts/developer-studio/trim-retired-panel.mjs
      - scripts/check-pr35-regressions.mjs
      - .github/workflows/developer-studio-builder.yml
permissions:
  contents: read
concurrency:
  group: browseros-developer-studio-builder
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'code5m/browser-os' && github.ref == 'refs/heads/feature/developer-studio-unified-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xauth dbus-x11
          npm ci
      - name: Retrieve audited integration delta only
        uses: actions/download-artifact@v4
        with:
          name: developer-studio-integration-38842522636
          run-id: 38842522636
          github-token: ${{ github.token }}
          path: /tmp/pr35-audited-input
      - name: Materialize reviewed source and regression fixes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_REF_NAME" = feature/developer-studio-unified-20261016
          echo '65d9b868716c89ef0dd4926a0ec949d15be5e26f50553b8c0ca9232a4fe41466  /tmp/pr35-audited-input/developer-studio-integration.patch' | sha256sum -c -
          git apply --check /tmp/pr35-audited-input/developer-studio-integration.patch
          git apply /tmp/pr35-audited-input/developer-studio-integration.patch
          python3 scripts/developer-studio/audit_repair.py
          node scripts/developer-studio/trim-retired-panel.mjs
          npm install --save-dev --save-exact --ignore-scripts lightningcss@1.33.0
          python3 scripts/developer-studio/finalize-audit.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          python3 scripts/generate-rust-crosslayer-contracts.py --generate
          # Stage workflow/governance finalization for the authorized connector;
          # GITHUB_TOKEN deliberately has no permission to change workflow YAML.
          git diff --binary -- .github/workflows docs/engineering/governance.json > /tmp/pr35-workflow-finalization.patch
          git restore --source=HEAD --staged --worktree -- .github/workflows docs/engineering/governance.json
          git diff --check
      - name: Commit the exact consolidated source before running acceptance
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feature/developer-studio-unified-20261016 | cut -f1)" = "$EXPECTED_HEAD"
          test ! -e scripts/developer-studio
          git config user.name 'BrowserOS Integration Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src src-tauri scripts docs package.json package-lock.json vite.config.ts
          if git ls-files --error-unmatch artifacts/native-contracts/generated-crosslayer-contracts.json >/dev/null 2>&1; then git add -- artifacts/native-contracts/generated-crosslayer-contracts.json; fi
          git diff --cached --stat
          git commit -m 'fix: consolidate PR35 correctness repairs and retire source rewriting scripts'
          git push origin HEAD:refs/heads/feature/developer-studio-unified-20261016
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Committed source under test: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Behavioral regressions on committed source
        run: npm run check:developer-studio
      - name: Existing architecture and semantic gates on committed source
        run: npm run check
      - name: Frontend production build
        run: npm run build
      - name: Native check and real Git SQLite regression tests
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked studio
      - name: Assert validation did not rewrite committed source
        run: git diff --exit-code HEAD -- src src-tauri scripts docs package.json package-lock.json vite.config.ts .github
      - name: Preserve committed source and non-secret dependency evidence
        if: always()
        run: |
          git archive --format=tar.gz HEAD -o /tmp/pr35-committed-source.tar.gz
          tar --exclude='node_modules/@tauri-apps/cli-*' -czf /tmp/pr35-node-dependencies.tar.gz node_modules
          git diff --binary > /tmp/pr35-uncommitted-diff.patch
          git status --short > /tmp/pr35-status.txt
          git rev-parse HEAD > /tmp/pr35-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr35-audit-consolidation-${{ github.run_id }}
          path: |
            /tmp/pr35-committed-source.tar.gz
            /tmp/pr35-node-dependencies.tar.gz
            /tmp/pr35-uncommitted-diff.patch
            /tmp/pr35-status.txt
            /tmp/pr35-head.txt
            /tmp/pr35-workflow-finalization.patch
          retention-days: 7
