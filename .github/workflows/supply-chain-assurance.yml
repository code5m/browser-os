name: BrowserOS Supply Chain Assurance
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browseros-supply-chain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      supply_node: ${{ steps.detect.outputs.supply_node }}
      supply_rust: ${{ steps.detect.outputs.supply_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Determine changed-file risk (fail closed)
        env:
          CI_COMPARE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_COMPARE_HEAD: ${{ github.sha }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        run: |
          python3 scripts/ci-impact.py --self-test
          python3 scripts/ci-impact.py --gha
  node:
    needs: impact
    runs-on: ubuntu-24.04
    if: needs.impact.outputs.supply_node == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strict production and development advisory scan
        run: |
          npm audit --include=dev --audit-level=moderate
      - name: CycloneDX Node/Rust lockfile inventories
        run: |
          node scripts/generate-sbom.mjs --self-test
          node scripts/generate-sbom.mjs
          cd artifacts/sbom
          sha256sum *.cdx.json > checksums.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-sbom-${{ github.run_id }}
          path: artifacts/sbom/
          retention-days: 14
          if-no-files-found: warn
  rust:
    needs: impact
    if: needs.impact.outputs.supply_rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify vendored sources and retain registry advisory origins
        id: origins
        run: |
          node scripts/check-vendored-glib.mjs --self-test
          node scripts/check-vendored-glib.mjs --audit-origin-dir artifacts/supply-chain
          node scripts/generate-sbom.mjs --self-test
          node scripts/generate-sbom.mjs --output-dir artifacts/supply-chain/sbom
      - name: Install Rust advisory scanner
        run: cargo install cargo-audit --locked
      - name: Rust dependency advisory scan
        run: |
          set -o pipefail
          cargo audit --file src-tauri/Cargo.lock 2>&1 | tee artifacts/supply-chain/host.audit.log
      - name: GLib upstream registry-origin advisory scan (not the build lock)
        if: ${{ !cancelled() && steps.origins.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo audit --file artifacts/supply-chain/registry-origin.Cargo.lock 2>&1 | tee artifacts/supply-chain/registry-origin.audit.log
      - name: Packaged Windows rust-analyzer dependency advisory scan
        if: ${{ !cancelled() && steps.origins.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo audit --file vendor/windows-rust-analyzer/Cargo.lock 2>&1 | tee artifacts/supply-chain/rust-analyzer.audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-advisory-evidence-${{ github.run_id }}
          path: artifacts/supply-chain/
          retention-days: 14
          if-no-files-found: warn
  dependency-review:
    needs: impact
    if: github.event_name == 'pull_request' && (needs.impact.outputs.supply_node == 'true' || needs.impact.outputs.supply_rust == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
      - name: Dependency Review support fallback
        if: always()
        run: |
          echo "DEPENDENCY_REVIEW_RESULT=NON_BLOCKING_REPOSITORY_SUPPORT_GATED"
          echo "Dependency Review requires GitHub Dependency Graph support; npm audit, cargo audit and SBOM gates remain authoritative."

  maintenance-lock-transport:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/windows-owner-integrity-complete-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Retrieve the immutable resolver artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14762283278
          repository: code5m/browser-os
          run-id: 45044400425
          github-token: ${{ github.token }}
          merge-multiple: true
          path: maintenance-lock-candidate
      - name: Verify and expose exact candidate bytes for review
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          folder = Path("maintenance-lock-candidate")
          expected_source = "8dac38d64ef4cffa1293dceb9aaeb8935c0a8451"
          source = (folder / "source-sha.txt").read_text().strip()
          if source != expected_source:
              raise SystemExit("LOCK_TRANSPORT_SOURCE_MISMATCH")
          expected_files = {"Cargo.lock", "portable-pty.Cargo.toml"}
          seen = set()
          for line in (folder / "SHA256SUMS").read_text().splitlines():
              digest, path = line.split(None, 1)
              name = Path(path).name
              if name not in expected_files or name in seen:
                  raise SystemExit("LOCK_TRANSPORT_CHECKSUM_SET_MISMATCH")
              seen.add(name)
              if hashlib.sha256((folder / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit("LOCK_TRANSPORT_CHECKSUM_MISMATCH")
          if seen != expected_files:
              raise SystemExit("LOCK_TRANSPORT_CHECKSUM_INCOMPLETE")
          metadata = json.loads((folder / "metadata.json").read_text())
          packages = metadata["packages"]
          glib = [p for p in packages if p["name"] == "glib"]
          if len(glib) != 1 or glib[0]["version"] != "0.18.5" or glib[0]["source"] is not None:
              raise SystemExit("LOCK_TRANSPORT_GLIB_SOURCE_MISMATCH")
          if not glib[0]["manifest_path"].replace("\\", "/").endswith("/src-tauri/vendor/glib-0.18.5/Cargo.toml"):
              raise SystemExit("LOCK_TRANSPORT_GLIB_PATH_MISMATCH")
          if glib[0]["id"] in metadata["workspace_members"]:
              raise SystemExit("LOCK_TRANSPORT_GLIB_WORKSPACE_MISMATCH")
          node_ids = {n["id"] for n in metadata["resolve"]["nodes"]}
          if glib[0]["id"] not in node_ids:
              raise SystemExit("LOCK_TRANSPORT_GLIB_NOT_RESOLVED")
          selected = [p for p in packages if p["name"] == "tauri-utils"]
          if len(selected) != 1 or selected[0]["version"] != "2.10.4":
              raise SystemExit("LOCK_TRANSPORT_TAURI_UTILS_MISMATCH")
          retired = {"pin-utils", "unic-char-property", "unic-char-range", "unic-common", "unic-ucd-ident", "unic-ucd-version"}
          if {p["name"] for p in packages} & retired:
              raise SystemExit("LOCK_TRANSPORT_RETIRED_DEPENDENCY")
          if any(p["name"] == "memoffset" and p["version"] == "0.6.5" for p in packages):
              raise SystemExit("LOCK_TRANSPORT_UNUSED_NIX_MEMOFFSET")
          print("LOCK_TRANSPORT_METADATA " + json.dumps({
              "source": source,
              "metadata_sha256": hashlib.sha256((folder / "metadata.json").read_bytes()).hexdigest(),
              "package_count": len(packages),
              "glib": {"version": glib[0]["version"], "source": glib[0]["source"], "resolved": True},
              "tauri_utils": selected[0]["version"],
              "retired_absent": sorted(retired),
          }, sort_keys=True))
          for name in sorted(expected_files):
              data = (folder / name).read_bytes()
              data.decode("utf-8")
              encoded = base64.b64encode(data).decode("ascii")
              chunks = [encoded[i:i + 4096] for i in range(0, len(encoded), 4096)]
              identity = {
                  "file": name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "git_blob": hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest(),
                  "chunks": len(chunks),
              }
              print("BROWSEROS_TRANSPORT_START " + json.dumps(identity, sort_keys=True))
              for index, chunk in enumerate(chunks):
                  print(f"BROWSEROS_TRANSPORT_CHUNK {name} {index} {chunk}")
              print("BROWSEROS_TRANSPORT_END " + name)
          print("LOCK_CANDIDATE_TRANSPORT=PASS; compiler/runtime/GUI acceptance NOT_RUN")
          PY

  formatter-patch-transport:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/windows-owner-integrity-complete-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Retrieve the exact formatter evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14763028726
          repository: code5m/browser-os
          run-id: 45044572596
          github-token: ${{ github.token }}
          merge-multiple: true
          path: formatter-evidence
      - name: Verify and expose the formatter patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          folder = Path("formatter-evidence")
          if (folder / "SOURCE_COMMIT").read_text().strip() != "8dac38d64ef4cffa1293dceb9aaeb8935c0a8451":
              raise SystemExit("FORMAT_TRANSPORT_SOURCE_MISMATCH")
          status = (folder / "formatter-status.txt").read_text()
          expected = "main_formatter_exit=0\nplugin_formatter_exit=0\noriginal_format_check=FAILED\n"
          if status != expected:
              raise SystemExit("FORMAT_TRANSPORT_FORMATTER_FAILURE")
          name = "formatter.patch"
          data = (folder / name).read_bytes()
          data.decode("utf-8")
          encoded = base64.b64encode(data).decode("ascii")
          chunks = [encoded[i:i + 4096] for i in range(0, len(encoded), 4096)]
          print("BROWSEROS_TRANSPORT_START " + json.dumps({
              "file": name, "bytes": len(data), "chunks": len(chunks),
              "sha256": hashlib.sha256(data).hexdigest(),
              "git_blob": hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest(),
          }, sort_keys=True))
          for index, chunk in enumerate(chunks):
              print(f"BROWSEROS_TRANSPORT_CHUNK {name} {index} {chunk}")
          print("BROWSEROS_TRANSPORT_END " + name)
          print("FORMAT_TRANSPORT=PASS; original format gate remains FAILED")
          PY

  rust-analyzer-security-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/windows-owner-integrity-complete-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Install the unchanged advisory scanner
        run: cargo install cargo-audit --locked
      - name: Resolve and check the pinned rust-analyzer security candidate
        run: python3 scripts/resolve-windows-lsp-security-candidate.py
      - name: Preserve resolver and compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-analyzer-security-candidate-${{ github.sha }}
          path: artifacts/rust-analyzer-security-candidate/
          if-no-files-found: error
          retention-days: 7
