name: BrowserOS Supply Chain Assurance
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browseros-supply-chain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Node production advisory scan
        run: |
          mkdir -p artifacts/sbom
          audit_status=0
          npm audit --omit=dev --json > artifacts/sbom/npm-audit-prod.json || audit_status=$?
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const reportPath = 'artifacts/sbom/npm-audit-prod.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          if (report.error) {
            console.error(`npm audit failed before producing a valid advisory report: ${report.error.summary ?? report.error.code ?? 'unknown error'}`);
            process.exit(1);
          }

          // Historical production-audit debt captured on 2026-10-08. This gate still
          // fails on any new non-baselined moderate/high/critical advisory and on
          // every critical advisory. See docs/engineering/SUPPLY-CHAIN.md.
          const baselinePackages = new Set([
            '@vue/server-renderer',
            'vue',
            'nanoid',
            'postcss',
            'source-map-js',
          ]);

          const severities = new Set(['moderate', 'high', 'critical']);
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {});
          const critical = vulnerabilities.filter(([, v]) => v.severity === 'critical');
          const unexpected = vulnerabilities.filter(([name, v]) => severities.has(v.severity) && !baselinePackages.has(name));
          if (critical.length || unexpected.length) {
            if (critical.length) {
              console.error(`critical advisories are not allowed: ${critical.map(([name]) => name).join(', ')}`);
            }
            if (unexpected.length) {
              console.error(`new non-baselined advisories: ${unexpected.map(([name, v]) => `${name}:${v.severity}`).join(', ')}`);
            }
            process.exit(1);
          }

          const counts = { low: 0, moderate: 0, high: 0, critical: 0 };
          for (const [, vulnerability] of vulnerabilities) {
            counts[vulnerability.severity] = (counts[vulnerability.severity] ?? 0) + 1;
          }
          console.log(
            `NODE_AUDIT_BASELINE_RESULT=PASS_WITH_BASELINE_DEBT packages=${vulnerabilities.length} `
            + `moderate=${counts.moderate} high=${counts.high} critical=${counts.critical}`,
          );
          NODE
          echo "npm_audit_exit_status=${audit_status}"
      - name: Production advisory remediation discovery (temporary diagnostic)
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report=JSON.parse(fs.readFileSync("artifacts/sbom/npm-audit-prod.json","utf8"));
          const data=Object.entries(report.vulnerabilities??{}).map(([name,v])=>({
            name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,
            via:(v.via??[]).map(x=>typeof x==="string"?x:({name:x.name,source:x.source,title:x.title,range:x.range,severity:x.severity,url:x.url})),
          }));
          console.log("PROD_AUDIT_DETAIL="+JSON.stringify(data));
          NODE
          npm audit fix --omit=dev --package-lock-only --ignore-scripts || true
          echo "NPM_LOCK_DIAG_START"
          git diff -- package-lock.json
          echo "NPM_LOCK_DIAG_END"
      - name: CycloneDX Node/Rust lockfile inventories
        run: |
          node scripts/generate-sbom.mjs --self-test
          node scripts/generate-sbom.mjs
          cd artifacts/sbom
          sha256sum *.cdx.json > checksums.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-sbom-${{ github.run_id }}
          path: artifacts/sbom/
          retention-days: 14
          if-no-files-found: warn
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust advisory scanner
        run: cargo install cargo-audit --locked
      - name: Rust dependency advisory scan
        run: cargo audit --file src-tauri/Cargo.lock
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
      - name: Dependency Review support fallback
        if: always()
        run: |
          echo "DEPENDENCY_REVIEW_RESULT=NON_BLOCKING_REPOSITORY_SUPPORT_GATED"
          echo "Dependency Review requires GitHub Dependency Graph support; npm audit, cargo audit and SBOM gates remain authoritative."
