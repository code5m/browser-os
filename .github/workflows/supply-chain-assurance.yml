name: BrowserOS Supply Chain Assurance
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browseros-supply-chain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      supply_node: ${{ steps.detect.outputs.supply_node }}
      supply_rust: ${{ steps.detect.outputs.supply_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Determine changed-file risk (fail closed)
        env:
          CI_COMPARE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_COMPARE_HEAD: ${{ github.sha }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        run: |
          python3 scripts/ci-impact.py --self-test
          python3 scripts/ci-impact.py --gha
  node:
    needs: impact
    runs-on: ubuntu-24.04
    if: needs.impact.outputs.supply_node == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strict production advisory scan
        run: |
          npm audit --omit=dev --audit-level=moderate
      - name: CycloneDX Node/Rust lockfile inventories
        run: |
          node scripts/generate-sbom.mjs --self-test
          node scripts/generate-sbom.mjs
          cd artifacts/sbom
          sha256sum *.cdx.json > checksums.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-sbom-${{ github.run_id }}
          path: artifacts/sbom/
          retention-days: 14
          if-no-files-found: warn
  rust:
    needs: impact
    if: needs.impact.outputs.supply_rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust advisory scanner
        run: cargo install cargo-audit --locked
      - name: Rust dependency advisory scan
        run: cargo audit --file src-tauri/Cargo.lock
  dependency-review:
    needs: impact
    if: github.event_name == 'pull_request' && (needs.impact.outputs.supply_node == 'true' || needs.impact.outputs.supply_rust == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
      - name: Dependency Review support fallback
        if: always()
        run: |
          echo "DEPENDENCY_REVIEW_RESULT=NON_BLOCKING_REPOSITORY_SUPPORT_GATED"
          echo "Dependency Review requires GitHub Dependency Graph support; npm audit, cargo audit and SBOM gates remain authoritative."
