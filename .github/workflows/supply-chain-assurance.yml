name: BrowserOS Supply Chain Assurance
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browseros-supply-chain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Node production advisory scan
        run: npm audit --omit=dev --audit-level=high
      - name: CycloneDX Node/Rust lockfile inventories
        run: |
          node scripts/generate-sbom.mjs --self-test
          node scripts/generate-sbom.mjs
          cd artifacts/sbom
          sha256sum *.cdx.json > checksums.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-sbom-${{ github.run_id }}
          path: artifacts/sbom/
          retention-days: 14
          if-no-files-found: warn
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust advisory scanner
        run: cargo install cargo-audit --locked
      - name: Rust dependency advisory scan
        run: cargo audit --file src-tauri/Cargo.lock
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
