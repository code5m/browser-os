name: BrowserOS Windows V2 experimental native and BFC service
# Reusable native implementation. The already-registered Developer Feedback
# workflow dispatches it only with windows_native=true on the selected ref.
# Branch pushes never start these jobs; do not dispatch this branch-only file.
# Source wiring is not dispatch/native acceptance evidence. No run is implied.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character BrowserOS commit to exercise on every platform
        type: string
        required: true
      build_installer:
        description: Also produce an UNVERIFIED diagnostic NSIS installer
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
    steps:
      - name: Require an immutable requested commit
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be an exact 40-character commit SHA"
            exit 1
          fi
          if [[ "${REQUESTED_SOURCE_SHA,,}" != "$WORKFLOW_SOURCE_SHA" ]]; then
            echo "::error::source_sha must match the selected workflow ref; select the intended branch revision"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Freeze source identity
        id: freeze
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "${REQUESTED_SOURCE_SHA,,}" ]]; then
            echo "::error::Checked-out source differs from the requested commit"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "All native evidence in this run belongs to $actual" >> "$GITHUB_STEP_SUMMARY"
  static-contract:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check-native-required-results.py --self-test
      - run: node tests/check-windows-linux-v2-source-contract.mjs
      - run: node tests/check-bfc-native-contract.mjs
      - run: node tests/check-browser-navigation-and-hang-diagnostics.mjs
      - run: git diff --check HEAD^ HEAD
  windows-bfc-loopback:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: code5m/bfc-workbench
          ref: 5a37c20c8089533facbd61d23d3a2b67694d043b
          path: bfc-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BFC local service regression
        working-directory: bfc-workbench
        run: npm test
      - name: Windows local service health and csrf contract
        shell: pwsh
        run: |
          $env:BILIBILI_FAVORITES_DATA_DIR = Join-Path $env:RUNNER_TEMP 'browseros-bfc-ci'
          New-Item -ItemType Directory -Path $env:BILIBILI_FAVORITES_DATA_DIR -Force | Out-Null
          $server = Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory 'bfc-workbench' -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:4198/api/health'
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Windows BFC local service failed to start' }
            $identityPath = Join-Path $env:BILIBILI_FAVORITES_DATA_DIR '.browseros-service-identity.json'
            $identity = Get-Content -LiteralPath $identityPath -Raw | ConvertFrom-Json
            $caps = Invoke-RestMethod 'http://127.0.0.1:4198/api/capabilities'
            $nonce = [Guid]::NewGuid().ToString('N')
            $tokenBytes = [Convert]::FromHexString($identity.token)
            $hmac = [Security.Cryptography.HMACSHA256]::new($tokenBytes)
            $transcript = "browseros-bfc-identity|$nonce|$($identity.serviceId)|$($identity.protocolVersion)"
            $expectedProof = [Convert]::ToHexString($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($transcript))).ToLowerInvariant()
            $serviceHeaders = @{
              'X-BrowserOS-Challenge' = $nonce
            }
            $proof = Invoke-RestMethod 'http://127.0.0.1:4198/api/identity' -Headers $serviceHeaders
            if ($health.ok -ne $true -or $health.localOnly -ne $true -or
                $health.bilibiliNetworkRequests -ne 0 -or $health.protocolVersion -ne 1 -or
                $caps.version -ne 1 -or $caps.protocolVersion -ne 1 -or
                $caps.serviceId -ne $identity.serviceId -or $caps.bilibili.readSnapshotOnly -ne $true -or
                $caps.bilibili.accountWrites -ne $false -or
                $proof.proof -ne $expectedProof -or $proof.serviceId -ne $identity.serviceId) {
              throw 'Windows BFC service identity/capability contract invalid'
            }
            $session = Invoke-RestMethod 'http://127.0.0.1:4198/api/browseros/session' -Headers @{
              'X-BrowserOS-Service-Token' = $identity.token
            }
            if (-not $session.token -or $session.serviceId -ne $identity.serviceId -or
                $session.protocolVersion -ne 1) { throw 'Authenticated BFC session invalid' }
            Write-Host 'BFC_WINDOWS_LOOPBACK_IDENTITY=PASS'
            $fixture = @{
              source = 'authorized_browser_readback'
              scanId = 'windows_ci_fixture_001'
              reportedTotal = 1
              expectedPages = 1
              folderId = '9'
              folderName = 'CI synthetic'
              traversalFinished = $true
              pages = @{
                '1' = @{items = @(@{bvid='BV1234567890'; title='CI only'})}
              }
            } | ConvertTo-Json -Depth 10
            $receipt = Invoke-RestMethod 'http://127.0.0.1:4198/api/readback/import' -Method POST -ContentType 'application/json' -Headers @{
              Origin = 'http://127.0.0.1:4198'
              'X-Local-CSRF' = $session.token
              'X-BrowserOS-Service-Token' = $identity.token
            } -Body $fixture
            if ($receipt.ok -ne $true -or $receipt.scanId -ne 'windows_ci_fixture_001' -or
                $receipt.pages -ne 1 -or $receipt.cards -ne 1) {
              throw 'Windows BFC synthetic import receipt mismatch'
            }
            $saved = Join-Path $env:BILIBILI_FAVORITES_DATA_DIR 'browser-readback-windows_ci_fixture_001.json'
            if (-not (Test-Path -LiteralPath $saved)) { throw 'Windows BFC did not save the synthetic snapshot' }
            Write-Host 'BFC_WINDOWS_LOCAL_IMPORT=PASS (synthetic data only)'
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Validate bundled Windows BFC foreground launcher and ACL
        shell: pwsh
        run: |
          $launcher = (Resolve-Path scripts/windows/start-bfc-local.ps1).Path
          $serviceDir = (Resolve-Path bfc-workbench).Path
          $dataDir = Join-Path $env:RUNNER_TEMP 'browseros-bfc-launcher'
          $arguments = "-NoProfile -File `"$launcher`" -ServiceDirectory `"$serviceDir`" -DataDirectory `"$dataDir`""
          $stdout = Join-Path $env:RUNNER_TEMP 'bfc-launcher.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'bfc-launcher.stderr.log'
          $process = Start-Process pwsh -ArgumentList $arguments -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:4198/api/health'
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'BFC launcher failed to open loopback service' }
            if (-not (Test-Path -LiteralPath $dataDir -PathType Container)) { throw 'BFC launcher did not create isolated user data directory' }
            $dataAcl = Get-Acl -LiteralPath $dataDir
            $rules = @($dataAcl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $allowed = @('S-1-5-18', $sid)
            if ($rules.Count -ne 2 -or
                @($rules | Where-Object { $_.IdentityReference.Value -notin $allowed -or
                    $_.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow -or
                    $_.FileSystemRights -ne [Security.AccessControl.FileSystemRights]::FullControl -or
                    $_.IsInherited }).Count -ne 0) {
              throw 'BFC launcher data DACL is not exclusive to current user and SYSTEM'
            }
            Write-Host 'BFC_WINDOWS_LAUNCHER_ACL=PASS (no real user login)'
          } catch {
            $process.Refresh()
            $details = @($_.Exception.Message)
            if ($process.HasExited) { $details += "BFC launcher exit code: $($process.ExitCode)" }
            if (Test-Path -LiteralPath $stdout) { $details += @(Get-Content -LiteralPath $stdout | Select-Object -Last 8) }
            if (Test-Path -LiteralPath $stderr) { $details += @(Get-Content -LiteralPath $stderr | Select-Object -Last 12) }
            $details | Select-Object -First 12 | ForEach-Object {
              $message = "$_" -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::error::$message"
            }
            throw
          } finally {
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }
  windows-cargo:
    needs: source
    env:
      BROWSEROS_REQUIRE_CONPTY: '1'
      BROWSEROS_NATIVE_CLEANUP_BLOCKED: '0'
      BROWSEROS_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    runs-on: windows-latest
    # Includes the bounded 45-minute source-runtime build and installer payload check.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rust-analyzer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend and generated Rust contracts for Tauri frontendDist
        run: npm run build
      - name: Confirm Windows platform config and JS boundary
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.windows.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.targets[0] -ne 'nsis' -or $config.bundle.windows.nsis.installMode -ne 'currentUser') { throw 'NSIS config invalid' }
          node tests/check-windows-linux-v2-source-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows source contract failed' }
          python tests/check-local-ai-import.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows local AI import regression failed' }
          python tests/check-ai-native-import.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows native AI import regression failed' }
          python scripts/check-local-ai-secrets.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows AI secret safety regression failed' }
      - name: Build the pinned Windows Rust LSP runtime
        id: windows_lsp_runtime
        timeout-minutes: 45
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_LSP_BUILD_TOOLCHAIN_UNAVAILABLE' }
          ./scripts/build-windows-lsp-runtime.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'browseros-windows-lsp')
      - name: Preserve Windows LSP runtime bytes and provenance
        if: ${{ always() && !cancelled() && steps.windows_lsp_runtime.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browseros-windows-lsp-UNVERIFIED-${{ needs.source.outputs.sha }}
          path: |
            src-tauri/resources/windows-lsp/
            vendor/windows-rust-analyzer/
          if-no-files-found: error
          retention-days: 7
      - name: 'Windows native compile (experimental: do not hide failure)'
        id: windows_native_compile
        shell: pwsh
        run: |
          $output = cargo check --manifest-path src-tauri/Cargo.toml --locked --message-format short 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output | Write-Host
          if ($code -ne 0) {
            $output -split "`r?`n" | Where-Object { $_ -match '(^|\s)error(\[|:)' } |
              Select-Object -First 10 | ForEach-Object {
                $message = $_ -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Host "::error::$message"
              }
            exit $code
          }
      - name: Windows Grid, IPC, Job Object and safe-file unit tests
        shell: pwsh
        run: |
          $buildOutput = @(cargo test --manifest-path src-tauri/Cargo.toml --locked `
            --bin mvp-browser-os --no-run --message-format=json 2>&1)
          if ($LASTEXITCODE -ne 0) {
            $buildOutput | Select-Object -Last 45 | Write-Host
            throw 'Windows native test harness compilation failed'
          }
          $artifacts = @($buildOutput | ForEach-Object {
            try { $_ | ConvertFrom-Json -ErrorAction Stop } catch { $null }
          } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and
            $_.target.name -eq 'mvp-browser-os' -and
            ($_.target.kind -contains 'bin') -and
            $_.profile.test -eq $true -and $_.executable
          })
          if ($artifacts.Count -ne 1) {
            throw "Expected one Windows native test binary, found $($artifacts.Count)"
          }
          $nativeTestExe = [string]$artifacts[0].executable
          if (-not (Test-Path -LiteralPath $nativeTestExe -PathType Leaf)) {
            throw 'Compiled Windows native test executable was not found'
          }
          Write-Host "WINDOWS_NATIVE_TEST_BINARY_READY=$nativeTestExe"
          . ./scripts/windows-native-test-runner.ps1
          $nativeSelections = @((Get-NativeSelectionManifest).selections | Where-Object {
            $_.package -ceq 'mvp-browser-os' -and $_.role -ceq 'required'
          })
          $failedSelections = [System.Collections.Generic.List[string]]::new()
          foreach ($selection in $nativeSelections) {
            try {
              $nativeResult = Invoke-NativeRustHarness -Executable $nativeTestExe -SelectionId $selection.id
            } catch {
              $failedSelections.Add([string]$selection.id)
              if ($env:BROWSEROS_NATIVE_CLEANUP_BLOCKED -eq '1') {
                "Source: $env:BROWSEROS_SOURCE_SHA; full suite: NOT_RUN; runner quarantined because Job emptiness is unconfirmed" |
                  Add-Content $env:GITHUB_STEP_SUMMARY
                throw 'NATIVE_JOB_CLEANUP_UNCONFIRMED: refusing to run another native selection'
              }
              Write-Host "::warning::Continuing native matrix after failed selection: $($selection.id)"
            }
          }
          # Full-suite evidence stays separate from selection counts. It uses
          # the same atomic Job supervisor, enumeration and required-name gate.
          # An ignored additional case can never replace a required passing case.
          $fullSuiteFailure = $null
          $fullSuiteStatus = 'NOT_RUN'
          try {
            $fullResult = Invoke-NativeRustHarness -Executable $nativeTestExe -SelectionId 'windows-full-suite'
            $fullSuiteStatus = $fullResult.status
            Write-Host "WINDOWS_NATIVE_FULL_IGNORED=$($fullResult.ignored) (ignored cases are not acceptance evidence)"
          } catch {
            $fullSuiteFailure = $_.Exception.Message
            if ($_.Exception.Data.Contains('NativeResult')) {
              $fullSuiteStatus = $_.Exception.Data['NativeResult'].status
            } else {
              $fullSuiteStatus = 'BLOCKED'
            }
            Write-Host "::error::Windows full native suite: $fullSuiteStatus"
          }
          $matrixPassed = $nativeSelections.Count - $failedSelections.Count
          Write-Host "WINDOWS_NATIVE_SOURCE_SHA=$env:BROWSEROS_SOURCE_SHA"
          Write-Host "WINDOWS_NATIVE_MATRIX=$matrixPassed/$($nativeSelections.Count) required selections passed"
          Write-Host "WINDOWS_NATIVE_FULL_SUITE=$fullSuiteStatus"
          "Source: $env:BROWSEROS_SOURCE_SHA; required selections: $matrixPassed/$($nativeSelections.Count); full suite: $fullSuiteStatus; GUI: NOT_RUN" |
            Add-Content $env:GITHUB_STEP_SUMMARY
          if ($failedSelections.Count -gt 0 -or $null -ne $fullSuiteFailure) {
            $failedSelections | ForEach-Object { Write-Host "::error::Windows native selection failed: $_" }
            if ($null -ne $fullSuiteFailure) { Write-Host "::error::$fullSuiteFailure" }
            throw "Windows native acceptance incomplete: $($failedSelections.Count) failed selections; full suite $fullSuiteStatus"
          }
      - name: Windows host core library regression
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' && env.BROWSEROS_NATIVE_CLEANUP_BLOCKED != '1' }}
        shell: pwsh
        run: |
          . ./scripts/windows-native-test-runner.ps1
          $testExe = Get-NativeRustTestBinary -Manifest 'src-tauri/Cargo.toml' -Package 'mvp-browser-os' -TargetName 'mvp_core'
          Invoke-NativeRustHarness -Executable $testExe -SelectionId 'host-core'
      - name: Windows Agent Foundation production feature regression
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' && env.BROWSEROS_NATIVE_CLEANUP_BLOCKED != '1' }}
        shell: pwsh
        run: |
          . ./scripts/windows-native-test-runner.ps1
          $testExe = Get-NativeRustTestBinary -Manifest 'src-tauri/Cargo.toml' -Package 'browseros-agent-foundation' `
            -HostPackage 'mvp-browser-os' -Features @('adapter-rig', 'experimental-rig-run')
          Invoke-NativeRustHarness -Executable $testExe -SelectionId 'agent-foundation-production'
      - name: Shared Windows SID and DACL regression
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' && env.BROWSEROS_NATIVE_CLEANUP_BLOCKED != '1' }}
        shell: pwsh
        run: |
          . ./scripts/windows-native-test-runner.ps1
          $testExe = Get-NativeRustTestBinary -Manifest 'crates/browseros-platform-security/Cargo.toml' -Package 'browseros-platform-security'
          Invoke-NativeRustHarness -Executable $testExe -SelectionId 'platform-security'
      - name: Vendored ConPTY and process waiter regression
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' && env.BROWSEROS_NATIVE_CLEANUP_BLOCKED != '1' }}
        shell: pwsh
        run: |
          . ./scripts/windows-native-test-runner.ps1
          $testExe = Get-NativeRustTestBinary -Manifest 'src-tauri/Cargo.toml' -Package 'portable-pty'
          Invoke-NativeRustHarness -Executable $testExe -SelectionId 'portable-pty'
      - name: Windows WebView2 profile ACL regression
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' && env.BROWSEROS_NATIVE_CLEANUP_BLOCKED != '1' }}
        shell: pwsh
        run: |
          . ./scripts/windows-native-test-runner.ps1
          # Select the dependency package through the host's committed lockfile.
          # The plugin has no dev-dependencies requiring an independent workspace.
          $testExe = Get-NativeRustTestBinary -Manifest 'src-tauri/Cargo.toml' -Package 'tauri-plugin-browser-tabs'
          Invoke-NativeRustHarness -Executable $testExe -SelectionId 'browser-profile'
      - name: Preserve native execution counts and logs
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browseros-windows-native-${{ needs.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/required-native-test-results.jsonl
            ${{ runner.temp }}/*.out.log
            ${{ runner.temp }}/*.err.log
          if-no-files-found: warn
          retention-days: 7
      # A separately requested diagnostic installer is never a release or GUI PASS.
      # It can be built after native failures only when explicitly opted in.
      - name: Build experimental NSIS (UNVERIFIED if native tests are red)
        id: nsis_build
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' && env.BROWSEROS_NATIVE_CLEANUP_BLOCKED != '1' && inputs.build_installer == true }}
        shell: pwsh
        run: npx tauri build --bundles nsis --ci
      - name: Generate and verify NSIS SHA256SUMS
        id: nsis_hashes
        if: ${{ always() && !cancelled() && steps.nsis_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'NSIS_INSTALLER_MISSING' }
          $manifest = Join-Path $bundle 'SHA256SUMS.txt'
          $lines = foreach ($installer in $installers) {
            $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest *$($installer.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Get-Location).Path $manifest),
            [string[]]$lines,
            [System.Text.Encoding]::ASCII
          )
          foreach ($installer in $installers) {
            $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not ($lines -contains "$actual *$($installer.Name)")) {
              throw "NSIS_HASH_VERIFICATION_FAILED: $($installer.Name)"
            }
          }
          $lines | Write-Output
      - name: Install NSIS in the disposable runner and verify bundled runtime
        id: nsis_payload
        if: ${{ always() && !cancelled() && steps.nsis_hashes.outcome == 'success' && env.BROWSEROS_NATIVE_CLEANUP_BLOCKED != '1' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'NSIS_INSTALL_REQUIRES_DISPOSABLE_CI' }
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'NSIS_INSTALLER_AMBIGUOUS' }
          $defaultInstallRoot = Join-Path $env:LOCALAPPDATA 'mvp-browser-os'
          $priorInstall = @(Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object {
            $_.PSObject.Properties.Name -contains 'DisplayName' -and $_.DisplayName -ceq 'mvp-browser-os'
          })
          if ((Test-Path -LiteralPath $defaultInstallRoot) -or $priorInstall.Count -ne 0) {
            throw 'NSIS_INSTALL_REQUIRES_FRESH_RUNNER'
          }
          . ./scripts/windows-native-test-runner.ps1
          $installation = Invoke-SupervisedNativeProcess -Executable $installers[0].FullName -Arguments @('/S') -LogPrefix (Join-Path $env:RUNNER_TEMP 'browseros-nsis-install') -TimeoutSeconds 300
          Assert-NativeSupervision -Run $installation -Phase 'nsis-install'
          if ($installation.supervision.ExitCode -ne 0) { throw 'NSIS_INSTALL_FAILED' }
          $installedRoot = Join-Path $env:LOCALAPPDATA 'mvp-browser-os'
          $installedExe = Join-Path $installedRoot 'mvp-browser-os.exe'
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            $entries = @(Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object {
              $_.PSObject.Properties.Name -contains 'DisplayName' -and $_.DisplayName -ceq 'mvp-browser-os' -and
              $_.PSObject.Properties.Name -contains 'InstallLocation' -and -not [string]::IsNullOrWhiteSpace($_.InstallLocation)
            })
            if ($entries.Count -ne 1) { throw 'NSIS_INSTALL_LOCATION_UNRESOLVED' }
            $location = [string]$entries[0].InstallLocation
            if ($location.StartsWith('"') -or $location.EndsWith('"')) {
              if ($location.Length -lt 3 -or -not ($location.StartsWith('"') -and $location.EndsWith('"'))) {
                throw 'NSIS_INSTALL_LOCATION_QUOTING'
              }
              $location = $location.Substring(1, $location.Length - 2)
            }
            if ($location.Contains('"') -or -not [IO.Path]::IsPathFullyQualified($location) -or
                -not (Test-Path -LiteralPath $location -PathType Container)) {
              throw 'NSIS_INSTALL_LOCATION_INVALID'
            }
            $installedExe = Join-Path $location 'mvp-browser-os.exe'
          }
          ./scripts/windows/verify-installed-browseros.ps1 -ExePath $installedExe -PayloadOnly -ExpectedReleaseDirectory 'src-tauri/target/release' -ExpectedRuntimeDirectory 'src-tauri/resources/windows-lsp' -SourceSha $env:BROWSEROS_SOURCE_SHA -EvidenceDir (Join-Path $env:RUNNER_TEMP 'browseros-nsis-payload')
      - name: Preserve NSIS installed payload evidence
        if: ${{ always() && !cancelled() && steps.nsis_payload.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: browseros-windows-nsis-payload-${{ needs.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/browseros-nsis-payload/
            ${{ runner.temp }}/browseros-nsis-install.out.log
            ${{ runner.temp }}/browseros-nsis-install.err.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload NSIS experimental installer and hashes
        if: ${{ always() && !cancelled() && steps.nsis_hashes.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browseros-windows-nsis-UNVERIFIED-${{ needs.source.outputs.sha }}
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 7

  linux-native:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build frontend and generated Rust contracts for Linux frontendDist
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux GTK and Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - name: Provision official Rust LSP and namespace sandbox
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rust-analyzer --toolchain stable
          rustup run stable rust-analyzer --version
          # Jammy's 0.6.1 lacks the required --disable-userns option.
          # Pin the upstream release asset and verify it before building.
          sudo apt-get install -y libcap-dev libselinux1-dev meson ninja-build
          bwrap_archive="$RUNNER_TEMP/bubblewrap-0.13.1.tar.xz"
          bwrap_source="$(mktemp -d "$RUNNER_TEMP/browseros-bwrap.XXXXXX")"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$bwrap_archive" \
            https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz
          printf '%s  %s\n' \
            '0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d' \
            "$bwrap_archive" | sha256sum --check --strict
          tar --extract --xz --file="$bwrap_archive" --directory="$bwrap_source" --strip-components=1
          meson setup "$bwrap_source/build" "$bwrap_source" --buildtype=release --prefix=/usr \
            -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled -Dtests=false
          meson compile -C "$bwrap_source/build" bwrap
          sudo install -m 0755 "$bwrap_source/build/bwrap" /usr/bin/bwrap
          /usr/bin/bwrap --version
      - name: Linux native compile (X11 GTK/WebKit regression)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Linux Grid IPC framing unit tests
        timeout-minutes: 20
        shell: bash
        env:
          BROWSEROS_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os framing_tests -- --list --format terse --color never 2>&1 | tee "$RUNNER_TEMP/linux-framing-list.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os framing_tests -- --test-threads=1 --show-output --color never 2>&1 | tee "$RUNNER_TEMP/linux-framing.log"
          python3 scripts/check-native-required-results.py \
            --selection grid-framing \
            --listing "$RUNNER_TEMP/linux-framing-list.log" \
            --output "$RUNNER_TEMP/linux-framing.log" \
            --evidence "$RUNNER_TEMP/linux-framing-required-results.json" \
            --failure-prefix LINUX_REQUIRED_FRAMING_NOT_EXECUTED
      - name: Linux core and Agent Foundation production feature regression
        timeout-minutes: 20
        shell: bash
        env:
          BROWSEROS_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -o pipefail
          # Select the host to enable its path dependency's exact production
          # features through the host lockfile. No optional adapters are added.
          library_args=(--manifest-path src-tauri/Cargo.toml --locked -p mvp-browser-os -p browseros-agent-foundation --lib
            --features browseros-agent-foundation/adapter-rig,browseros-agent-foundation/experimental-rig-run)
          cargo test "${library_args[@]}" -- --list --format terse --color never 2>&1 | tee "$RUNNER_TEMP/linux-libraries-list.log"
          cargo test "${library_args[@]}" -- --test-threads=1 --show-output --color never 2>&1 | tee "$RUNNER_TEMP/linux-libraries.log"
          python3 scripts/check-native-required-results.py \
            --selection host-core --selection agent-foundation-production --harness-count 2 \
            --listing "$RUNNER_TEMP/linux-libraries-list.log" \
            --output "$RUNNER_TEMP/linux-libraries.log" \
            --evidence "$RUNNER_TEMP/linux-libraries-required-results.json"
      - name: Linux real Rust LSP and bubblewrap isolation regression
        timeout-minutes: 10
        shell: bash
        env:
          BROWSEROS_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          lsp_args=(--manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os
            capabilities::agent::coding_lsp::tests::)
          cargo test "${lsp_args[@]}" -- --ignored --list --format terse --color never 2>&1 | tee "$RUNNER_TEMP/linux-lsp-list.log"
          cargo test "${lsp_args[@]}" -- --ignored --test-threads=1 --show-output --color never 2>&1 | tee "$RUNNER_TEMP/linux-lsp.log"
          python3 scripts/check-native-required-results.py \
            --manifest scripts/linux-native-required-tests.json \
            --selection linux-lsp-isolation \
            --listing "$RUNNER_TEMP/linux-lsp-list.log" \
            --output "$RUNNER_TEMP/linux-lsp.log" \
            --evidence "$RUNNER_TEMP/linux-lsp-required-results.json" \
            --failure-prefix LINUX_REQUIRED_LSP_NOT_EXECUTED
      - name: Linux complete native regression (GUI remains NOT_RUN)
        timeout-minutes: 40
        shell: bash
        env:
          BROWSEROS_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/linux-native.log"
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path(os.environ["RUNNER_TEMP"], "linux-native.log").read_text(errors="replace")
          rows = re.findall(r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;", text, re.M)
          if not rows or sum(int(row[1]) for row in rows) == 0:
              raise SystemExit("LINUX_NATIVE_NO_EXECUTED_TESTS")
          if any(row[0] != "ok" or int(row[2]) for row in rows) or re.search(r"^\s*\[?SKIP(?:PED)?\b", text, re.M | re.I):
              raise SystemExit("LINUX_NATIVE_INCOMPLETE")
          ignored = sum(int(row[3]) for row in rows)
          status = "PASS_WITH_IGNORED" if ignored else "PASS"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Linux source={os.environ['BROWSEROS_SOURCE_SHA']}; native={status}; ignored={ignored}; GUI=NOT_RUN\n")
          PY
      - name: Preserve Linux native output
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browseros-linux-native-${{ needs.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/linux-native.log
            ${{ runner.temp }}/linux-framing.log
            ${{ runner.temp }}/linux-framing-list.log
            ${{ runner.temp }}/linux-framing-required-results.json
            ${{ runner.temp }}/linux-libraries.log
            ${{ runner.temp }}/linux-libraries-list.log
            ${{ runner.temp }}/linux-libraries-required-results.json
            ${{ runner.temp }}/linux-lsp.log
            ${{ runner.temp }}/linux-lsp-list.log
            ${{ runner.temp }}/linux-lsp-required-results.json
          if-no-files-found: warn
          retention-days: 7
