name: BrowserOS Windows V2 experimental native and BFC service
# Native execution is explicitly opt-in. Branch pushes never start this workflow.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character BrowserOS commit to exercise on every platform
        type: string
        required: true
      build_installer:
        description: Also produce an UNVERIFIED diagnostic NSIS installer
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
    steps:
      - name: Require an immutable requested commit
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be an exact 40-character commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Freeze source identity
        id: freeze
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "${REQUESTED_SOURCE_SHA,,}" ]]; then
            echo "::error::Checked-out source differs from the requested commit"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "All native evidence in this run belongs to $actual" >> "$GITHUB_STEP_SUMMARY"
  static-contract:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-windows-linux-v2-source-contract.mjs
      - run: node tests/check-bfc-native-contract.mjs
      - run: node tests/check-browser-navigation-and-hang-diagnostics.mjs
      - run: git diff --check HEAD^ HEAD
  windows-bfc-loopback:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: code5m/bfc-workbench
          ref: 5a37c20c8089533facbd61d23d3a2b67694d043b
          path: bfc-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BFC local service regression
        working-directory: bfc-workbench
        run: npm test
      - name: Windows local service health and csrf contract
        shell: pwsh
        run: |
          $env:BILIBILI_FAVORITES_DATA_DIR = Join-Path $env:RUNNER_TEMP 'browseros-bfc-ci'
          New-Item -ItemType Directory -Path $env:BILIBILI_FAVORITES_DATA_DIR -Force | Out-Null
          $server = Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory 'bfc-workbench' -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:4198/api/health'
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Windows BFC local service failed to start' }
            $identityPath = Join-Path $env:BILIBILI_FAVORITES_DATA_DIR '.browseros-service-identity.json'
            $identity = Get-Content -LiteralPath $identityPath -Raw | ConvertFrom-Json
            $caps = Invoke-RestMethod 'http://127.0.0.1:4198/api/capabilities'
            $nonce = [Guid]::NewGuid().ToString('N')
            $tokenBytes = [Convert]::FromHexString($identity.token)
            $hmac = [Security.Cryptography.HMACSHA256]::new($tokenBytes)
            $transcript = "browseros-bfc-identity|$nonce|$($identity.serviceId)|$($identity.protocolVersion)"
            $expectedProof = [Convert]::ToHexString($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($transcript))).ToLowerInvariant()
            $serviceHeaders = @{
              'X-BrowserOS-Challenge' = $nonce
            }
            $proof = Invoke-RestMethod 'http://127.0.0.1:4198/api/identity' -Headers $serviceHeaders
            if ($health.ok -ne $true -or $health.localOnly -ne $true -or
                $health.bilibiliNetworkRequests -ne 0 -or $health.protocolVersion -ne 1 -or
                $caps.version -ne 1 -or $caps.protocolVersion -ne 1 -or
                $caps.serviceId -ne $identity.serviceId -or $caps.bilibili.readSnapshotOnly -ne $true -or
                $caps.bilibili.accountWrites -ne $false -or
                $proof.proof -ne $expectedProof -or $proof.serviceId -ne $identity.serviceId) {
              throw 'Windows BFC service identity/capability contract invalid'
            }
            $session = Invoke-RestMethod 'http://127.0.0.1:4198/api/browseros/session' -Headers @{
              'X-BrowserOS-Service-Token' = $identity.token
            }
            if (-not $session.token -or $session.serviceId -ne $identity.serviceId -or
                $session.protocolVersion -ne 1) { throw 'Authenticated BFC session invalid' }
            Write-Host 'BFC_WINDOWS_LOOPBACK_IDENTITY=PASS'
            $fixture = @{
              source = 'authorized_browser_readback'
              scanId = 'windows_ci_fixture_001'
              reportedTotal = 1
              expectedPages = 1
              folderId = '9'
              folderName = 'CI synthetic'
              traversalFinished = $true
              pages = @{
                '1' = @{items = @(@{bvid='BV1234567890'; title='CI only'})}
              }
            } | ConvertTo-Json -Depth 10
            $receipt = Invoke-RestMethod 'http://127.0.0.1:4198/api/readback/import' -Method POST -ContentType 'application/json' -Headers @{
              Origin = 'http://127.0.0.1:4198'
              'X-Local-CSRF' = $session.token
              'X-BrowserOS-Service-Token' = $identity.token
            } -Body $fixture
            if ($receipt.ok -ne $true -or $receipt.scanId -ne 'windows_ci_fixture_001' -or
                $receipt.pages -ne 1 -or $receipt.cards -ne 1) {
              throw 'Windows BFC synthetic import receipt mismatch'
            }
            $saved = Join-Path $env:BILIBILI_FAVORITES_DATA_DIR 'browser-readback-windows_ci_fixture_001.json'
            if (-not (Test-Path -LiteralPath $saved)) { throw 'Windows BFC did not save the synthetic snapshot' }
            Write-Host 'BFC_WINDOWS_LOCAL_IMPORT=PASS (synthetic data only)'
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Validate bundled Windows BFC foreground launcher and ACL
        shell: pwsh
        run: |
          $launcher = (Resolve-Path scripts/windows/start-bfc-local.ps1).Path
          $serviceDir = (Resolve-Path bfc-workbench).Path
          $dataDir = Join-Path $env:RUNNER_TEMP 'browseros-bfc-launcher'
          $arguments = "-NoProfile -File `"$launcher`" -ServiceDirectory `"$serviceDir`" -DataDirectory `"$dataDir`""
          $stdout = Join-Path $env:RUNNER_TEMP 'bfc-launcher.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'bfc-launcher.stderr.log'
          $process = Start-Process pwsh -ArgumentList $arguments -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:4198/api/health'
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'BFC launcher failed to open loopback service' }
            if (-not (Test-Path -LiteralPath $dataDir -PathType Container)) { throw 'BFC launcher did not create isolated user data directory' }
            $dataAcl = Get-Acl -LiteralPath $dataDir
            $rules = @($dataAcl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $allowed = @('S-1-5-18', $sid)
            if ($rules.Count -ne 2 -or
                @($rules | Where-Object { $_.IdentityReference.Value -notin $allowed -or
                    $_.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow -or
                    $_.FileSystemRights -ne [Security.AccessControl.FileSystemRights]::FullControl -or
                    $_.IsInherited }).Count -ne 0) {
              throw 'BFC launcher data DACL is not exclusive to current user and SYSTEM'
            }
            Write-Host 'BFC_WINDOWS_LAUNCHER_ACL=PASS (no real user login)'
          } catch {
            $process.Refresh()
            $details = @($_.Exception.Message)
            if ($process.HasExited) { $details += "BFC launcher exit code: $($process.ExitCode)" }
            if (Test-Path -LiteralPath $stdout) { $details += @(Get-Content -LiteralPath $stdout | Select-Object -Last 8) }
            if (Test-Path -LiteralPath $stderr) { $details += @(Get-Content -LiteralPath $stderr | Select-Object -Last 12) }
            $details | Select-Object -First 12 | ForEach-Object {
              $message = "$_" -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::error::$message"
            }
            throw
          } finally {
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }
  windows-cargo:
    needs: source
    env:
      BROWSEROS_REQUIRE_CONPTY: '1'
      BROWSEROS_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rust-analyzer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend and generated Rust contracts for Tauri frontendDist
        run: npm run build
      - name: Confirm Windows platform config and JS boundary
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.windows.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.targets[0] -ne 'nsis' -or $config.bundle.windows.nsis.installMode -ne 'currentUser') { throw 'NSIS config invalid' }
          node tests/check-windows-linux-v2-source-contract.mjs
      - name: 'Windows native compile (experimental: do not hide failure)'
        id: windows_native_compile
        shell: pwsh
        run: |
          $output = cargo check --manifest-path src-tauri/Cargo.toml --locked --message-format short 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output | Write-Host
          if ($code -ne 0) {
            $output -split "`r?`n" | Where-Object { $_ -match '(^|\s)error(\[|:)' } |
              Select-Object -First 10 | ForEach-Object {
                $message = $_ -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Host "::error::$message"
              }
            exit $code
          }
      - name: Windows Grid, IPC, Job Object and safe-file unit tests
        shell: pwsh
        run: |
          $buildOutput = @(cargo test --manifest-path src-tauri/Cargo.toml --locked `
            --bin mvp-browser-os --no-run --message-format=json 2>&1)
          if ($LASTEXITCODE -ne 0) {
            $buildOutput | Select-Object -Last 45 | Write-Host
            throw 'Windows native test harness compilation failed'
          }
          $artifacts = @($buildOutput | ForEach-Object {
            try { $_ | ConvertFrom-Json -ErrorAction Stop } catch { $null }
          } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and
            $_.target.name -eq 'mvp-browser-os' -and
            ($_.target.kind -contains 'bin') -and
            $_.profile.test -eq $true -and $_.executable
          })
          if ($artifacts.Count -ne 1) {
            throw "Expected one Windows native test binary, found $($artifacts.Count)"
          }
          $nativeTestExe = [string]$artifacts[0].executable
          if (-not (Test-Path -LiteralPath $nativeTestExe -PathType Leaf)) {
            throw 'Compiled Windows native test executable was not found'
          }
          Write-Host "WINDOWS_NATIVE_TEST_BINARY_READY=$nativeTestExe"
          function Invoke-NativeCargoTest([string]$filter, [int]$timeoutSeconds = 240) {
            $slug = ($filter -replace '[^A-Za-z0-9_.-]', '_')
            $stdout = Join-Path $env:RUNNER_TEMP "$slug.out.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$slug.err.log"
            Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue
            Write-Host "::group::native test $filter (timeout ${timeoutSeconds}s) at $(Get-Date -Format o)"
            $process = Start-Process -FilePath $nativeTestExe -NoNewWindow -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
              -ArgumentList @($filter, '--test-threads=1', '--nocapture')
            $finished = $process.WaitForExit($timeoutSeconds * 1000)
            if (-not $finished) {
              try { $process.Kill($true) } catch {}
              Write-Host "::error::Native test timeout after ${timeoutSeconds}s: $filter"
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue | Write-Host
              Write-Host "::endgroup::"
              throw "Native test timeout: $filter"
            }
            $process.WaitForExit()
            $code = $process.ExitCode
            $output = ((Get-Content $stdout -ErrorAction SilentlyContinue) + (Get-Content $stderr -ErrorAction SilentlyContinue) | Out-String)
            $output | Write-Host
            Write-Host "::endgroup::"
            if ($code -ne 0) {
              $allLines = @($output -split "`r?`n")
              $details = @($allLines | Where-Object {
                $_ -match 'FAILED|panicked at|error(\[|:)|failures:|exit=|output=|thread '
              } | Select-Object -Last 20)
              if ($details.Count -eq 0) { $details = @($allLines | Select-Object -Last 20) }
              $details += "Native test failed: $filter"
              $details | ForEach-Object {
                $message = "$_" -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Host "::error::$message"
              }
              throw "Native test failed: $filter"
            }
            $summaries = [regex]::Matches($output, '(?m)^test result: ok\. (?<passed>\d+) passed; (?<failed>\d+) failed; (?<ignored>\d+) ignored;')
            if ($summaries.Count -ne 1 -or
                [int]$summaries[0].Groups['passed'].Value -lt 1 -or
                [int]$summaries[0].Groups['failed'].Value -ne 0 -or
                [int]$summaries[0].Groups['ignored'].Value -ne 0 -or
                $output -match '(?im)^\s*\[?SKIP(?:PED)?\b') {
              throw "Required native filter did not execute all selected cases: $filter"
            }
          }
          $nativeTests = @(
            'windows_grid_tests'
            'framing_tests'
            'authorized_windows_read'
            'pinned_handle_move'
            'windows_cas'
            'capabilities::workspace::cas::tests'
            'local_owner_pipe_roundtrip'
            'suspended_spawn_assigns_job_before_immediate_grandchild_can_run'
            'dropping_job_after_parent_crash_kills_grandchild'
            'windows_script_cancel_reaps_immediate_node_grandchild'
            'windows_script_timeout_reaps_immediate_node_grandchild'
            'windows_script_parent_crash_drops_job_and_reaps_grandchild'
            # Cover the entire windows_process module, not just selected
            # process/ConPTY fixtures that happened to pass on one runner.
            'windows_process::'
            'conpty_terminal_uses_atomic_job_list_and_reaps_immediate_grandchild'
            'conpty_rejects_invalid_terminal_dimensions'
            'conpty_child_exit_code_259_is_terminal_and_kill_is_idempotent'
            'job_tree_is_terminated'
            'windows_script_whitelist_rejects_shell_execution'
            'windows_node_script_executes_in_job'
            'windows_coding_can_read_an_authorized_regular_file'
            'windows_agent_'
            'capabilities::agent::windows_sandbox::tests'
            'real_appcontainer_stdio_initializes_lists_calls_and_scrubs_secrets'
            'stdin_backpressure_obeys_deadline'
            'snapshot_rejects_junctions_instead_of_copying_external_sources'
            'private_snapshot_requires_own_package_sid_and_rejects_other_profiles'
            'real_rust_analyzer_runs_against_private_snapshot'
            'fake_loopback_port_occupant_cannot_receive_snapshot_before_identity_proof'
            'process_execution_requires_explicit_approval_and_rejects_shell_actions'
            'knowledge_search_redacts_sensitive_lines'
          )
          $failedFilters = [System.Collections.Generic.List[string]]::new()
          foreach ($filter in $nativeTests) {
            $seconds = if ($filter -eq 'real_rust_analyzer_runs_against_private_snapshot') { 600 } else { 240 }
            try {
              Invoke-NativeCargoTest -filter $filter -timeoutSeconds $seconds
            } catch {
              $failedFilters.Add($filter)
              Write-Host "::warning::Continuing native matrix after failed check: $filter"
            }
          }
          # Keep full-suite status separate from filter counts. A full-suite
          # failure is not a thirty-first filter and must not subtract a second
          # time from filters whose failure is already recorded.
          $fullSuiteFailure = $null
          $fullSuiteStatus = 'NOT_RUN'
          $fullOut = Join-Path $env:RUNNER_TEMP "full-windows-native.out.log"
          $fullErr = Join-Path $env:RUNNER_TEMP "full-windows-native.err.log"
          Remove-Item $fullOut, $fullErr -Force -ErrorAction SilentlyContinue
          Write-Host "::group::full Windows native test suite"
          $full = Start-Process -FilePath $nativeTestExe -NoNewWindow -PassThru -RedirectStandardOutput $fullOut -RedirectStandardError $fullErr -ArgumentList @('--test-threads=1', '--nocapture')
          $fullFinished = $full.WaitForExit(900000)
          if (-not $fullFinished) {
            try { $full.Kill($true) } catch {}
            $fullSuiteFailure = 'full_windows_native_suite_timeout'
            $fullSuiteStatus = 'TIMEOUT'
            Write-Host "::error::Windows full native suite exceeded 900 seconds"
          } else {
            $full.WaitForExit()
            if ($full.ExitCode -ne 0) {
              $fullSuiteFailure = 'full_windows_native_suite'
              $fullSuiteStatus = 'FAIL'
              Write-Host "::error::Windows full native suite exit=$($full.ExitCode)"
            } else {
              $fullSuiteStatus = 'COMPLETED'
            }
          }
          $fullOutput = ((Get-Content $fullOut -ErrorAction SilentlyContinue) + (Get-Content $fullErr -ErrorAction SilentlyContinue) | Out-String)
          $fullOutput -split "`r?`n" | Select-Object -Last 160 | Write-Host
          $fullSummary = [regex]::Matches($fullOutput, '(?m)^test result: (?<result>ok|FAILED)\. (?<passed>\d+) passed; (?<failed>\d+) failed; (?<ignored>\d+) ignored;')
          if ($fullSuiteStatus -eq 'COMPLETED') {
            if ($fullSummary.Count -ne 1 -or [int]$fullSummary[0].Groups['passed'].Value -lt 1) {
              $fullSuiteFailure = 'full_windows_native_suite_no_executed_tests'
              $fullSuiteStatus = 'BLOCKED'
            } elseif ($fullSummary[0].Groups['result'].Value -ne 'ok' -or
                [int]$fullSummary[0].Groups['failed'].Value -ne 0 -or
                $fullOutput -match '(?im)^\s*\[?SKIP(?:PED)?\b') {
              $fullSuiteFailure = 'full_windows_native_suite_incomplete'
              $fullSuiteStatus = 'BLOCKED'
            } else {
              $ignored = [int]$fullSummary[0].Groups['ignored'].Value
              $fullSuiteStatus = if ($ignored -eq 0) { 'PASS' } else { 'PASS_WITH_IGNORED' }
              Write-Host "WINDOWS_NATIVE_FULL_IGNORED=$ignored (ignored cases are not acceptance evidence)"
            }
          }
          Write-Host "::endgroup::"
          $matrixPassed = $nativeTests.Count - $failedFilters.Count
          Write-Host "WINDOWS_NATIVE_SOURCE_SHA=$env:BROWSEROS_SOURCE_SHA"
          Write-Host "WINDOWS_NATIVE_MATRIX=$matrixPassed/$($nativeTests.Count) filters passed"
          Write-Host "WINDOWS_NATIVE_FULL_SUITE=$fullSuiteStatus"
          "Source: $env:BROWSEROS_SOURCE_SHA; filters: $matrixPassed/$($nativeTests.Count); full suite: $fullSuiteStatus; GUI: NOT_RUN" |
            Add-Content $env:GITHUB_STEP_SUMMARY
          if ($failedFilters.Count -gt 0 -or $null -ne $fullSuiteFailure) {
            $failedFilters | ForEach-Object { Write-Host "::error::Windows native filter failed: $_" }
            if ($null -ne $fullSuiteFailure) { Write-Host "::error::$fullSuiteFailure" }
            throw "Windows native acceptance incomplete: $($failedFilters.Count) failed filters; full suite $fullSuiteStatus"
          }
      - name: Shared Windows SID and DACL regression
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --manifest-path crates/browseros-platform-security/Cargo.toml --locked --lib -- --test-threads=1
      - name: Vendored ConPTY and process waiter regression
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked `
            -p portable-pty --lib -- --test-threads=1 --nocapture
      - name: Windows WebView2 profile ACL regression
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --manifest-path tauri-browser-tabs/Cargo.toml `
            -p tauri-plugin-browser-tabs --lib `
            windows_profile_acl_contains_only_current_user_and_system -- --test-threads=1
      # A separately requested diagnostic installer is never a release or GUI PASS.
      # It can be built after native failures only when explicitly opted in.
      - name: Build experimental NSIS (UNVERIFIED if native tests are red)
        id: nsis_build
        if: ${{ always() && !cancelled() && steps.windows_native_compile.outcome == 'success' && inputs.build_installer == true }}
        shell: pwsh
        run: npx tauri build --bundles nsis --ci
      - name: Generate and verify NSIS SHA256SUMS
        id: nsis_hashes
        if: ${{ always() && !cancelled() && steps.nsis_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'NSIS_INSTALLER_MISSING' }
          $manifest = Join-Path $bundle 'SHA256SUMS.txt'
          $lines = foreach ($installer in $installers) {
            $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest *$($installer.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Get-Location).Path $manifest),
            [string[]]$lines,
            [System.Text.Encoding]::ASCII
          )
          foreach ($installer in $installers) {
            $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not ($lines -contains "$actual *$($installer.Name)")) {
              throw "NSIS_HASH_VERIFICATION_FAILED: $($installer.Name)"
            }
          }
      - name: Upload NSIS experimental installer and hashes
        if: ${{ always() && !cancelled() && steps.nsis_hashes.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browseros-windows-nsis-UNVERIFIED-${{ needs.source.outputs.sha }}
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 7

  linux-native:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build frontend and generated Rust contracts for Linux frontendDist
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux GTK and Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - name: Linux native compile (X11 GTK/WebKit regression)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Linux Grid IPC framing unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os framing_tests -- --test-threads=1
