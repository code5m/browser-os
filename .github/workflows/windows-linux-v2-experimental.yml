name: BrowserOS Windows V2 experimental native and BFC service
on:
  push:
    branches:
      - 'feature/browseros-windows-linux-v2-onepass-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-windows-linux-v2-source-contract.mjs
      - run: node tests/check-bfc-native-contract.mjs
      - run: git diff --check HEAD^ HEAD
  windows-bfc-loopback:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: code5m/bfc-workbench
          ref: f98f280e8194e40df106d7176c92c9402215e330
          path: bfc-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BFC local service regression
        working-directory: bfc-workbench
        run: npm test
      - name: Windows local service health and csrf contract
        shell: pwsh
        run: |
          $env:BILIBILI_FAVORITES_DATA_DIR = Join-Path $env:RUNNER_TEMP 'browseros-bfc-ci'
          New-Item -ItemType Directory -Path $env:BILIBILI_FAVORITES_DATA_DIR -Force | Out-Null
          $server = Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory 'bfc-workbench' -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:4198/api/health'
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Windows BFC local service failed to start' }
            $session = Invoke-RestMethod 'http://127.0.0.1:4198/api/session'
            $caps = Invoke-RestMethod 'http://127.0.0.1:4198/api/capabilities'
            if ($health.localOnly -ne $true -or $health.bilibiliNetworkRequests -ne 0 -or
                -not $session.token -or $caps.bilibili.readSnapshotOnly -ne $true) {
              throw 'Windows BFC service contract invalid'
            }
            Write-Host 'BFC_WINDOWS_LOOPBACK_HEALTH=PASS'
            # No real user data or Bilibili network calls. Verify that a
            # minimal synthetic readback snapshot reaches disk with receipt.
            $fixture = @{
              source = 'authorized_browser_readback'
              scanId = 'windows_ci_fixture_001'
              reportedTotal = 1
              expectedPages = 1
              folderId = '9'
              folderName = 'CI synthetic'
              traversalFinished = $true
              pages = @{
                '1' = @{items = @(@{bvid='BV1234567890'; title='CI only'})}
              }
            } | ConvertTo-Json -Depth 10
            $receipt = Invoke-RestMethod 'http://127.0.0.1:4198/api/readback/import' -Method POST -ContentType 'application/json' -Headers @{
              Origin = 'http://127.0.0.1:4198'
              'X-Local-CSRF' = $session.token
            } -Body $fixture
            if ($receipt.ok -ne $true -or $receipt.scanId -ne 'windows_ci_fixture_001' -or
                $receipt.pages -ne 1 -or $receipt.cards -ne 1) {
              throw 'Windows BFC synthetic import receipt mismatch'
            }
            $saved = Join-Path $env:BILIBILI_FAVORITES_DATA_DIR 'browser-readback-windows_ci_fixture_001.json'
            if (-not (Test-Path -LiteralPath $saved)) { throw 'Windows BFC did not save the synthetic snapshot' }
            Write-Host 'BFC_WINDOWS_LOCAL_IMPORT=PASS (synthetic data only)'
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Validate bundled Windows BFC foreground launcher and ACL
        shell: pwsh
        run: |
          $launcher = (Resolve-Path scripts/windows/start-bfc-local.ps1).Path
          $serviceDir = (Resolve-Path bfc-workbench).Path
          $dataDir = Join-Path $env:RUNNER_TEMP 'browseros-bfc-launcher'
          $arguments = "-NoProfile -File `"$launcher`" -ServiceDirectory `"$serviceDir`" -DataDirectory `"$dataDir`""
          $process = Start-Process pwsh -ArgumentList $arguments -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:4198/api/health'
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'BFC launcher failed to open loopback service' }
            if (-not (Test-Path -LiteralPath $dataDir -PathType Container)) { throw 'BFC launcher did not create isolated user data directory' }
            Write-Host 'BFC_WINDOWS_LAUNCHER=PASS (no real user login)'
          } finally {
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }
  windows-cargo:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend and generated Rust contracts for Tauri frontendDist
        run: npm run build
      - name: Confirm Windows platform config and JS boundary
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.windows.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.targets[0] -ne 'nsis' -or $config.bundle.windows.nsis.installMode -ne 'currentUser') { throw 'NSIS config invalid' }
          node tests/check-windows-linux-v2-source-contract.mjs
      - name: 'Windows native compile (experimental: do not hide failure)'
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Windows Grid, IPC, Job Object and safe-file unit tests
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os windows_grid_tests -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os framing_tests -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os authorized_windows_read -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os pinned_handle_move -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os local_owner_pipe_roundtrip -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os job_tree_is_terminated -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os windows_script_whitelist_rejects_shell_execution -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os windows_coding_can_read_an_authorized_regular_file -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os read_only_context_rejects_process_execution -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os knowledge_search_redacts_sensitive_lines -- --test-threads=1
      - name: Build release NSIS after successful Windows compilation
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: npx tauri build --bundles nsis --ci
      - name: Upload NSIS installer and hashes
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: browseros-windows-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 7

  linux-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build frontend and generated Rust contracts for Linux frontendDist
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux GTK and Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - name: Linux native compile (X11 GTK/WebKit regression)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Linux Grid IPC framing unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --bin mvp-browser-os framing_tests -- --test-threads=1
