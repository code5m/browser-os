name: Temporary Diagnose Node Audit Fix

on:
  push:
    branches:
      - feature/engineering-assurance-one-pass
    paths:
      - '.github/workflows/diagnose-node-audit-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/engineering-assurance-one-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate audit fix patch
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only || true
          echo '===== PACKAGE AUDIT FIX DIFF START ====='
          git diff -- package.json package-lock.json
          echo '===== PACKAGE AUDIT FIX DIFF END ====='
          echo '===== PRODUCTION AUDIT AFTER FIX START ====='
          npm audit --omit=dev --audit-level=high
          echo '===== PRODUCTION AUDIT AFTER FIX END ====='
