# ============================================================
# Semantic State Registry — 第一批：Browser/Grid + View Navigation
#                         + Workspace/FilePanel（Phase 2）
#                         + Bookmark（Phase 3）
#                         + Terminal Lifecycle（Phase 4）
#                         + Credential Security（Phase 5）
#
# 状态分类（README.md 定义）：
#   ACCEPTED_ADR     已裁决并冻结的语义
#   CURRENT_FACT     代码中真实存在、已确认，但尚未走 ADR 的事实
#   OBSERVED_NOT_GOVERNED  真实存在但本批不治理（需 SCR 才能纳入治理）
#   PROPOSED_CHANGE  拟议，**代码中不存在**，不得当作现状使用
#
# 每个受治理状态必须回答：
#   表达什么 / 不表达什么 / 谁拥有 / 谁能写 / 谁不能写 / 是否派生 / 是否需 ADR
# ============================================================

version: 1
registry_scope: Browser/Grid + View Navigation（Phase 1）+ Workspace/FilePanel（Phase 2）+ Bookmark（Phase 3）+ Terminal Lifecycle（Phase 4）+ Credential Security（Phase 5）已确认语义

# Rule 2（未注册状态）治理域 = 「非 owner 固定文件」+ 各 owner store 经 implementation
# locator 解析出的真实文件。owner store 的物理路径由 owner_implementations 解析
# （物理迁移只需更新 locator，不破坏 R2/R8/R9；若 locator 解析不到实现 →
# SEMANTIC_IMPLEMENTATION_UNRESOLVED 阻断，避免静默失守）。
governed_files:
  - src/composables/useBrowserHost.ts
  - src/components/workspace/FilePanel.vue

# Implementation Locator：语义 identity（owner 符号）与物理路径解耦。
# 物理迁移时：把新路径加到候选列表首项，旧路径保留作回滚；checker 取首个磁盘存在的候选。
# 禁止：文件移走却不同步更新此处 → 解析失败（RI-UNRESOLVED）；两份候选同时存在 → RI-DUPLICATE。
# 见 docs/architecture/semantic-governance/phase8a1-governance-identity/01-PATH-COUPLING-AUDIT.md
owner_implementations:
  useLayoutStore:
    symbol: useLayoutStore
    paths:
      - src/stores/useLayoutStore.ts
      - src/capabilities/layout/state/useLayoutStore.ts
  useBrowserStore:
    symbol: useBrowserStore
    paths:
      - src/stores/useBrowserStore.ts
      - src/capabilities/browser/state/useBrowserStore.ts
  useWorkspaceStore:
    symbol: useWorkspaceStore
    paths:
      - src/stores/useWorkspaceStore.ts
      - src/capabilities/workspace/state/useWorkspaceStore.ts
  useFileStore:
    symbol: useFileStore
    paths:
      - src/stores/useFileStore.ts
      - src/capabilities/workspace/files/state/useFileStore.ts
  useBookmarkStore:
    symbol: useBookmarkStore
    paths:
      # Phase 8B 物理迁移：新路径置首（首个磁盘存在的候选被 resolver 选中），旧路径保留作回滚参考
      - src/capabilities/bookmark/state/useBookmarkStore.ts
      - src/stores/useBookmarkStore.ts
  useSystemStore:
    symbol: useSystemStore
    paths:
      - src/stores/useSystemStore.ts
      - src/capabilities/system/state/useSystemStore.ts

states:

  # ---------------- View Navigation ----------------
  mainView:
    owner: useLayoutStore
    meaning: 当前用户希望看到的 Main Surface
    not_meaning:
      - Grid resource existence
      - native visibility
      - lifecycle state
      - Grid overlay dimension
    kind: stored
    derived: false
    allowed_values:
      - home
      - browser
      - files
      - clip
      - arts
      - grid
      - apps
      - term
      - repo
      - audit
      - scripts
      - commands
      - tools
      - db
      - tasks
      - skills
      - agents
      - graph
      - plugin
      - editor
      - settings
      - vault
    canonical_writer:
      - useLayoutStore.setView
    forbidden_writers:
      - components/**
      - useBrowserStore
      - any other store or composable
    duplicate_names: []
    adr_required: true
    adr: ADR-P1A-1
    status: ACCEPTED_ADR
    note: 取值共 22 个，实际名为 term（不是 terminal）

  gridToolbarOpen:
    owner: useLayoutStore
    meaning: 宫格工具条是否展开（UI 入口开关）
    not_meaning:
      - Grid resource existence
      - Grid visibility
    kind: stored
    derived: false
    allowed_values:
      - true
      - false
    canonical_writer:
      - useLayoutStore.toggleGridToolbar
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: toggleGridToolbar 本身是 dead code（Debt-002），但状态语义仍归 layout

  # ---------------- View Navigation 面板开关（Phase 6A-2 边界收敛）----------------
  # 说明：以下面板开关**各自是独立 UI 表面/域**，不合并（Bookmark 见 bookmark.panelOpen）。
  # bmPanelOpen（MainArea.vue 内 computed = panelOpen && mainView==="browser"）是派生量，
  #   必须保持组件 computed，禁止在 store 中声明为存储态（R8 守护）。
  sidebarOpen:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 左侧通用侧栏开关（与收藏夹侧栏 panelOpen 区分）
    not_meaning:
      - 收藏夹侧栏（见 bookmark.panelOpen）
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.toggleSidebar
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  clipOpen:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 剪贴板面板开关（与 setView("clip") 联动）
    not_meaning:
      - 视图导航（见 mainView="clip"）
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.toggleClipboard
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  fileEditorOpen:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 文件编辑器/Markdown 预览覆盖层开关（setView("editor") 时关闭）
    not_meaning:
      - 行内编辑器（见 useFileStore.inlineFile）
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.setView
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  browserDockOpen:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 浏览器视图右侧 Dock（文件/终端/资源/会话）开关
    not_meaning:
      - Grid resource（见 gridOpen）
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.toggleBrowserDock
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  browserDockTab:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 右侧 Dock 当前子页签（files/term/net/session）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.toggleBrowserDock
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  # ---------------- Browser/Grid Resource ----------------
  gridOpen:
    owner: useBrowserStore
    meaning: Grid resource 是否存在（原生窗是否创建）
    not_meaning:
      - Grid visibility
      - Grid 是否可见（需 mainView 参与）
      - lifecycle enum
    kind: stored
    derived: false
    allowed_values:
      - true
      - false
    canonical_writer:
      - useBrowserStore.buildGrid
      - useBrowserStore.closeGridAll
    forbidden_writers:
      - components/**
      - useLayoutStore
    duplicate_names: []
    adr_required: true
    adr: ADR-P1A-2
    status: ACCEPTED_ADR

  # ---------------- Browser/Grid 定位缓存失效纪元（Phase 6A-3）----------------
  gridSession:
    owner: useBrowserStore
    single_owner_required: true
    meaning: 宫格定位缓存失效纪元（buildGrid / forceGridRelayout 自增 +1）；供 useBrowserHost 识别 webview 已重建、旧 rect 发送缓存作废必须重发
    not_meaning:
      - Grid resource existence（见 gridOpen）
      - 视图导航（见 mainView）
      - 持久化恢复状态（仅内存运行时计数器，绝不落盘）
      - 资源 id / 会话恢复句柄
    kind: stored
    derived: false
    canonical_writer:
      - useBrowserStore.buildGrid
      - useBrowserStore.forceGridRelayout
    forbidden_writers:
      - components/**
      - useLayoutStore
      - useBrowserHost（只读消费方，不得写）
    duplicate_names: []
    adr_required: true
    adr: ADR-SEM-P6A-3
    status: CURRENT_FACT
    note: 纯内存 runtime 计数器（非持久化）；重建后 rect 可能与新 webview 1x1 初始态相同，故需 +1 使缓存作废；见 ADR-SEM-P6A-3

  activeTabId:
    owner: useBrowserStore
    meaning: 当前激活的浏览器页签 id
    not_meaning:
      - 视图（view）
      - 激活的宫格格子
    kind: stored
    derived: false
    allowed_values:
      - string (tab id)
      - empty string
    canonical_writer:
      - useBrowserStore.tabSwitch
      - useBrowserStore.tabNew
      - useBrowserStore.closeTabNow
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: 另有派生 activeTab（computed），见 observed_not_governed

  # ---------------- Browser/Grid AI 导航面板（Phase 6A 收口）----------------
  aiNavOpen:
    owner: useBrowserStore
    single_owner_required: true
    meaning: AI 导航面板（AINavPanel）开关；唯一真源
    not_meaning:
      - 视图导航（见 mainView）
      - 收藏夹 / 剪贴板 / 文件编辑器等其它面板开关
    kind: stored
    derived: false
    canonical_writer:
      - useBrowserStore.toggleAiNav
      - useBrowserStore.gotoAI
    forbidden_writers:
      - useLayoutStore（曾重复声明 aiNavOpen 死代码，Phase 6A 已删除；见 ADR-SEM-P6A-1）
      - components/**（应经 toggleAiNav；AINavPanel 关闭按钮直写 = false 为 owner 字段内写，可接受）
    duplicate_names: []
    adr_required: true
    adr: ADR-SEM-P6A-1
    status: CURRENT_FACT
    note: Phase 6A 收口——删除 useLayoutStore 中的重复声明，确认唯一 owner = useBrowserStore（browser_grid_lifecycle）

  # ---------------- Derived（禁止存储） ----------------
  desiredGridVisibility:
    owner: useBrowserStore
    meaning: Grid 是否应可见 = gridOpen && mainView === "grid"
    not_meaning:
      - 独立状态（纯派生，无独立自由度）
    kind: derived
    derived: true
    derived_from:
      - gridOpen
      - mainView
    formula: gridOpen && mainView === "grid"
    canonical_writer: []
    forbidden_writers:
      - everyone（派生量禁止写入）
    duplicate_names:
      - gridVisible
      - gridVisibility
      - isGridVisible
      - gridShown
    adr_required: true
    adr: ADR-P1A-3
    status: ACCEPTED_ADR
    note: 上述 duplicate_names 若被声明为 ref/computed/reactive 存储即违规；作为对象字段名（gridVisible:）不违规

  isBrowserVisible:
    owner: useBrowserStore
    meaning: 浏览器 webview 是否可见 = mainView === "browser"
    not_meaning:
      - gridOpen 的耦合（禁止回退到 !gridOpen && mainView==="browser"）
    kind: derived
    derived: true
    derived_from:
      - mainView
    formula: mainView === "browser"
    canonical_writer: []
    forbidden_writers:
      - everyone（派生量禁止写入）
    duplicate_names:
      - browserVisible
      - isBrowserShown
    adr_required: true
    adr: ADR-P1A-10
    status: ACCEPTED_ADR

  # ---------------- Workspace / FilePanel（Phase 2）----------------
  filePath:
    owner: useFileStore
    meaning: 文件浏览器/覆盖编辑器当前激活位置（地址真源）
    not_meaning:
      - 行内编辑器当前文件（见 inlineFile）
      - 目录预览当前目录（见 previewDir）
      - 派生“当前位置”（见 currentLocalPath）
    kind: stored
    derived: false
    allowed_values:
      - string (absolute path)
      - ""
    canonical_writer:
      - useFileStore.enterDir
      - useFileStore.openFile
      - useFileStore.openFileInline
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: overloaded —— 编辑器模式值为“当前文件”，浏览器模式值为“当前目录”（Debt-2-1）

  inlineFile:
    owner: useFileStore
    meaning: 行内编辑器（IDE 右栏）当前打开的文件路径
    not_meaning:
      - 覆盖编辑器当前文件（见 filePath，二者隔离）
    kind: stored
    derived: false
    allowed_values:
      - string (absolute path)
      - ""
    canonical_writer:
      - useFileStore.openFileInline
      - useFileStore.closeInline
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  previewDir:
    owner: useFileStore
    meaning: 目录预览（图片画廊）当前预览的目录路径
    not_meaning:
      - 文件浏览器当前目录（见 filePath）
    kind: stored
    derived: false
    allowed_values:
      - string (absolute path)
      - ""
    canonical_writer:
      - useFileStore.openDirPreview
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  pathInput:
    owner: useFileStore
    meaning: 地址栏 UI 缓冲（镜像 filePath；仅输入态，非真源）
    not_meaning:
      - 地址真源（见 filePath）
    kind: stored
    derived: false
    allowed_values:
      - string (absolute path)
      - ""
    canonical_writer:
      - useFileStore.goPath
      - useFileStore.enterDir
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: 与 filePath 单向镜像；UI 输入态，确认后写回 filePath

  currentLocalPath:
    owner: useFileStore
    meaning: 当前“打开的本地位置”派生量 = inlineFile || previewDir || layout.modTabs.path || filePath
    not_meaning:
      - 独立存储状态（纯派生，禁止第二真源）
    kind: derived
    derived: true
    derived_from:
      - inlineFile
      - previewDir
      - layout.modTabs.path
      - filePath
    formula: inlineFile || previewDir || modTabs.path || filePath
    canonical_writer: []
    forbidden_writers:
      - everyone（派生量禁止写入；R6 护栏）
    duplicate_names: []
    adr_required: true
    adr: ADR-P1A-3
    status: CURRENT_FACT
    note: 类比 desiredGridVisibility；R6 强制其为 computed 且禁止 .value =

  # ---------------- Bookmark（Phase 3）----------------
  items:
    owner: useBookmarkStore
    meaning: 收藏夹列表（唯一真源；后端 data_dir/bookmarks.json 的前端镜像）
    not_meaning:
      - 主页快捷方式（useHomeStore，localStorage，独立源 —— rejected mergeBookmarksIntoHome）
      - 裸 url 收藏判定（必须用 normalizeUrl 派生，禁止第二份 Bookmark[]）
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.add
      - useBookmarkStore.remove
      - useBookmarkStore.importFile
      - useBookmarkStore.load
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: add 必须按 id/normalizeUrl splice 替换，禁止 push 重复（INV-3-1）

  loaded:
    owner: useBookmarkStore
    meaning: 是否已从后端加载过（避免重复 load）
    not_meaning:
      - 加载中（见 busy）
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.load
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  busy:
    owner: useBookmarkStore
    meaning: 异步操作进行中（add/remove/import/toggle）
    not_meaning:
      - 加载完成态（见 loaded）
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.add
      - useBookmarkStore.remove
      - useBookmarkStore.importFile
      - useBookmarkStore.toggle
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  error:
    owner: useBookmarkStore
    meaning: 最近一次收藏 IPC 失败信息（必须可见，否则 ⭐ 点了无反馈）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.add
      - useBookmarkStore.remove
      - useBookmarkStore.importFile
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  panelOpen:
    owner: useBookmarkStore
    meaning: 收藏夹侧栏开关（刻意不进 useLayoutStore）
    not_meaning:
      - 通用侧栏（见 useLayoutStore.sidebarOpen）
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.togglePanel
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  sorted:
    owner: useBookmarkStore
    meaning: items 按 created_at 倒序稳定视图（同时间戳按 url 排序）
    not_meaning:
      - 独立存储列表（纯派生，禁止第二真源）
    kind: derived
    derived: true
    derived_from:
      - items
    formula: "items.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')||(a.url||'').localeCompare(b.url||''))"
    canonical_writer: []
    forbidden_writers:
      - everyone（派生量禁止写入；R6 护栏）
    duplicate_names: []
    adr_required: true
    adr: ADR-P1A-3
    status: CURRENT_FACT
    note: 类比 desiredGridVisibility / currentLocalPath；R6 强制其为 computed 且禁止 .value =

  # ---------------- Terminal Lifecycle（Phase 4）----------------
  terminalOpen:
    owner: useSystemStore
    meaning: 终端面板是否可见（toggle；打开且 0 面板时自动 spawnTerm）
    not_meaning:
      - 视图导航（见 useLayoutStore.mainView="term"）
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.toggleTerminal
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  termPanes:
    owner: useSystemStore
    meaning: 终端面板注册表（唯一真源）[{id, cwd}]；spawn→push，kill→filter
    not_meaning:
      - 视图导航
      - 第二份面板列表（禁止）
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.addTermPane
      - useSystemStore.killTerm
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: INV-4-1 唯一面板注册表；addTermPane/killTerm 是唯一增删入口

  termGrid:
    owner: useSystemStore
    meaning: 宫格模式（多终端并排）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.toggleTermGrid
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  termGridCount:
    owner: useSystemStore
    meaning: 终端宫格数（默认 4 = 2×2）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.setTermGridCount
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  activeTermId:
    owner: useSystemStore
    meaning: 当前聚焦面板 id（必须 ∈ termPanes.id；kill 后重置为首剩余）
    not_meaning:
      - 悬空 id（killTerm 同步重置，禁止悬空）
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.setActiveTerm
      - useSystemStore.killTerm
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: INV-4-2 activeTermId 必须始终 ∈ termPanes.id

  autoConfirmCli:
    owner: useSystemStore
    meaning: 自动确认 CLI True Color 提示（来自 localStorage）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.setAutoConfirmCli
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  termProbeOn:
    owner: useSystemStore
    meaning: 终端对账 probe 开关
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.toggleTermProbe
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  m0Cfg:
    owner: useSystemStore
    meaning: M0 吞吐测量配置（null=未启用）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.bindM0ThroughputStart
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  m0StartTs:
    owner: useSystemStore
    meaning: M0 测量起始时间戳
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.bindM0ThroughputStart
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  droppedChunks:
    owner: useSystemStore
    meaning: 过快输出丢弃的 chunk 数（遥测）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.pushTermHistory
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  droppedBytes:
    owner: useSystemStore
    meaning: 过快输出丢弃的字节数（遥测）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useSystemStore.pushTermHistory
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  # ---------------- Credential Security（Phase 5）----------------
  # 凭据真源 = 系统密钥库（OS keyring），不在应用内存；前端只持不透明 metadata。
  gitRepoToken:
    owner: credential
    meaning: git 仓库访问 token，存系统密钥库，键=repo.id
    not_meaning:
      - 前端可见的 token 值（frontend_mirror: none，绝不进入网页 JS 内存/网络/日志）
    kind: keyring
    derived: false
    key_namespace: repo.id
    frontend_mirror: none
    canonical_writer:
      - KeyringStore.save_token（经 bridge 配置仓库凭据入口，仅 Rust 侧）
    forbidden_writers:
      - 任何前端 store / component（token 不得出现在前端 reactive 状态）
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: KeyringStore 是 OS keyring 薄封装；token 真源在系统密钥库，不在应用内存

  dbCredential:
    owner: credential
    meaning: DB 连接密码，存系统密钥库，键=db:<conn_id>（与 git 命名空间隔离）
    not_meaning:
      - 前端可见密码（frontend_mirror: none）
    kind: keyring
    derived: false
    key_namespace: "db:<conn_id>"
    frontend_mirror: none
    canonical_writer:
      - KeyringStore.save_token（db_connect 写入；db_disconnect 撤销）
    forbidden_writers:
      - 前端（密码仅在 db_connect 入参短暂存在，立即入 keyring）
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  browserCredential:
    owner: credential
    meaning: 浏览器自动填充凭据（站点/用户名/密码），存系统密钥库，键=cred.key
    not_meaning:
      - 前端可见密码（前端仅持 BrowserCredentialItem 元数据：id/username/origin/has_password）
    kind: keyring
    derived: false
    key_namespace: cred.key
    frontend_mirror: metadata_only（BrowserCredentialItem，绝不含量 password）
    canonical_writer:
      - KeyringStore.save_token（凭据导入入口）
    forbidden_writers:
      - CredentialList.vue（只经 bridge.fillBrowserCredential 让 Rust 读 keyring 注入，组件不接触密码）
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: 安全红线（CredentialList.vue）：密码不进组件、不进 store、不进 localStorage/日志、不显示/复制/导出

  # ---------------- Credential Security（Phase 5.1-B：敏感输入护栏，收口 Debt-5-1）----------------
  databaseCredentialInput:
    owner: credential
    meaning: 数据库认证密码（瞬时表单输入），提交即经安全凭据流入 keyring，不落本地/不进 store
    not_meaning:
      - 持久化的密码（密码只在 DB 连接提交的瞬时入参中存在，立即入 keyring，组件/store 不留存）
    sensitive: true
    frontend_ident:
      - password
    kind: form_input
    derived: false
    frontend_mirror: local_transient（仅组件本地 ref，提交即清空）
    canonical_writer:
      - KeyringStore.save_token（经 bridge db_connect 写入 keyring，键 db:<conn_id>）
    forbidden_writers:
      - 任何把 password 写入 localStorage / sessionStorage / 普通 store / console / export 的路径
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: 安全红线（DatabasePanel.vue）：password 只作组件本地瞬时态，db.connect(password.value) 后立刻清空；R7 静态护栏禁止其流入泄露汇（console/localStorage/export）

