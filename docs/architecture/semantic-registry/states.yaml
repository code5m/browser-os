# ============================================================
# Semantic State Registry — 第一批：Browser/Grid + View Navigation
#                         + Workspace/FilePanel（Phase 2）
#                         + Bookmark（Phase 3）
#                         + Terminal Lifecycle（Phase 4）
#                         + Credential Security（Phase 5）
#
# 状态分类（README.md 定义）：
#   ACCEPTED_ADR     已裁决并冻结的语义
#   CURRENT_FACT     代码中真实存在、已确认，但尚未走 ADR 的事实
#   OBSERVED_NOT_GOVERNED  真实存在但本批不治理（需 SCR 才能纳入治理）
#   PROPOSED_CHANGE  拟议，**代码中不存在**，不得当作现状使用
#
# 每个受治理状态必须回答：
#   表达什么 / 不表达什么 / 谁拥有 / 谁能写 / 谁不能写 / 是否派生 / 是否需 ADR
# ============================================================

version: 1
registry_scope: Browser/Grid + View Navigation（Phase 1）+ Workspace/FilePanel（Phase 2）+ Bookmark（Phase 3）+ Terminal Lifecycle（Phase 4）+ Credential Security（Phase 5）已确认语义 + Phase 8E/Train D（Terminal owner 抽取：useSystemStore → useTerminalStore，零语义变更）

# Rule 2（未注册状态）治理域 = 「非 owner 固定文件」+ 各 owner store 经 implementation
# locator 解析出的真实文件。owner store 的物理路径由 owner_implementations 解析
# （物理迁移只需更新 locator，不破坏 R2/R8/R9；若 locator 解析不到实现 →
# SEMANTIC_IMPLEMENTATION_UNRESOLVED 阻断，避免静默失守）。
governed_files:
  - src/composables/useBrowserHost.ts
  - src/capabilities/workspace/ui/FilePanel.vue

# Implementation Locator：语义 identity（owner 符号）与物理路径解耦。
# 物理迁移时：把新路径加到候选列表首项，旧路径保留作回滚；checker 取首个磁盘存在的候选。
# 禁止：文件移走却不同步更新此处 → 解析失败（RI-UNRESOLVED）；两份候选同时存在 → RI-DUPLICATE。
# 见 docs/architecture/semantic-governance/phase8a1-governance-identity/01-PATH-COUPLING-AUDIT.md
owner_implementations:
  useLayoutStore:
    symbol: useLayoutStore
    paths:
      - src/stores/useLayoutStore.ts
  useBrowserStore:
    symbol: useBrowserStore
    paths:
      - src/capabilities/browser/state/useBrowserStore.ts
      - src/stores/useBrowserStore.ts
  useGridStore:
    symbol: useGridStore
    paths:
      - src/capabilities/grid/state/useGridStore.ts
  useWorkspaceStore:
    symbol: useWorkspaceStore
    paths:
      - src/capabilities/workspace/state/useWorkspaceStore.ts
      - src/stores/useWorkspaceStore.ts
  useFileStore:
    symbol: useFileStore
    paths:
      - src/capabilities/workspace/state/useFileStore.ts
      - src/stores/useFileStore.ts
  useArtifactStore:
    symbol: useArtifactStore
    paths:
      - src/capabilities/workspace/state/useArtifactStore.ts
      - src/stores/useArtifactStore.ts
  useRepoStore:
    symbol: useRepoStore
    paths:
      - src/capabilities/workspace/state/useRepoStore.ts
      - src/stores/useRepoStore.ts
  useScriptStore:
    symbol: useScriptStore
    paths:
      - src/capabilities/script/state/useScriptStore.ts
      - src/stores/useScriptStore.ts
  useSnippetStore:
    symbol: useSnippetStore
    paths:
      - src/capabilities/script/state/useSnippetStore.ts
      - src/stores/useSnippetStore.ts
  useBookmarkStore:
    symbol: useBookmarkStore
    paths:
      # Phase 8B 物理迁移：新路径置首（首个磁盘存在的候选被 resolver 选中），旧路径保留作回滚参考
      - src/capabilities/bookmark/state/useBookmarkStore.ts
      - src/stores/useBookmarkStore.ts
  useClipboardStore:
    # STAGE H：Clipboard 域从 useSystemStore 拆为专属 owner（解除 Debt-8E-1）。
    # 已升级为 packages/capability-clipboard（与 Vault 同形态），物理路径随之迁移。
    symbol: useClipboardStore
    paths:
      - packages/capability-clipboard/src/state/useClipboardStore.ts
  useAppsStore:
    # STAGE H：Apps 域从 useSystemStore 拆为专属 owner（解除 Debt-8E-1）。
    symbol: useAppsStore
    paths:
      - src/capabilities/apps/state/useAppsStore.ts
  useToolsStore:
    # STAGE H：Tools 新建专属 owner（原 ToolBox 组件内状态）。
    symbol: useToolsStore
    paths:
      - src/capabilities/tools/state/useToolsStore.ts
  useTerminalStore:
    # Phase 8E/Train D：Terminal 域从 useSystemStore（Terminal+Clipboard+Apps 混居）抽为专属 owner。
    # 旧路径**不**作为候选（否则会解析到已不含 terminal 状态的文件 → RI 误报 / 静默失守）。
    symbol: useTerminalStore
    paths:
      - src/capabilities/terminal/state/useTerminalStore.ts
  useVaultStore:
    # Frontend M2：Vault 升级为 packages/capability-vault（state owner 仍在包内）。
    symbol: useVaultStore
    paths:
      - packages/capability-vault/src/state/useVaultStore.ts
  useHomeStore:
    # Capability Library Expansion v1：Home 域专属 owner（capabilities/home/state）。
    symbol: useHomeStore
    paths:
      - src/capabilities/home/state/useHomeStore.ts
  useAgentStore:
    # 真实领域 + 原生副作用（前端镜像 Rust agent_*）；STAGE E 同源。
    # owner 已迁入 capabilities/agent/state；locator 必须指向真实存在的文件，否则治理静默失守。
    symbol: useAgentStore
    paths:
      - src/capabilities/agent/state/useAgentStore.ts
  useDatabaseStore:
    # 真实领域 + 强原生副作用（外部 DB 连接 / SQL 执行）。
    symbol: useDatabaseStore
    paths:
      - src/capabilities/database/state/useDatabaseStore.ts
  useGitStore:
    # 真实领域 + 双段写闸门（requestGitWrite / confirmGitWrite）。
    symbol: useGitStore
    paths:
      - src/capabilities/git/state/useGitStore.ts
  useSkillStore:
    # STAGE E 从 agent 拆出的独立 owner。
    symbol: useSkillStore
    paths:
      - src/capabilities/skill/state/useSkillStore.ts

  useTaskStore:
    # M4-8 定时任务面板状态机；组件一律经 bridge，后端命令未就绪时 guard 拦截所有 invoke（零 invoke 口径）。
    symbol: useTaskStore
    paths:
      - src/capabilities/task/state/useTaskStore.ts

  useGraphStore:
    # M5-9/W6/W11/W12 图谱面板状态机；nodes/edges 为 graph.rs 有界投影缓存，非真源。
    symbol: useGraphStore
    paths:
      - src/capabilities/graph/state/useGraphStore.ts

  usePluginStore:
    # M5-W14 插件管理器状态机；五态机真源在原生，前端 detail.state 为投影。
    symbol: usePluginStore
    paths:
      - src/capabilities/plugin/state/usePluginStore.ts

  useResourceStore:
    # Browser 子域：资源瀑布（M1-8）。owner = browser capability（capabilities/browser）。
    symbol: useResourceStore
    paths:
      - src/capabilities/browser/state/useResourceStore.ts
  useSessionStore:
    # Browser 子域：历史会话存档（M1-9）。owner = browser capability。
    symbol: useSessionStore
    paths:
      - src/capabilities/session/state/useSessionStore.ts
  useGridArchiveStore:
    # Browser 子域：宫格回复归档（M2-2.a）。owner = browser capability。
    symbol: useGridArchiveStore
    paths:
      - src/capabilities/grid/state/useGridArchiveStore.ts
  useImagePreviewStore:
    # Browser 子域：图片预览（M2-2.b）。owner = browser capability。
    symbol: useImagePreviewStore
    paths:
      - src/capabilities/browser/state/useImagePreviewStore.ts
  useSettingsStore:
    # 框架/平台 SERVICE：用户偏好（快捷键/主题）。owner = settings module（src/settings）。
    symbol: useSettingsStore
    paths:
      - src/settings/state/useSettingsStore.ts

states:

  # ---------------- View Navigation ----------------
  mainView:
    owner: useLayoutStore
    meaning: 当前用户希望看到的 Main Surface
    not_meaning:
      - Grid resource existence
      - native visibility
      - lifecycle state
      - Grid overlay dimension
    kind: stored
    derived: false
    allowed_values:
      - home
      - browser
      - files
      - clip
      - arts
      - grid
      - apps
      - term
      - repo
      - audit
      - scripts
      - commands
      - tools
      - db
      - tasks
      - skills
      - agents
      - graph
      - plugin
      - editor
      - settings
      - vault
    canonical_writer:
      - useLayoutStore.setView
    forbidden_writers:
      - components/**
      - useBrowserStore
      - any other store or composable
    duplicate_names: []
    adr_required: true
    adr: ADR-P1A-1
    status: ACCEPTED_ADR
    note: 取值共 22 个，实际名为 term（不是 terminal）

  gridToolbarOpen:
    owner: useLayoutStore
    meaning: 宫格工具条是否展开（UI 入口开关）
    not_meaning:
      - Grid resource existence
      - Grid visibility
    kind: stored
    derived: false
    allowed_values:
      - true
      - false
    canonical_writer:
      - useLayoutStore.toggleGridToolbar
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: toggleGridToolbar 本身是 dead code（Debt-002），但状态语义仍归 layout

  # ---------------- View Navigation 面板开关（Phase 6A-2 边界收敛）----------------
  # 说明：以下面板开关**各自是独立 UI 表面/域**，不合并（Bookmark 见 bookmark.panelOpen）。
  # bmPanelOpen（MainArea.vue 内 computed = panelOpen && mainView==="browser"）是派生量，
  #   必须保持组件 computed，禁止在 store 中声明为存储态（R8 守护）。
  sidebarOpen:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 左侧通用侧栏开关（与收藏夹侧栏 panelOpen 区分）
    not_meaning:
      - 收藏夹侧栏（见 bookmark.panelOpen）
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.toggleSidebar
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  clipOpen:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 剪贴板面板开关（与 setView("clip") 联动）
    not_meaning:
      - 视图导航（见 mainView="clip"）
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.toggleClipboard
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  fileEditorOpen:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 文件编辑器/Markdown 预览覆盖层开关（setView("editor") 时关闭）
    not_meaning:
      - 行内编辑器（见 useFileStore.inlineFile）
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.setView
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  browserDockOpen:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 浏览器视图右侧 Dock（文件/终端/资源/会话）开关
    not_meaning:
      - Grid resource（见 gridOpen）
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.toggleBrowserDock
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  browserDockTab:
    owner: useLayoutStore
    single_owner_required: true
    meaning: 右侧 Dock 当前子页签（files/term/net/session）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useLayoutStore.toggleBrowserDock
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  # ---------------- Browser/Grid Resource ----------------
  gridOpen:
    owner: useGridStore
    meaning: Grid resource 是否存在（原生窗是否创建）
    not_meaning:
      - Grid visibility
      - Grid 是否可见（需 mainView 参与）
      - lifecycle enum
    kind: stored
    derived: false
    allowed_values:
      - true
      - false
    canonical_writer:
      - useGridStore.buildGrid
      - useGridStore.closeGridAll
    forbidden_writers:
      - components/**
      - useLayoutStore
    duplicate_names: []
    adr_required: true
    adr: ADR-P1A-2
    status: ACCEPTED_ADR

  # ---------------- Browser/Grid 定位缓存失效纪元（Phase 6A-3）----------------
  gridSession:
    owner: useGridStore
    single_owner_required: true
    meaning: 宫格定位缓存失效纪元（buildGrid / forceGridRelayout 自增 +1）；供 useBrowserHost 识别 webview 已重建、旧 rect 发送缓存作废必须重发
    not_meaning:
      - Grid resource existence（见 gridOpen）
      - 视图导航（见 mainView）
      - 持久化恢复状态（仅内存运行时计数器，绝不落盘）
      - 资源 id / 会话恢复句柄
    kind: stored
    derived: false
    canonical_writer:
      - useGridStore.buildGrid
      - useGridStore.forceGridRelayout
    forbidden_writers:
      - components/**
      - useLayoutStore
      - useGridHost（只读消费方，不得写）
    duplicate_names: []
    adr_required: true
    adr: ADR-SEM-P6A-3
    status: CURRENT_FACT
    note: 纯内存 runtime 计数器（非持久化）；重建后 rect 可能与新 webview 1x1 初始态相同，故需 +1 使缓存作废；见 ADR-SEM-P6A-3

  activeTabId:
    owner: useBrowserStore
    meaning: 当前激活的浏览器页签 id
    not_meaning:
      - 视图（view）
      - 激活的宫格格子
    kind: stored
    derived: false
    allowed_values:
      - string (tab id)
      - empty string
    canonical_writer:
      - useBrowserStore.tabSwitch
      - useBrowserStore.tabNew
      - useBrowserStore.closeTabNow
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: 另有派生 activeTab（computed），见 observed_not_governed

  # ---------------- Browser/Grid AI 导航面板（Phase 6A 收口）----------------
  aiNavOpen:
    owner: useBrowserStore
    single_owner_required: true
    meaning: AI 导航面板（AINavPanel）开关；唯一真源
    not_meaning:
      - 视图导航（见 mainView）
      - 收藏夹 / 剪贴板 / 文件编辑器等其它面板开关
    kind: stored
    derived: false
    canonical_writer:
      - useBrowserStore.toggleAiNav
      - useBrowserStore.gotoAI
    forbidden_writers:
      - useLayoutStore（曾重复声明 aiNavOpen 死代码，Phase 6A 已删除；见 ADR-SEM-P6A-1）
      - components/**（应经 toggleAiNav；AINavPanel 关闭按钮直写 = false 为 owner 字段内写，可接受）
    duplicate_names: []
    adr_required: true
    adr: ADR-SEM-P6A-1
    status: CURRENT_FACT
    note: Phase 6A 收口——删除 useLayoutStore 中的重复声明，确认唯一 owner = useBrowserStore（browser_grid_lifecycle）

  # ---------------- Derived（禁止存储） ----------------
  desiredGridVisibility:
    owner: useGridStore
    meaning: Grid 是否应可见 = gridOpen && mainView === "grid"
    not_meaning:
      - 独立状态（纯派生，无独立自由度）
    kind: derived
    derived: true
    derived_from:
      - gridOpen
      - mainView
    formula: gridOpen && mainView === "grid"
    canonical_writer: []
    forbidden_writers:
      - everyone（派生量禁止写入）
    duplicate_names:
      - gridVisible
      - gridVisibility
      - isGridVisible
      - gridShown
    adr_required: true
    adr: ADR-P1A-3
    status: ACCEPTED_ADR
    note: 上述 duplicate_names 若被声明为 ref/computed/reactive 存储即违规；作为对象字段名（gridVisible:）不违规

  isBrowserVisible:
    owner: useBrowserStore
    meaning: 浏览器 webview 是否可见 = mainView === "browser"
    not_meaning:
      - gridOpen 的耦合（禁止回退到 !gridOpen && mainView==="browser"）
    kind: derived
    derived: true
    derived_from:
      - mainView
    formula: mainView === "browser"
    canonical_writer: []
    forbidden_writers:
      - everyone（派生量禁止写入）
    duplicate_names:
      - browserVisible
      - isBrowserShown
    adr_required: true
    adr: ADR-P1A-10
    status: ACCEPTED_ADR

  # ---------------- Workspace / FilePanel（Phase 2）----------------
  filePath:
    owner: useFileStore
    meaning: 文件浏览器/覆盖编辑器当前激活位置（地址真源）
    not_meaning:
      - 行内编辑器当前文件（见 inlineFile）
      - 目录预览当前目录（见 previewDir）
      - 派生“当前位置”（见 currentLocalPath）
    kind: stored
    derived: false
    allowed_values:
      - string (absolute path)
      - ""
    canonical_writer:
      - useFileStore.enterDir
      - useFileStore.openFile
      - useFileStore.openFileInline
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: overloaded —— 编辑器模式值为“当前文件”，浏览器模式值为“当前目录”（Debt-2-1）

  inlineFile:
    owner: useFileStore
    meaning: 行内编辑器（IDE 右栏）当前打开的文件路径
    not_meaning:
      - 覆盖编辑器当前文件（见 filePath，二者隔离）
    kind: stored
    derived: false
    allowed_values:
      - string (absolute path)
      - ""
    canonical_writer:
      - useFileStore.openFileInline
      - useFileStore.closeInline
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  previewDir:
    owner: useFileStore
    meaning: 目录预览（图片画廊）当前预览的目录路径
    not_meaning:
      - 文件浏览器当前目录（见 filePath）
    kind: stored
    derived: false
    allowed_values:
      - string (absolute path)
      - ""
    canonical_writer:
      - useFileStore.openDirPreview
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  pathInput:
    owner: useFileStore
    meaning: 地址栏 UI 缓冲（镜像 filePath；仅输入态，非真源）
    not_meaning:
      - 地址真源（见 filePath）
    kind: stored
    derived: false
    allowed_values:
      - string (absolute path)
      - ""
    canonical_writer:
      - useFileStore.goPath
      - useFileStore.enterDir
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: 与 filePath 单向镜像；UI 输入态，确认后写回 filePath

  currentLocalPath:
    owner: useFileStore
    meaning: 当前“打开的本地位置”派生量 = inlineFile || previewDir || layout.modTabs.path || filePath
    not_meaning:
      - 独立存储状态（纯派生，禁止第二真源）
    kind: derived
    derived: true
    derived_from:
      - inlineFile
      - previewDir
      - layout.modTabs.path
      - filePath
    formula: inlineFile || previewDir || modTabs.path || filePath
    canonical_writer: []
    forbidden_writers:
      - everyone（派生量禁止写入；R6 护栏）
    duplicate_names: []
    adr_required: true
    adr: ADR-P1A-3
    status: CURRENT_FACT
    note: 类比 desiredGridVisibility；R6 强制其为 computed 且禁止 .value =

  # ---------------- Bookmark（Phase 3）----------------
  items:
    owner: useBookmarkStore
    meaning: 收藏夹列表（唯一真源；后端 data_dir/bookmarks.json 的前端镜像）
    not_meaning:
      - 主页快捷方式（useHomeStore，localStorage，独立源 —— rejected mergeBookmarksIntoHome）
      - 裸 url 收藏判定（必须用 normalizeUrl 派生，禁止第二份 Bookmark[]）
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.add
      - useBookmarkStore.remove
      - useBookmarkStore.importFile
      - useBookmarkStore.load
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT
    note: add 必须按 id/normalizeUrl splice 替换，禁止 push 重复（INV-3-1）

  loaded:
    owner: useBookmarkStore
    meaning: 是否已从后端加载过（避免重复 load）
    not_meaning:
      - 加载中（见 busy）
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.load
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  busy:
    owner: useBookmarkStore
    meaning: 异步操作进行中（add/remove/import/toggle）
    not_meaning:
      - 加载完成态（见 loaded）
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.add
      - useBookmarkStore.remove
      - useBookmarkStore.importFile
      - useBookmarkStore.toggle
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  error:
    owner: useBookmarkStore
    meaning: 最近一次收藏 IPC 失败信息（必须可见，否则 ⭐ 点了无反馈）
    not_meaning: []
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.add
      - useBookmarkStore.remove
      - useBookmarkStore.importFile
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  panelOpen:
    owner: useBookmarkStore
    meaning: 收藏夹侧栏开关（刻意不进 useLayoutStore）
    not_meaning:
      - 通用侧栏（见 useLayoutStore.sidebarOpen）
    kind: stored
    derived: false
    canonical_writer:
      - useBookmarkStore.togglePanel
    forbidden_writers:
      - components/**
    duplicate_names: []
    adr_required: false
    status: CURRENT_FACT

  sorted:
    owner: useBookmarkStore
