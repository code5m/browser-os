# ============================================================
# Semantic Owner Registry
#
# 目的：防止 Component 直接修改生命周期，防止 store 跨界写别人的状态。
# Rule 3（OWNER_VIOLATION）据此判定。
# ============================================================

version: 1
registry_scope: Browser/Grid + View Navigation（Phase 1）+ Workspace/FilePanel（Phase 2）+ Bookmark（Phase 3）+ Terminal Lifecycle（Phase 4）已确认语义

owners:

  view_navigation:
    owner: useLayoutStore
    owns:
      - mainView
      - gridToolbarOpen
    owner_only_api:
      - setView
      - activateView
      - activateBrowser
      - activateHome
      - activateFiles
      - activateTerm
      - activateEditor
      - activateWorkspace
      - openModule
    forbidden_callers:
      - components/**（不得直写 mainView）
      - useBrowserStore（不得直写 mainView，须经 layout.setView）
    may_call:
      - useBrowserStore（可调 setView / openModule 等被授权的导航入口）
    rationale: 通用导航 store；若兼管 Grid 资源生命周期会反向依赖 useBrowserStore 形成循环
    status: ACCEPTED_ADR

  browser_grid_lifecycle:
    owner: useBrowserStore
    owns:
      - gridOpen
      - grid lifecycle
      - desiredGridVisibility (derived)
      - isBrowserVisible (derived)
    owner_only_api:
      - buildGrid
      - closeGridAll
      - closeGridOne
    public_intent_api:
      - activateGrid
      - openGrid
      - rebuildGrid
      - closeGrid
      - closeGridCell
    forbidden_callers:
      - components/**（不得直调生命周期原语）
      - 任何非授权 store / composable
    authorized_callers:
      - useBrowserStore（owner 自身）
      - useLayoutStore（经授权入口，如 toggleGridToolbar 调 openGrid / closeGrid）
    rationale: 资源生命周期归母属 store；useLayoutStore 退为视图状态执行点
    status: ACCEPTED_ADR

  native_execution:
    owner: bridge
    owner_alt: Rust
    owns:
      - bounds
      - visibility effect
      - webview position
    owner_only_api:
      - gridPosition
      - tabPosition
      - hideWebview
      - hideAllWebviews
      - createGrid
      - closeGrid
    forbidden_callers:
      - 任何把 native 结果当作域真源回读的模块
    rationale: native 显隐是执行结果，单向派生，禁止回读为真相（ADR-P1A-4）
    status: ACCEPTED_ADR

  browser_tabs:
    owner: useBrowserStore
    owns:
      - activeTabId
      - tabs (reactive)
      - url
    owner_only_api:
      - tabSwitch
      - closeTabNow
      - tabNew
    forbidden_callers:
      - components/**（不得直写 activeTabId）
    status: CURRENT_FACT

  workspace_filepanel:
    owner: useWorkspaceStore
    owns:
      - filePath
      - inlineFile
      - previewDir
      - pathInput
      - currentLocalPath (derived)
    owner_only_api:
      - enterDir
      - openFile
      - openFileInline
      - saveFile
      - closeFileEditor
      - refreshTree
      - locateTo
    public_intent_api:
      - openFile
      - openFileInline
      - enterDir
      - saveFile
      - closeFileEditor
    forbidden_callers:
      - components/**（不得直写 filePath / inlineFile / previewDir / pathInput）
    authorized_callers:
      - useWorkspaceStore（owner 自身）
      - useLayoutStore（经 setView 切到 editor/files 视图）
    rationale: 文件导航状态（当前位置真源 + 派生位置）归母属 store；组件只渲染，不得直写
    status: CURRENT_FACT

  bookmark:
    owner: useBookmarkStore
    owns:
      - items
      - loaded
      - busy
      - error
      - panelOpen
      - sorted (derived)
    owner_only_api:
      - add
      - remove
      - toggle
      - importFile
      - togglePanel
      - load
      - findByUrl
    public_intent_api:
      - add
      - remove
      - toggle
      - importFile
      - togglePanel
    forbidden_callers:
      - components/**（不得直写 items / panelOpen；只能调 store action）
    authorized_callers:
      - useBookmarkStore（owner 自身）
      - useLayoutStore（仅切视图）
      - BookmarkStar / BookmarkPanel（消费 store，不持有第二列表）
    rationale: 收藏夹列表唯一真源（后端持久化）；任何第二份 Bookmark[] 或裸 url 判定都会与 items 漂移
    status: CURRENT_FACT

  terminal:
    owner: useSystemStore
    owns:
      - terminalOpen
      - termPanes
      - termGrid
      - termGridCount
      - activeTermId
      - autoConfirmCli
      - termProbeOn
      - m0Cfg
      - m0StartTs
      - droppedChunks
      - droppedBytes
    owner_only_api:
      - addTermPane
      - killTerm
      - termWrite
      - setActiveTerm
      - restartTerm
      - bindTermWriter
      - replayTermHistory
      - spawnTerm
      - pushTermHistory
    public_intent_api:
      - addTermPane
      - killTerm
      - termWrite
      - setActiveTerm
      - restartTerm
      - bindTermWriter
      - replayTermHistory
    forbidden_callers:
      - components/**（TerminalPane.vue 只能调 store action，不得直写 termPanes/activeTermId/terminalOpen）
    authorized_callers:
      - useSystemStore（owner 自身）
      - useLayoutStore（仅导航 setView("term")）
      - TerminalPane.vue（消费 store，不持有第二列表）
    rationale: 终端面板注册表唯一真源（termPanes）；任何第二份 {id,cwd}[] 或裸 activeTermId 直写都会漂移
    status: CURRENT_FACT

# ------------------------------------------------------------
# 越界判定补充
# ------------------------------------------------------------
violation_patterns:
  - id: COMPONENT_WRITES_MAINVIEW
    desc: 组件直接写 mainView（layout.mainView = ... / .mainView = ...）
    severity: fail
  - id: COMPONENT_CALLS_LIFECYCLE_PRIMITIVE
    desc: 组件直接调 buildGrid / closeGridAll / gridCloseOne 等原语
    severity: fail
  - id: NON_OWNER_CALLS_LIFECYCLE_INTENT
    desc: 非 owner 文件调用 openGrid / rebuildGrid / closeGrid / closeGridCell
    severity: fail
  - id: NON_OWNER_CALLS_NATIVE_DESTROY
    desc: 非 owner（useBrowserStore）文件调用 bridge.closeGrid
    severity: fail
  - id: COMPONENT_WRITES_WORKSPACE_PATH
    desc: 组件直接写 filePath / inlineFile / previewDir / pathInput（owner: useWorkspaceStore）
    severity: fail
  - id: COMPONENT_WRITES_BOOKMARK
    desc: 组件直接写 items / panelOpen（owner: useBookmarkStore）；或维护第二份 Bookmark[]
    severity: fail
  - id: COMPONENT_WRITES_TERMINAL
    desc: 组件直接写 termPanes / activeTermId / terminalOpen（owner: useSystemStore）；或维护第二份面板列表
    severity: fail
