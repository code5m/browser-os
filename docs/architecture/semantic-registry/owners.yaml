    rationale: 真实领域 + 强原生副作用；db_connect 建外部连接、db_query 执行语句，高风险写经 requiresConfirm 二次确认闸门（前端按连接能力触发，后端逐句分类）；password 瞬时传入不持久化（F2 红线）
