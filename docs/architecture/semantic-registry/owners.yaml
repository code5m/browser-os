# ============================================================
# Semantic Owner Registry
#
# 目的：防止 Component 直接修改生命周期，防止 store 跨界写别人的状态。
# Rule 3（OWNER_VIOLATION）据此判定。
# ============================================================

version: 1
registry_scope: Browser/Grid + View Navigation（Phase 1）+ Workspace/FilePanel（Phase 2）+ Bookmark（Phase 3）+ Terminal Lifecycle（Phase 4）+ Credential Security（Phase 5）已确认语义

owners:

  view_navigation:
    owner: useLayoutStore
    owns:
      - mainView
      - gridToolbarOpen
    owner_only_api:
      - setView
      - activateView
      - activateBrowser
      - activateHome
      - activateFiles
      - activateTerm
      - activateEditor
      - activateWorkspace
      - openModule
    forbidden_callers:
      - components/**（不得直写 mainView）
      - useBrowserStore（不得直写 mainView，须经 layout.setView）
    may_call:
      - useBrowserStore（可调 setView / openModule 等被授权的导航入口）
    rationale: 通用导航 store；若兼管 Grid 资源生命周期会反向依赖 useBrowserStore 形成循环
    status: ACCEPTED_ADR

  browser_grid_lifecycle:
    owner: useBrowserStore
    owns:
      - gridOpen
      - grid lifecycle
      - gridSession (Phase 6A 收口；见 ADR-SEM-P6A-3)
      - desiredGridVisibility (derived)
      - isBrowserVisible (derived)
      - aiNavOpen (Phase 6A 收口；useLayoutStore 死重复已删)
    owner_only_api:
      - buildGrid
      - closeGridAll
      - closeGridOne
    public_intent_api:
      - activateGrid
      - openGrid
      - rebuildGrid
      - closeGrid
      - closeGridCell
    forbidden_callers:
      - components/**（不得直调生命周期原语）
      - 任何非授权 store / composable
    authorized_callers:
      - useBrowserStore（owner 自身）
      - useLayoutStore（经授权入口，如 toggleGridToolbar 调 openGrid / closeGrid）
    rationale: 资源生命周期归母属 store；useLayoutStore 退为视图状态执行点
    status: ACCEPTED_ADR

  native_execution:
    owner: bridge
    owner_alt: Rust
    owns:
      - bounds
      - visibility effect
      - webview position
    owner_only_api:
      - gridPosition
      - tabPosition
      - hideWebview
      - hideAllWebviews
      - createGrid
      - closeGrid
    forbidden_callers:
      - 任何把 native 结果当作域真源回读的模块
    rationale: native 显隐是执行结果，单向派生，禁止回读为真相（ADR-P1A-4）
    status: ACCEPTED_ADR

  browser_tabs:
    owner: useBrowserStore
    owns:
      - activeTabId
      - tabs (reactive)
      - url
    owner_only_api:
      - tabSwitch
      - closeTabNow
      - tabNew
    forbidden_callers:
      - components/**（不得直写 activeTabId）
    status: CURRENT_FACT

  files:
    owner: useFileStore
    owns:
      - filePath
      - inlineFile
      - previewDir
      - pathInput
      - currentLocalPath (derived)
      - fileEntries
      - fileContent
      - editingFile
      - mdPreview
      - mdHtml
      - startDirs
      - previewEntries
      - previewImages
      - previewImageErrors
      - previewLoading
      - previewError
      - previewTileSize
      - compareImages
      - treeRoots
      - treeChildren
      - treeExpanded
      - treeLoading
      - treeErrors
      - locateTarget
      - dragSource
      - dropTarget
      - moveConfirm
      - fileCtx
      - inlineText
      - inlineIsMd
      - inlineEdit
      - inlineHtml
    owner_only_api:
      - enterDir
      - openFile
      - openFileInline
      - openDirPreview
      - saveFile
      - closeInline
      - refreshTree
      - locateTo
      - toggleTreeDir
      - ensureTreeChildren
      - loadTree
      - expandAllTree
      - collapseAllTree
      - loadStartDirs
      - goUp
      - goPath
      - openMd
      - ctxNewFile
      - ctxNewDir
      - ctxDelete
      - ctxRename
      - ctxFavorite
      - copyPath
      - ctxOpenInNewTab
      - ctxOpenInExplorer
      - ctxOpenInTerminal
      - startDrag
      - onDirDragOver
      - onDirDragLeave
      - onDirDrop
      - requestMove
      - confirmMove
      - cancelMove
      - inlineToggleEdit
      - saveInline
      - isImageEntry
      - loadPreviewImage
      - setPreviewTileSize
      - toggleCompareImage
      - moveCompareImage
      - clearCompareImages
      - onFileContext
      - closeFileCtx
      - setFileContent
      - setInlineText
      - setEditorView
      - clearDragSource
    public_intent_api:
      - openFile
      - openFileInline
      - enterDir
      - saveFile
      - openDirPreview
      - closeInline
    forbidden_callers:
      - components/**（不得直写 filePath / inlineFile / previewDir / pathInput / fileContent / inlineText 等 Files 状态；须经 canonical writer）
    authorized_callers:
      - useFileStore（owner 自身）
      - useLayoutStore（经 setView / openDirTab 切到 editor/files 视图）
      - useWorkspaceStore（跨域编排：openRecent → openFile）
    rationale: |
      Phase 8C-0A 将文件浏览 / 行内+覆盖编辑器 / 文件夹树 / 目录图片预览 / 文件右键菜单 / 拖拽移动
      从 useWorkspaceStore（God Store）抽出为独立 owner（useFileStore）。Workspace Core 不再持有文件域状态，
      只保留跨域编排（openRecent 调 useFileStore.openFile）。组件只渲染，不得直写 Files 内部状态。
    status: CURRENT_FACT

  artifact:
    owner: useArtifactStore
    owns:
      - tree
      - current
      - editTitle
      - editTags
      - editText
      - selected
      - flatArtifacts (derived)
      - ctxMenu
    owner_only_api:
      - loadTree
      - openArtifact
      - saveEdit
      - removeArtifact
      - onArtifactContext
      - closeCtx
      - ctxReveal
      - ctxOpenSource
      - ctxRemove
      - toggle
      - collectSelection
      - setEditTitle
      - setEditTags
      - setEditText
    public_intent_api:
      - openArtifact
      - saveEdit
      - removeArtifact
      - toggle
      - collectSelection
    forbidden_callers:
      - components/**（不得直写 tree / current / editTitle / editTags / editText / selected / ctxMenu；须经 canonical writer / action）
    authorized_callers:
      - useArtifactStore（owner 自身）
      - useWorkspaceStore（跨域编排：refresh 调 loadTree；requestSync 读 selected）
      - useLayoutStore（仅导航 setView）
    rationale: |
      Phase 8C-0B 将成果树 / 当前编辑 / 多选 / 右键菜单 / 采集从 useWorkspaceStore（God Store）
      抽出为独立 owner（useArtifactStore），后端持久化（browseWorkspace/readArtifact/updateArtifact/deleteArtifact）。
      Workspace Core 不再持有 artifact 状态；refresh 编排改调本 store.loadTree()，requestSync 跨域读 selected。
    status: CURRENT_FACT

  bookmark:
    owner: useBookmarkStore
    owns:
      - items
      - loaded
      - busy
      - error
      - panelOpen
      - sorted (derived)
    owner_only_api:
      - add
      - remove
      - toggle
      - importFile
      - togglePanel
      - load
      - findByUrl
    public_intent_api:
      - add
      - remove
      - toggle
      - importFile
      - togglePanel
    forbidden_callers:
      - components/**（不得直写 items / panelOpen；只能调 store action）
    authorized_callers:
      - useBookmarkStore（owner 自身）
      - useLayoutStore（仅切视图）
      - BookmarkStar / BookmarkPanel（消费 store，不持有第二列表）
    rationale: 收藏夹列表唯一真源（后端持久化）；任何第二份 Bookmark[] 或裸 url 判定都会与 items 漂移
    status: CURRENT_FACT

  terminal:
    owner: useSystemStore
    owns:
      - terminalOpen
      - termPanes
      - termGrid
      - termGridCount
      - activeTermId
      - autoConfirmCli
      - termProbeOn
      - m0Cfg
      - m0StartTs
      - droppedChunks
      - droppedBytes
    owner_only_api:
      - addTermPane
      - killTerm
      - termWrite
      - setActiveTerm
      - restartTerm
      - bindTermWriter
      - replayTermHistory
      - spawnTerm
      - pushTermHistory
    public_intent_api:
      - addTermPane
      - killTerm
      - termWrite
      - setActiveTerm
      - restartTerm
      - bindTermWriter
      - replayTermHistory
    forbidden_callers:
      - components/**（TerminalPane.vue 只能调 store action，不得直写 termPanes/activeTermId/terminalOpen）
    authorized_callers:
      - useSystemStore（owner 自身）
      - useLayoutStore（仅导航 setView("term")）
      - TerminalPane.vue（消费 store，不持有第二列表）
    rationale: 终端面板注册表唯一真源（termPanes）；任何第二份 {id,cwd}[] 或裸 activeTermId 直写都会漂移
    status: CURRENT_FACT

  credential:
    owner: KeyringStore（core/keyring_store.rs，Rust 侧 OS keyring 薄封装）
    owns:
      - gitRepoToken
      - dbCredential
      - browserCredential
    manages:
      - gitRepoToken
      - dbCredential
      - browserCredential
      - keyring lifecycle（save_token / get_token / delete_token / keyringRead）
    owner_only_api:
      - save_token
      - get_token
      - delete_token
    public_intent_api:
      - saveCredential
      - getCredential
      - deleteCredential
      - fillBrowserCredential
      - listBrowserCredentials
    forbidden_callers:
      - 任何前端 store / component（凭据值不得进入前端；组件只经 bridge.fillBrowserCredential 发 credential_id）
    authorized_callers:
      - KeyringStore（owner 自身，Rust）
      - bridge（经 check_invocation_source 校验来源后调 KeyringStore）
    rationale: 凭据真源=系统密钥库；前端只持不透明 metadata（credential_id / has_password），绝不持原始值。R3 已通用化到本 owner（Phase 5.1-A）：前端任何文件直调 owner_only_api（save_token/get_token/delete_token）或引用 KeyringStore 即 SEMANTIC_OWNER_VIOLATION；组件只经 bridge 意图入口。Debt-5-2 已收口。
    status: CURRENT_FACT

# ------------------------------------------------------------
# 越界判定补充
# ------------------------------------------------------------
violation_patterns:
  - id: COMPONENT_WRITES_MAINVIEW
    desc: 组件直接写 mainView（layout.mainView = ... / .mainView = ...）
    severity: fail
  - id: COMPONENT_CALLS_LIFECYCLE_PRIMITIVE
    desc: 组件直接调 buildGrid / closeGridAll / gridCloseOne 等原语
    severity: fail
  - id: NON_OWNER_CALLS_LIFECYCLE_INTENT
    desc: 非 owner 文件调用 openGrid / rebuildGrid / closeGrid / closeGridCell
    severity: fail
  - id: NON_OWNER_CALLS_NATIVE_DESTROY
    desc: 非 owner（useBrowserStore）文件调用 bridge.closeGrid
    severity: fail
  - id: COMPONENT_WRITES_FILES_PATH
    desc: 组件直接写 filePath / inlineFile / previewDir / pathInput / fileContent / inlineText 等文件域状态（owner: useFileStore）；须经 canonical writer
    severity: fail
  - id: WS_OWNER_01
    desc: useWorkspaceStore 不得再声明 Files-owned state（ref/reactive/computed）；文件域状态唯一真源已迁 useFileStore（8C-0A）
    severity: fail
  - id: WS_OWNER_02
    desc: Files 状态只能由 useFileStore canonical writer 写；组件/其它 store 不得直写（须经 setFileContent / setInlineText / setEditorView / enterDir / openFile 等）
    severity: fail
  - id: WS_OWNER_03
    desc: Editor-owned state 不得存回 Workspace（编辑器缓冲隔离）；useWorkspaceStore 不得持有 editingFile / mdPreview 等文件态
    severity: fail
  - id: WS_OWNER_04
    desc: Repo/Git 与 Files 不得交叉保存第二份身份/状态；仅 useWorkspaceStore 持有 repo 态，useFileStore 不得复制
    severity: fail
  - id: WS_FACADE_01
    desc: 若保留兼容性 facade，不得存储第二份状态（8C-0A 采取真实抽取，无 facade）
    severity: fail
  - id: WS_FACADE_02
    desc: 禁止新增旧 Workspace API 消费点；已抽出的文件态须经 useFileStore，不得再经 useWorkspaceStore 访问
    severity: fail
  - id: WS_OWNER_05
    desc: useWorkspaceStore 不得再声明 Artifact-owned state（tree/current/editTitle/editTags/editText/selected/flatArtifacts/ctxMenu）；已迁 useArtifactStore（8C-0B）
    severity: fail
  - id: WS_OWNER_06
    desc: Artifact 状态只能由 useArtifactStore canonical writer/action 写；组件/其它 store 不得直写（须经 setEditTitle/setEditTags/setEditText/openArtifact/toggle 等）
    severity: fail
  - id: COMPONENT_WRITES_BOOKMARK
    desc: 组件直接写 items / panelOpen（owner: useBookmarkStore）；或维护第二份 Bookmark[]
    severity: fail
  - id: COMPONENT_WRITES_TERMINAL
    desc: 组件直接写 termPanes / activeTermId / terminalOpen（owner: useSystemStore）；或维护第二份面板列表
    severity: fail
  - id: FRONTEND_CREDENTIAL_LEAK
    desc: 前端 reactive 状态（ref/reactive/shallowRef/computed）持有原始凭据值（password/token/secret/api_key）
    severity: fail
  - id: CREDENTIAL_DISPLAYED_OR_EXPORTED
    desc: 代码中出现 exposePassword / copyPassword / exportCredential 等已否决意图（凭据泄露）
    severity: fail
