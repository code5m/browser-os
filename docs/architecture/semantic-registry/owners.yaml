      - targetRuns
      - loading (observed)
      - error (observed, 共享)
      - draft
      - issues
      - editorOpen
      - sortedRuns (derived)
      - enabledCount (derived)
      - backendReady (observed, 共享; useAgentStore 已登记 single_owner_required:false)
    owner_only_api:
      - applyTaskList
      - loadTargets
      - openCreate
      - openEdit
      - closeEditor
      - validate
      - saveDraft
      - setEnabled
      - removeTask
      - runNow
      - selectTask
      - loadTargetRuns
      - loadAll
    public_intent_api:
      - loadAll
      - createTask (saveDraft 新建 → bridge.taskAdd)
      - updateTask (saveDraft 编辑 → bridge.taskUpdate)
      - removeTask
      - runTaskNow (bridge.taskRunNow)
      - setTaskEnabled (bridge.taskUpdate)
      - selectTask
      - openCreate
      - openEdit
      - closeEditor
    forbidden_callers:
      - components/**（不得直写 tasks/runs/targets/draft/issues/editorOpen 等）
    authorized_callers:
      - useTaskStore（owner 自身）
      - TaskPanel.vue / TaskEditor.vue（消费 + 触发 intent）
    rationale: M4-8 定时任务面板状态机；组件一律经 bridge，后端 5 命令未就绪时 guard() 拦截所有 invoke（零 invoke 口径）；新建任务默认 enabled=false（A6 裁定）；secret 不进前端持久化
    status: CURRENT_FACT

# ------------------------------------------------------------
# 越界判定补充
# ------------------------------------------------------------
violation_patterns:
  - id: COMPONENT_WRITES_MAINVIEW
    desc: 组件直接写 mainView（layout.mainView = ... / .mainView = ...）
    severity: fail
  - id: COMPONENT_CALLS_LIFECYCLE_PRIMITIVE
    desc: 组件直接调 buildGrid / closeGridAll / gridCloseOne 等原语
    severity: fail
  - id: NON_OWNER_CALLS_LIFECYCLE_INTENT
    desc: 非 owner 文件调用 openGrid / rebuildGrid / closeGrid / closeGridCell
    severity: fail
  - id: NON_OWNER_CALLS_NATIVE_DESTROY
    desc: 非 owner（useBrowserStore）文件调用 bridge.closeGrid
    severity: fail
  - id: COMPONENT_WRITES_FILES_PATH
    desc: 组件直接写 filePath / inlineFile / previewDir / pathInput / fileContent / inlineText 等文件域状态（owner: useFileStore）；须经 canonical writer
    severity: fail
  - id: WS_OWNER_01
    desc: useWorkspaceStore 不得再声明 Files-owned state（ref/reactive/computed）；文件域状态唯一真源已迁 useFileStore（8C-0A）
    severity: fail
  - id: WS_OWNER_02
    desc: Files 状态只能由 useFileStore canonical writer 写；组件/其它 store 不得直写（须经 setFileContent / setInlineText / setEditorView / enterDir / openFile 等）
    severity: fail
  - id: WS_OWNER_03
    desc: Editor-owned state 不得存回 Workspace（编辑器缓冲隔离）；useWorkspaceStore 不得持有 editingFile / mdPreview 等文件态
    severity: fail
  - id: WS_OWNER_04
    desc: Repo/Git 与 Files 不得交叉保存第二份身份/状态；仅 useWorkspaceStore 持有 repo 态，useFileStore 不得复制
    severity: fail
  - id: WS_FACADE_01
    desc: 若保留兼容性 facade，不得存储第二份状态（8C-0A 采取真实抽取，无 facade）
    severity: fail
  - id: WS_FACADE_02
    desc: 禁止新增旧 Workspace API 消费点；已抽出的文件态须经 useFileStore，不得再经 useWorkspaceStore 访问
    severity: fail
  - id: WS_OWNER_05
    desc: useWorkspaceStore 不得再声明 Artifact-owned state（tree/current/editTitle/editTags/editText/selected/flatArtifacts/ctxMenu）；已迁 useArtifactStore（8C-0B）
    severity: fail
  - id: WS_OWNER_06
    desc: Artifact 状态只能由 useArtifactStore canonical writer/action 写；组件/其它 store 不得直写（须经 setEditTitle/setEditTags/setEditText/openArtifact/toggle 等）
    severity: fail
  - id: WS_OWNER_07
    desc: useWorkspaceStore 不得再声明 Repo-owned state（repos/form/preview/busy/job）；已迁 useRepoStore（8C-0C）
    severity: fail
  - id: WS_OWNER_08
    desc: Repo 状态只能由 useRepoStore action/canonical writer 写；组件不得直写（preview 关闭须经 clearPreview）
    severity: fail
  - id: WS_OWNER_09
    desc: useWorkspaceStore 不得再声明 Script-owned state（scripts/scriptForm）；已迁 useScriptStore（8C-0D）
    severity: fail
  - id: WS_OWNER_10
    desc: Script 增删改只能经 useScriptStore action；组件不得直写 scripts
    severity: fail
  - id: WS_OWNER_11
    desc: useWorkspaceStore 不得再声明 Snippet-owned state（snippets/snippetForm）；已迁 useSnippetStore（8C-0D）
    severity: fail
  - id: WS_OWNER_12
    desc: Snippet 增删改只能经 useSnippetStore action；组件不得直写 snippets
    severity: fail
  - id: COMPONENT_WRITES_BOOKMARK
    desc: 组件直接写 items / panelOpen（owner: useBookmarkStore）；或维护第二份 Bookmark[]
    severity: fail
  - id: COMPONENT_WRITES_TERMINAL
    desc: 组件直接写 termPanes / activeTermId / terminalOpen（owner: useTerminalStore）；或维护第二份面板列表
    severity: fail
  - id: FRONTEND_CREDENTIAL_LEAK
    desc: 前端 reactive 状态（ref/reactive/shallowRef/computed）持有原始凭据值（password/token/secret/api_key）
    severity: fail
  - id: CREDENTIAL_DISPLAYED_OR_EXPORTED
    desc: 代码中出现 exposePassword / copyPassword / exportCredential 等已否决意图（凭据泄露）
    severity: fail
