# ============================================================
# Semantic Owner Registry
#
# 目的：防止 Component 直接修改生命周期，防止 store 跨界写别人的状态。
# Rule 3（OWNER_VIOLATION）据此判定。
# ============================================================

version: 1
registry_scope: Browser/Grid + View Navigation（Phase 1）+ Workspace/FilePanel（Phase 2）+ Bookmark（Phase 3）+ Terminal Lifecycle（Phase 4）+ Credential Security（Phase 5）已确认语义

owners:

  view_navigation:
    owner: useLayoutStore
    owns:
      - mainView
      - gridToolbarOpen
    owner_only_api:
      - setView
      - activateView
      - activateBrowser
      - activateHome
      - activateFiles
      - activateTerm
      - activateEditor
      - activateWorkspace
      - openModule
    forbidden_callers:
      - components/**（不得直写 mainView）
      - useBrowserStore（不得直写 mainView，须经 layout.setView）
    may_call:
      - useBrowserStore（可调 setView / openModule 等被授权的导航入口）
    rationale: 通用导航 store；若兼管 Grid 资源生命周期会反向依赖 useBrowserStore 形成循环
    status: ACCEPTED_ADR

  browser_grid_lifecycle:
    owner: useBrowserStore
    owns:
      - gridOpen
      - grid lifecycle
      - gridSession (Phase 6A 收口；见 ADR-SEM-P6A-3)
      - desiredGridVisibility (derived)
      - isBrowserVisible (derived)
      - aiNavOpen (Phase 6A 收口；useLayoutStore 死重复已删)
    owner_only_api:
      - buildGrid
      - closeGridAll
      - closeGridOne
    public_intent_api:
      - activateGrid
      - openGrid
      - rebuildGrid
      - closeGrid
      - closeGridCell
    forbidden_callers:
      - components/**（不得直调生命周期原语）
      - 任何非授权 store / composable
    authorized_callers:
      - useBrowserStore（owner 自身）
      - useLayoutStore（经授权入口，如 toggleGridToolbar 调 openGrid / closeGrid）
    rationale: 资源生命周期归母属 store；useLayoutStore 退为视图状态执行点
    status: ACCEPTED_ADR

  native_execution:
    owner: bridge
    owner_alt: Rust
    owns:
      - bounds
      - visibility effect
      - webview position
    owner_only_api:
      - gridPosition
      - tabPosition
      - hideWebview
      - hideAllWebviews
      - createGrid
      - closeGrid
    forbidden_callers:
      - 任何把 native 结果当作域真源回读的模块
    rationale: native 显隐是执行结果，单向派生，禁止回读为真相（ADR-P1A-4）
    status: ACCEPTED_ADR

  browser_tabs:
    owner: useBrowserStore
    owns:
      - activeTabId
      - tabs (reactive)
      - url
    owner_only_api:
      - tabSwitch
      - closeTabNow
      - tabNew
    forbidden_callers:
      - components/**（不得直写 activeTabId）
    status: CURRENT_FACT

  files:
    owner: useFileStore
    owns:
      - filePath
      - inlineFile
      - previewDir
      - pathInput
      - currentLocalPath (derived)
      - fileEntries
      - fileContent
      - editingFile
      - mdPreview
      - mdHtml
      - startDirs
      - previewEntries
      - previewImages
      - previewImageErrors
      - previewLoading
      - previewError
      - previewTileSize
      - compareImages
      - treeRoots
      - treeChildren
      - treeExpanded
      - treeLoading
      - treeErrors
      - locateTarget
      - dragSource
      - dropTarget
      - moveConfirm
      - fileCtx
      - inlineText
      - inlineIsMd
      - inlineEdit
      - inlineHtml
    owner_only_api:
      - enterDir
      - openFile
      - openFileInline
      - openDirPreview
      - saveFile
      - closeInline
      - refreshTree
      - locateTo
      - toggleTreeDir
      - ensureTreeChildren
      - loadTree
      - expandAllTree
      - collapseAllTree
      - loadStartDirs
      - goUp
      - goPath
      - openMd
      - ctxNewFile
      - ctxNewDir
      - ctxDelete
      - ctxRename
      - ctxFavorite
      - copyPath
      - ctxOpenInNewTab
      - ctxOpenInExplorer
      - ctxOpenInTerminal
      - startDrag
      - onDirDragOver
      - onDirDragLeave
      - onDirDrop
      - requestMove
      - confirmMove
      - cancelMove
      - inlineToggleEdit
      - saveInline
      - isImageEntry
      - loadPreviewImage
      - setPreviewTileSize
      - toggleCompareImage
      - moveCompareImage
      - clearCompareImages
      - onFileContext
      - closeFileCtx
      - setFileContent
      - setInlineText
      - setEditorView
      - clearDragSource
    public_intent_api:
      - openFile
      - openFileInline
      - enterDir
      - saveFile
      - openDirPreview
      - closeInline
    forbidden_callers:
      - components/**（不得直写 filePath / inlineFile / previewDir / pathInput / fileContent / inlineText 等 Files 状态；须经 canonical writer）
    authorized_callers:
      - useFileStore（owner 自身）
      - useLayoutStore（经 setView / openDirTab 切到 editor/files 视图）
      - useWorkspaceStore（跨域编排：openRecent → openFile）
    rationale: |
      Phase 8C-0A 将文件浏览 / 行内+覆盖编辑器 / 文件夹树 / 目录图片预览 / 文件右键菜单 / 拖拽移动
      从 useWorkspaceStore（God Store）抽出为独立 owner（useFileStore）。Workspace Core 不再持有文件域状态，
      只保留跨域编排（openRecent 调 useFileStore.openFile）。组件只渲染，不得直写 Files 内部状态。
    status: CURRENT_FACT

  artifact:
    owner: useArtifactStore
    owns:
      - tree
      - current
      - editTitle
      - editTags
      - editText
      - selected
      - flatArtifacts (derived)
      - ctxMenu
    owner_only_api:
      - loadTree
      - openArtifact
      - saveEdit
      - removeArtifact
      - onArtifactContext
      - closeCtx
      - ctxReveal
      - ctxOpenSource
      - ctxRemove
      - toggle
      - collectSelection
      - setEditTitle
      - setEditTags
      - setEditText
    public_intent_api:
      - openArtifact
      - saveEdit
      - removeArtifact
      - toggle
      - collectSelection
    forbidden_callers:
      - components/**（不得直写 tree / current / editTitle / editTags / editText / selected / ctxMenu；须经 canonical writer / action）
    authorized_callers:
      - useArtifactStore（owner 自身）
      - useWorkspaceStore（跨域编排：refresh 调 loadTree；requestSync 读 selected）
      - useLayoutStore（仅导航 setView）
    rationale: |
      Phase 8C-0B 将成果树 / 当前编辑 / 多选 / 右键菜单 / 采集从 useWorkspaceStore（God Store）
      抽出为独立 owner（useArtifactStore），后端持久化（browseWorkspace/readArtifact/updateArtifact/deleteArtifact）。
      Workspace Core 不再持有 artifact 状态；refresh 编排改调本 store.loadTree()，requestSync 跨域读 selected。
    status: CURRENT_FACT

  repo:
    owner: useRepoStore
    owns:
      - repos
      - form
      - preview
      - busy
      - job
    owner_only_api:
      - loadRepos
      - saveRepo
      - requestSync
      - confirmSync
      - clearPreview
      - onSyncCompleted
      - loadGiteeExample
    public_intent_api:
      - saveRepo
      - requestSync
      - confirmSync
      - clearPreview
      - loadGiteeExample
    forbidden_callers:
      - components/**（不得直写 repos / form / preview / busy / job；preview 关闭须经 clearPreview）
    authorized_callers:
      - useRepoStore（owner 自身）
      - useArtifactStore（跨域读：requestSync 读 selected）
      - useLayoutStore（仅导航 setView）
    rationale: |
      Phase 8C-0C 将仓库配置 + 同步（repos/form/preview/busy/job）从 useWorkspaceStore 抽出为独立 owner（useRepoStore）。
      Git 版本操作不在此域（GitPanel 走 bridge / useGitStore）——REPO context ≠ GIT operation；token 走 keyring（credential owner）。
    status: CURRENT_FACT

  script:
    owner: useScriptStore
    owns:
      - scripts
      - scriptForm
    owner_only_api:
      - loadScripts
      - openScriptForm
      - saveScript
      - removeScript
    public_intent_api:
      - loadScripts
      - saveScript
      - removeScript
    forbidden_callers:
      - components/**（不得直写 scripts；表单 scriptForm 经 v-model 于字段可接受，增删改只经 action）
    authorized_callers:
      - useScriptStore（owner 自身）
      - useTaskStore（只读 targets 候选：scripts）
    rationale: |
      Phase 8C-0D 将脚本库 CRUD 从 useWorkspaceStore 抽出为独立 owner（useScriptStore），后端持久化（scriptList/Add/Update/Remove）。
    status: CURRENT_FACT

  snippet:
    owner: useSnippetStore
    owns:
      - snippets
      - snippetForm
    owner_only_api:
      - loadSnippets
      - openSnippetForm
      - saveSnippet
      - removeSnippet
    public_intent_api:
      - loadSnippets
      - saveSnippet
      - removeSnippet
    forbidden_callers:
      - components/**（不得直写 snippets；表单 snippetForm 经 v-model 于字段可接受，增删改只经 action）
    authorized_callers:
      - useSnippetStore（owner 自身）
      - useTaskStore（只读 targets 候选：snippets）
    rationale: |
      Phase 8C-0D 将命令片段库 CRUD 从 useWorkspaceStore 抽出为独立 owner（useSnippetStore），后端持久化（snippetList/Add/Update/Remove）。
      与 SCRIPT 独立（不同后端命令/表），二者同属 Developer 家族但不合并。
    status: CURRENT_FACT

  bookmark:
    owner: useBookmarkStore
    owns:
      - items
      - loaded
      - busy
      - error
      - panelOpen
      - sorted (derived)
    owner_only_api:
      - add
      - remove
      - toggle
      - importFile
      - togglePanel
      - load
      - findByUrl
    public_intent_api:
      - add
      - remove
      - toggle
      - importFile
      - togglePanel
    forbidden_callers:
      - components/**（不得直写 items / panelOpen；只能调 store action）
    authorized_callers:
      - useBookmarkStore（owner 自身）
      - useLayoutStore（仅切视图）
      - BookmarkStar / BookmarkPanel（消费 store，不持有第二列表）
    rationale: 收藏夹列表唯一真源（后端持久化）；任何第二份 Bookmark[] 或裸 url 判定都会与 items 漂移
    status: CURRENT_FACT

  terminal:
    # Phase 8E/Train D：owner 由 useSystemStore（Terminal+Clipboard+Apps 混居）迁为专属 owner。
    owner: useTerminalStore
    owns:
      - terminalOpen
      - termPanes
      - termGrid
      - termGridCount
      - activeTermId
      - autoConfirmCli
      - termProbeOn
      - m0Cfg
      - m0StartTs
      - droppedChunks
      - droppedBytes
    owner_only_api:
      - addTermPane
      - killTerm
      - termWrite
      - setActiveTerm
      - restartTerm
      - bindTermWriter
      - replayTermHistory
      - spawnTerm
      - pushTermHistory
    public_intent_api:
      - addTermPane
      - killTerm
      - termWrite
      - setActiveTerm
      - restartTerm
      - bindTermWriter
      - replayTermHistory
      - toggleTerminal
      - closeTerminal
      - openTerminalAt
    forbidden_callers:
      - components/**（终端组件只能调 store action，不得直写 termPanes/activeTermId/terminalOpen）
      - non-terminal-capability/**（Shell 与其它能力不得 import terminal 内部；Shell 经 public 边界只读展示）
    authorized_callers:
      - useTerminalStore（owner 自身）
      - useLayoutStore（仅导航 setView("term")）
      - TerminalPane.vue / TerminalView.vue / TerminalDockPanel.vue（能力包内消费 store，不持有第二列表）
      - src/composables/terminalNav.ts（窄缝：Workspace「在终端打开」经 Terminal public 边界）
    rationale: 终端面板注册表唯一真源（termPanes）；任何第二份 {id,cwd}[] 或裸 activeTermId 直写都会漂移。PTY 出生点只在 Terminal 能力 UI 内（absent → 无 PTY）
    status: CURRENT_FACT

  credential:
    owner: KeyringStore（core/keyring_store.rs，Rust 侧 OS keyring 薄封装）
    owns:
      - gitRepoToken
      - dbCredential
      - browserCredential
    manages:
      - gitRepoToken
      - dbCredential
      - browserCredential
      - keyring lifecycle（save_token / get_token / delete_token / keyringRead）
    owner_only_api:
      - save_token
      - get_token
      - delete_token
    public_intent_api:
      - saveCredential
      - getCredential
      - deleteCredential
      - fillBrowserCredential
      - listBrowserCredentials
    forbidden_callers:
      - 任何前端 store / component（凭据值不得进入前端；组件只经 bridge.fillBrowserCredential 发 credential_id）
    authorized_callers:
      - KeyringStore（owner 自身，Rust）
      - bridge（经 check_invocation_source 校验来源后调 KeyringStore）
    rationale: 凭据真源=系统密钥库；前端只持不透明 metadata（credential_id / has_password），绝不持原始值。R3 已通用化到本 owner（Phase 5.1-A）：前端任何文件直调 owner_only_api（save_token/get_token/delete_token）或引用 KeyringStore 即 SEMANTIC_OWNER_VIOLATION；组件只经 bridge 意图入口。Debt-5-2 已收口。
    status: CURRENT_FACT

  # ---------------- Capability Library Expansion v1（STAGE H / I-A / Home）----------------
  clipboard:
    owner: useClipboardStore
    owns:
      - clipText
      - clipHistory
    owner_only_api:
      - clipCopy
      - clipPaste
      - clipReadSilent
      - useClipItem
      - copyClipItem
      - clearClipHistory
    public_intent_api:
      - copyClipboard
      - pasteClipboard
      - readClipboardSilent
      - useClipItem
      - clearClipHistory
    forbidden_callers:
      - components/**（不得直写 clipText/clipHistory；须经 canonical writer）
    authorized_callers:
      - useClipboardStore（owner 自身）
      - useLayoutStore（仅导航 setView("clip") / clipOpen 面板开关）
    rationale: STAGE H 从 useSystemStore 拆出的专属 owner；剪贴板历史仅会话内存（B11-1 红线禁止落盘），系统剪贴板经 bridge.clipboardRead/clipboardWrite 同步
    status: CURRENT_FACT

  apps:
    owner: useAppsStore
    owns:
      - apps
      - appFilter
      - brokenIcons
      - filteredApps (derived)
    owner_only_api:
      - loadApps
      - onAppImgError
    public_intent_api:
      - loadApps
      - launchApp
    forbidden_callers:
      - components/**（不得直写 apps/appFilter/brokenIcons；filteredApps 派生只读）
    authorized_callers:
      - useAppsStore（owner 自身）
      - useLayoutStore（launchApp 经 bridge.launchApp → security_policy::check_launch_target）
    rationale: STAGE H 拆出的专属 owner；应用启动经安全策略白名单解析（禁 sh -c）
    status: CURRENT_FACT

  tools:
    owner: useToolsStore
    owns:
      - tools
      - builtin (derived)
      - user (derived)
      - error (observed)
    owner_only_api:
      - load
      - open
    public_intent_api:
      - loadTools
      - openTool
    forbidden_callers:
      - components/**（不得直写 tools）
    authorized_callers:
      - useToolsStore（owner 自身）
    rationale: STAGE H 新建 owner；工具在独立子 webview 打开，零能力隔离（ACL 拒绝工具内 invoke）
    status: CURRENT_FACT

  home:
    owner: useHomeStore
    owns:
      - shortcuts
      - recents
      - editing
      - has (derived)
      - hasRecents (derived)
      - panelState (derived)
      - loading (observed)
      - error (observed)
    owner_only_api:
      - saveEdit
      - remove
      - resetDefault
      - seedDirShortcuts
      - favoriteDirectory
      - favoriteCurrentPage
      - favoriteCurrentDir
    public_intent_api:
      - openShortcut
      - favoriteCurrentPage
      - favoriteCurrentDir
      - saveShortcut
      - removeShortcut
      - clearRecents
      - seedDirShortcuts
    forbidden_callers:
      - components/**（不得直写 shortcuts/recents/editing）
    authorized_callers:
      - useHomeStore（owner 自身）
      - useLayoutStore（仅导航 setView）
    rationale: 主页索引域；快捷方式 localStorage 前端真源，与 Bookmark 后端持久化隔离（rejected mergeBookmarksIntoHome）；唯一真实原生副作用是 launchApp（经 bridge.launchApp）
    status: CURRENT_FACT

  vault:
    owner: useVaultStore
    owns:
      - path
      - root
      - notes
      - selected
      - query
      - line
      - anchor
      - warning
      - choices
      - sourceMode
      - vaultCurrent (derived)
      - vaultResults (derived)
      - vaultEdges (derived)
      - vaultBacklinks (derived)
      - busy (observed)
      - error (observed)
    owner_only_api:
      - open
      - pickDirectory
      - select
      - follow
    public_intent_api:
      - openVault
      - pickVaultDirectory
      - selectNote
      - followLink
    forbidden_callers:
      - components/**（不得直写 path/notes/selected/query 等；须经 canonical writer）
    authorized_callers:
      - useVaultStore（owner 自身）
      - useLayoutStore（仅导航 setView("vault")）
    rationale: STAGE I-A 从 src/stores 迁入专属 owner；Vault 只读目录镜像（后端 vaultOpen 快照），派生量禁止写入（R6 护栏）
    status: CURRENT_FACT

  # ---------------- Capability Library Expansion v1（SG-C Medium：agent/database/git/skill）----------------
  agent:
    owner: useAgentStore
    owns:
      - agents
      - agentInstalls
      - agentSessions
      - selectedAgentId
      - agentValidation
      - agentParseDef
      - agentPreview
      - selectedAgent (derived)
      - agentStatus (derived)
      - boundedAgentPreview (derived)
      - loading (observed)
      - error (observed)
      - backendReady (observed)
    owner_only_api:
      - loadAgents
      - installAgent
      - runAgent
      - cancelRun
      - validateAgent
      - clearValidation
    public_intent_api:
      - loadAgents
      - selectAgent
      - installAgent
      - runAgent
      - cancelRun
      - validateAgent
    forbidden_callers:
      - components/**（不得直写 agents/agentInstalls/agentSessions 等）
    authorized_callers:
      - useAgentStore（owner 自身）
      - useInstallConfirmStore（installAgent/ackConfirm 委托中性协调器 → confirm_agent_install）
    rationale: 真实领域 + owner + 原生副作用；前端镜像 Rust agent_*；secret 不进 store（纵深脱敏）；backendReady 闸门保证未就绪零 invoke
    status: CURRENT_FACT

  database:
    owner: useDatabaseStore
    owns:
      - form
      - connections
      - configs
      - documents
      - activeDocument
      - connecting
      - schema
      - schemaBusy
      - closePending
      - risk
      - verdict
      - document (derived)
      - activeId (derived)
      - sql (derived)
      - result (derived)
      - pendingSql (derived)
      - connected (derived)
      - formIssues (derived)
      - runGate (derived)
      - requiresConfirm (derived)
      - confirmOpen (derived)
