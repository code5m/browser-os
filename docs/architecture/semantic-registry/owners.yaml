    authorized_callers:
      - useGitStore（owner 自身）
      - GitPanel.vue / GitWriteConfirmDialog.vue / App.vue（消费 + 全局写完成事件）
    rationale: 真实领域 + 强原生写副作用；双段闸门：requestWrite 只生成待确认预览，dangerous（discard/push）须本地二次确认勾选后 confirm 才发；无 watch 自动写；凭据不进前端
