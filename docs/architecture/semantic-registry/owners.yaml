    owns:
      - skills
      - skillInstalls
      - selectedSkillId
      - skillValidation
      - skillParseDef
      - skillPreview
      - selectedSkill (derived)
      - skillStatus (derived)
      - boundedPreview (derived)
      - loading (observed)
      - error (observed)
      - backendReady (observed)
    owner_only_api:
      - loadSkills
      - installSkill
      - validateSkill
      - clearValidation
    public_intent_api:
      - loadSkills
      - selectSkill
      - installSkill
      - validateSkill
    forbidden_callers:
      - components/**（不得直写 skills/skillInstalls/skillValidation 等）
    authorized_callers:
      - useSkillStore（owner 自身）
      - useInstallConfirmStore（installSkill/ackConfirm 委托中性协调器 → confirm_skill_install）
