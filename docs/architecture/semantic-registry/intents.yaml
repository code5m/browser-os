  exitGrid:
    reason: 多义万能 API（一个动词承担 hide/destroy/切视图），mode 参数易误用
    rejected_by: phase1-browser-grid/07-ALTERNATIVES.md §2
    status: REJECTED
    action: 代码中出现即 SEMANTIC_INTENT_DUPLICATE（阻断级）

  mergeOpenFileIntoOpenFileInline:
    reason: 覆盖编辑器 vs 行内编辑器是两条独立 UX 路径，合并会丢失隔离并引入第二位置真源
    rejected_by: phase2-workspace/Phase2-design.md §2
    status: REJECTED
    action: 二者必须保持独立意图入口

  mergeBookmarksIntoHome:
    reason: 收藏夹（后端持久化、可导入导出）与主页快捷方式（localStorage、仅本机）生命周期不同，合并引入数据错位与第二真源
    rejected_by: phase3-bookmark/Phase3-design.md §2
    status: REJECTED
    action: 二者必须保持独立源；BookmarkStar 只调 bookmark store，不读 useHomeStore 收藏

  componentWritesTermPanes:
    reason: 组件直写 termPanes/activeTermId 会破坏 INV-4-1/4-2（第二注册表 / 悬空 activeTermId）
    rejected_by: phase4-terminal/Phase4-design.md §2
    status: REJECTED
    action: 面板增删只经 store action（addTermPane/killTerm）；activeTermId 只经 setActiveTerm

  exposePassword:
    reason: 安全红线（CredentialList.vue）：密码绝不显示/查看/复制/导出
    rejected_by: phase5-credential/Phase5-design.md §2
    status: REJECTED
    action: 代码中出现即 SEMANTIC_INTENT_DUPLICATE（阻断级）

  copyPassword:
    reason: 禁止把密码复制到剪贴板（clipboard 历史已改为不落盘，但仍不得写入凭据原文）
    rejected_by: phase5-credential/Phase5-design.md §2
    status: REJECTED
    action: 代码中出现即 SEMANTIC_INTENT_DUPLICATE（阻断级）

  exportCredential:
    reason: 禁止把凭据（含密码）导出到文件/日志/网络
    rejected_by: phase5-credential/Phase5-design.md §2
    status: REJECTED
    action: 代码中出现即 SEMANTIC_INTENT_DUPLICATE（阻断级）

