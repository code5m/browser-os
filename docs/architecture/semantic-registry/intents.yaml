# ============================================================
# Semantic Intent Registry — 一个用户意图 = 一个 canonical 入口
#
# 禁止注册已被 ADR 否决的多义入口（exitGrid(mode) 等）。
# 状态分类见 README.md；PROPOSED_CHANGE 表示代码中尚不存在。
# ============================================================

version: 1
registry_scope: Browser/Grid + View Navigation（Phase 1）+ Workspace/FilePanel（Phase 2）+ Bookmark（Phase 3）+ Terminal Lifecycle（Phase 4）+ Credential Security（Phase 5）已确认语义

intents:

  # ---------------- View Navigation（owner: useLayoutStore）----------------
  activateView:
    meaning: 通用视图导航（切到指定 Main Surface）
    owner: useLayoutStore
    allowed_effects:
      - mainView = v
    forbidden_effects:
      - destroy any resource
      - create any resource
    duplicate_names: []
    status: ACCEPTED_ADR

  activateBrowser:
    meaning: 切到浏览器主表面
    owner: useLayoutStore
    allowed_effects:
      - mainView = browser
    forbidden_effects:
      - destroy Grid resource
      - closeGrid
    duplicate_names:
      - showBrowserView
      - enterBrowser
      - gotoBrowser
    status: ACCEPTED_ADR

  activateHome:
    meaning: 切到主页
    owner: useLayoutStore
    allowed_effects:
      - mainView = home
    forbidden_effects:
      - destroy Grid resource
    duplicate_names: []
    status: ACCEPTED_ADR

  # ---------------- Browser/Grid Lifecycle（owner: useBrowserStore）----------------
  activateGrid:
    meaning: 进入 Grid 主表面（资源已存在则重排，否则创建）
    owner: useBrowserStore
    allowed_effects:
      - ensure grid exists (openGrid)
      - mainView = grid
      - layout grid
    forbidden_effects:
      - destroy grid
      - reload existing grid
      - recreate existing grid
    duplicate_names:
      - showGridView
      - enterGrid
      - openGridPage
      - gotoGrid
    status: ACCEPTED_ADR
    note: 内部经 layout.openModule("grid")，再按 gridOpen 决定 layoutGrid 或 openGrid

  openGrid:
    meaning: 确保 Grid 资源存在（不导航）
    owner: useBrowserStore
    allowed_effects:
      - create grid if absent (buildGrid)
    forbidden_effects:
      - navigate / change mainView
      - rebuild existing grid（改格数/布局必须走 rebuildGrid）
    duplicate_names:
      - ensureGrid
      - createGridIfNeeded
    status: ACCEPTED_ADR
    note: 与 rebuildGrid 语义分离，禁止合并（Regression B）

  rebuildGrid:
    meaning: 按当前 gridCount/gridLayout 真重建 Grid 资源
    owner: useBrowserStore
    allowed_effects:
      - destroy and recreate grid webviews
      - gridSession += 1
    forbidden_effects:
      - navigate / change mainView
    duplicate_names:
      - recreateGrid
      - resetGrid
    status: ACCEPTED_ADR
    note: 改格数/切布局必须走它；openGrid 是 no-op 不能替代（Regression B）

  closeGrid:
    meaning: 销毁 Grid 资源（显式关闭）
    owner: useBrowserStore
    allowed_effects:
      - gridOpen = false
      - bridge.closeGrid
      - 若 mainView==="grid" 派生收敛为 browser（由不变量守卫，非本入口直写）
    forbidden_effects:
      - 承担普通视图切换语义（view switch 是 hide only）
      - 直接写 mainView（由 owner 守卫派生）
    duplicate_names:
      - destroyGrid
      - shutdownGrid
      - exitGrid
    status: ACCEPTED_ADR
    note: App shutdown 与产品级 closeGrid 意图分离，底层可复用 destroy 原语但语义不得混同

  closeGridCell:
    meaning: 关闭单个宫格（销毁该子窗，其余保留并重排）
    owner: useBrowserStore
    allowed_effects:
      - bridge.gridCloseOne
      - 剩余格子重排
      - 剩 1 格时整体 closeGrid
    forbidden_effects:
      - navigate
    duplicate_names: []
    status: CURRENT_FACT
    note: 当前无 UI 调用方（Debt-003，orphan API）

  tabSwitch:
    meaning: 切换到指定页签并激活
    owner: useBrowserStore
    allowed_effects:
      - activeTabId = id
      - url = tab.url
      - bridge.tabActivate
    forbidden_effects:
      - create or destroy tab
      - change mainView
    duplicate_names:
      - switchTab
      - activateTab
      - selectTab
    status: CURRENT_FACT
    note: 真实入口名为 tabSwitch；清单中的 switchTab 在代码中不存在（PROPOSED_CHANGE）

  closeTabNow:
    meaning: 关闭指定页签（立即，不经确认）
    owner: useBrowserStore
    allowed_effects:
      - bridge.tabClose
      - 维护 recentlyClosed
      - 无页签时 setView("browser")
    forbidden_effects:
      - 销毁浏览器 webview 资源
    duplicate_names:
      - closeTab
      - removeTab
    status: CURRENT_FACT
    note: 真实入口名为 closeTabNow；清单中的 closeTab 在代码中不存在（PROPOSED_CHANGE）

  # ---------------- Workspace / FilePanel（owner: useFileStore，Phase 8C-0A 起）----------------
  openFile:
    meaning: 在覆盖编辑器打开文件（overlay editor）
    owner: useFileStore
    allowed_effects:
      - filePath = entry.path
      - editingFile = true
      - mainView = editor（经 layout.setView）
    forbidden_effects:
      - destroy any resource
      - change inlineFile（行内编辑器隔离）
    duplicate_names:
      - openLocalFile
      - viewFile
      - editFile
      - showFile
    status: CURRENT_FACT
    note: 与 openFileInline 两条独立 UX 路径，禁止合并（类比 openGrid≠rebuildGrid）

  openFileInline:
    meaning: 在行内编辑器打开文件（IDE 右栏）
    owner: useFileStore
    allowed_effects:
      - inlineFile = entry.path
      - filePath = parent dir（同步，隔离不混用）
    forbidden_effects:
      - change mainView
      - change editingFile（覆盖编辑器隔离）
    duplicate_names:
      - openInlineFile
    status: CURRENT_FACT

  enterDir:
    meaning: 进入目录（文件浏览器导航，单一地址真源）
    owner: useFileStore
    allowed_effects:
      - filePath = path
    forbidden_effects:
      - change inlineFile
      - change previewDir
    duplicate_names:
      - openDir
      - gotoDir
      - cdDir
      - navigateDir
    status: CURRENT_FACT

  saveFile:
    meaning: 持久化当前文件内容到磁盘
    owner: useFileStore
    allowed_effects:
      - bridge.writeFile(filePath, fileContent)
    forbidden_effects:
      - change mainView
      - navigate
    duplicate_names:
      - writeFileContent
      - persistFile
    status: CURRENT_FACT

  closeFileEditor:
    meaning: 关闭覆盖编辑器（不销毁任何资源）
    owner: useFileStore
    allowed_effects:
      - editingFile = false
      - layout.fileEditorOpen = false
    forbidden_effects:
      - destroy any resource
      - change filePath / inlineFile
    duplicate_names:
      - dismissFileEditor
    status: CURRENT_FACT
    note: rejected 重复名 closeEditor（已被 FileEditor.vue / useTaskStore 定义，禁止作为本域重复入口）

  # ---------------- Bookmark（owner: useBookmarkStore，Phase 3）----------------
  add:
    meaning: 新增/更新收藏（同 URL 视为更新，保留 id/created_at）
    owner: useBookmarkStore
    allowed_effects:
      - items = splice 替换（按 id/normalizeUrl，禁止 push 重复）
      - bridge.bookmarkAdd
    forbidden_effects:
      - 维护第二份 Bookmark[]（纯 derived）
    duplicate_names:
      - bookmarkAdd
      - createBookmark
      - saveBookmark
    status: CURRENT_FACT

  remove:
    meaning: 取消收藏（按 id）
    owner: useBookmarkStore
    allowed_effects:
      - items = filter 移除 id
      - bridge.bookmarkRemove
    forbidden_effects: []
    duplicate_names:
      - deleteBookmark
      - removeBookmark
    status: CURRENT_FACT

  toggle:
    meaning: 地址栏 ⭐ 唯一入口：已收藏→按 id 移除，未收藏→写入
    owner: useBookmarkStore
    allowed_effects:
      - 内部路由到 remove / add
    forbidden_effects:
      - 直写 items（须经 findByUrl 判定）
    duplicate_names:
      - toggleBookmark
      - starUrl
      - bookmarkToggle
    status: CURRENT_FACT
    note: 地址栏星标唯一入口（BookmarkStar 仅调 toggle，不另起函数）

  importFile:
    meaning: 从 HTML/JSON 书签文件批量导入（按 normalizeUrl 去重）
    owner: useBookmarkStore
    allowed_effects:
      - 解析 → 逐条 add（后端去重兜底）
    forbidden_effects: []
    duplicate_names:
      - importBookmarks
    status: CURRENT_FACT

  togglePanel:
    meaning: 切换收藏夹侧栏显隐
    owner: useBookmarkStore
    allowed_effects:
      - panelOpen = !panelOpen
    forbidden_effects:
      - change items
    duplicate_names:
      - openBookmarkPanel
      - showBookmarkPanel
    status: CURRENT_FACT

  # ---------------- Terminal Lifecycle（owner: useTerminalStore，Phase 4；owner 于 Phase 8E/Train D 迁移）----------------
  addTermPane:
    meaning: 新建终端面板（spawn）
    owner: useTerminalStore
    allowed_effects:
      - termPanes = push({id,cwd})
      - activeTermId = id
      - spawnTerm IPC
    forbidden_effects:
      - 维护第二份面板列表
    duplicate_names:
      - spawnTermPane
      - newTerm
      - openTerm
    status: CURRENT_FACT

  killTerm:
    meaning: 按 id 关闭面板（filter + 重置 activeTermId）
    owner: useTerminalStore
    allowed_effects:
      - bridge.closeTerm(id)
      - termPanes = filter(!=id)
      - activeTermId = termPanes[0]?.id ?? ""（INV-4-2）
    forbidden_effects: []
    duplicate_names:
      - closeTerm
  - hideTerminal
  - dismissTerminal
      - removeTerm
      - terminateTerm
    status: CURRENT_FACT

  termWrite:
    meaning: 向 PTY 写入（用户输入 / 自动确认）
    owner: useTerminalStore
    allowed_effects:
      - bridge.termWrite(input)
    forbidden_effects:
      - change termPanes
    duplicate_names:
      - sendTerm
      - writeTerm
    status: CURRENT_FACT

  setActiveTerm:
    meaning: 聚焦某面板（activeTermId = id，必须 ∈ termPanes）
    owner: useTerminalStore
    allowed_effects:
      - activeTermId = id
    forbidden_effects:
      - 写入悬空 id
    duplicate_names:
      - focusTerm
    status: CURRENT_FACT
    note: 拒绝用 activateTerm 作重复名（useLayoutStore.activateTerm 是导航 setView("term")，语义不同）

  restartTerm:
    meaning: 重启面板（killTerm + addTermPane）
    owner: useTerminalStore
    allowed_effects:
      - killTerm(id) + addTermPane()
    forbidden_effects: []
    duplicate_names:
      - restartTerminal
    status: CURRENT_FACT

  closeTerminal:
    meaning: 隐藏终端面板（terminalOpen = false 的 canonical 入口；面板内 ✕ 走此入口）
    owner: useTerminalStore
    allowed_effects:
      - terminalOpen = false
    forbidden_effects:
      - 销毁任何 PTY / 面板
    duplicate_names:
      - hideTerminal
      - dismissTerminal
    status: CURRENT_FACT

  bindTermWriter:
    meaning: 注册面板输出 sink（PTY→xterm）
    owner: useTerminalStore
    allowed_effects:
      - 绑定 writer（PTY 输出 → xterm.write）
    forbidden_effects: []
    duplicate_names:
      - setTermWriter
    status: CURRENT_FACT

  replayTermHistory:
    meaning: 面板重建时回放会话内历史（≤40 条，不落盘）
    owner: useTerminalStore
    allowed_effects:
      - 回放 termHistory 到 xterm
    forbidden_effects:
      - 写入磁盘
    duplicate_names:
      - replayTerm
    status: CURRENT_FACT

  # ---------------- Credential Security（owner: credential / KeyringStore，Phase 5）----------------
  saveCredential:
    meaning: 把凭据写入系统密钥库（token/password，按命名空间键）
    owner: credential
    allowed_effects:
      - KeyringStore.save_token(namespace_key, value)
    forbidden_effects:
      - 在前端 reactive 状态留存原始凭据值
      - 把凭据回传前端展示
    duplicate_names:
      - storeCredential
      - configureCredential
    aliases:
      - dbConnect  # DB 密码经 db_connect 写入 keyring
    status: CURRENT_FACT
    note: 真实入口是 KeyringStore::save_token（Rust），前端不经手原始值

  getCredential:
    meaning: 从系统密钥库读取凭据（仅 Rust 侧，绝不到前端）
    owner: credential
    allowed_effects:
      - KeyringStore.get_token(namespace_key)
    forbidden_effects:
      - 把凭据值传回前端
    duplicate_names:
      - loadCredential
    status: CURRENT_FACT

  deleteCredential:
    meaning: 从系统密钥库删除凭据
    owner: credential
    allowed_effects:
      - KeyringStore.delete_token(namespace_key)
    forbidden_effects: []
    duplicate_names:
      - revokeCredential
    aliases:
      - dbDisconnect  # 断开 DB 一并撤销 keyring 凭据
    status: CURRENT_FACT

  fillBrowserCredential:
    meaning: 按 exact origin 把浏览器凭据注入登录表单（Rust 读 keyring 后注入）
    owner: credential
    allowed_effects:
      - 仅传不透明 credential_id + 页签 id → Rust 读 keyring 注入密码
    forbidden_effects:
      - 前端接触密码原文
      - 自动登录 / 自动提交 / 跨源填充
    duplicate_names:
      - autofillCredential
    status: CURRENT_FACT
    note: 安全红线：组件只发 credential_id，Rust 完成 keyring 读取与注入

  listBrowserCredentials:
    meaning: 列出当前网页同源的可填充账号（仅元数据）
    owner: credential
    allowed_effects:
      - 返回 BrowserCredentialItem[]（id/username/origin/has_password，无密码）
    forbidden_effects:
      - 返回密码原文
    duplicate_names: []
    status: CURRENT_FACT

  # ---------------- Clipboard（owner: useClipboardStore，STAGE H）----------------
  copyClipboard:
    meaning: 把当前 clipText 复制到系统剪贴板
    owner: useClipboardStore
    allowed_effects:
      - bridge.clipboardWrite(clipText)
    forbidden_effects:
      - 持久化历史（仅内存上限裁剪）
    duplicate_names:
      - copyToClipboard
    status: CURRENT_FACT

  pasteClipboard:
    meaning: 从系统剪贴板读入 clipText
    owner: useClipboardStore
    allowed_effects:
      - bridge.clipboardRead → clipText
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  readClipboardSilent:
    meaning: 焦点事件驱动静默同步系统剪贴板到 clipText（不弹 toast）
    owner: useClipboardStore
    allowed_effects:
      - bridge.clipboardRead → clipText
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  useClipItem:
    meaning: 取用历史条目作为当前 clipText
    owner: useClipboardStore
    allowed_effects:
      - clipText = item.text
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  clearClipHistory:
    meaning: 清空会话内剪贴板历史
    owner: useClipboardStore
    allowed_effects:
      - clipHistory.splice(0)
    forbidden_effects:
      - 写入磁盘
    duplicate_names: []
    status: CURRENT_FACT

  # ---------------- Apps（owner: useAppsStore，STAGE H）----------------
  loadApps:
    meaning: 加载已安装应用列表
    owner: useAppsStore
    allowed_effects:
      - bridge.listApps → apps
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  launchApp:
    meaning: 启动指定应用（exec 经 security_policy::check_launch_target 白名单解析，禁 sh -c）
    owner: useAppsStore
    allowed_effects:
      - bridge.launchApp(exec)
    forbidden_effects:
      - 任意命令执行（仅声明 exec，Rust 侧白名单）
    duplicate_names: []
    status: CURRENT_FACT

  # ---------------- Tools（owner: useToolsStore，STAGE H）----------------
  loadTools:
    meaning: 加载工具清单（builtin/user 派生）
    owner: useToolsStore
    allowed_effects:
      - bridge.listTools → tools
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  openTool:
    meaning: 在独立子 webview（tool:// 协议）打开工具
    owner: useToolsStore
    allowed_effects:
      - bridge.openTool(id)
    forbidden_effects:
      - 跨能力调用 invoke（ACL 拒绝工具内 invoke）
    duplicate_names: []
    status: CURRENT_FACT

  # ---------------- Home（owner: useHomeStore，Capability Library Expansion v1）----------------
  openShortcut:
    meaning: 按快捷方式类型路由打开（url→浏览器 / dir→文件树 / app→启动）
    owner: useHomeStore
    allowed_effects:
      - 路由到 browser.openBrowser / fs.enterDir / bridge.launchApp
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  favoriteCurrentPage:
    meaning: 收藏当前浏览器页为快捷方式
    owner: useHomeStore
    allowed_effects:
      - shortcuts = splice 替换（by id）
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  favoriteCurrentDir:
    meaning: 收藏当前目录为快捷方式
    owner: useHomeStore
    allowed_effects:
      - shortcuts = splice 替换（by id）
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  saveShortcut:
    meaning: 新增/更新快捷方式（同 id 视为更新）
    owner: useHomeStore
    allowed_effects:
      - shortcuts = splice 替换
    forbidden_effects:
      - 维护第二份列表
    duplicate_names: []
    status: CURRENT_FACT

  removeShortcut:
    meaning: 删除快捷方式（by id）
    owner: useHomeStore
    allowed_effects:
      - shortcuts = filter 移除 id
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  clearRecents:
    meaning: 清空最近访问
    owner: useHomeStore
    allowed_effects:
      - recents.splice(0)
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  seedDirShortcuts:
    meaning: 首次播种常用目录快捷方式
    owner: useHomeStore
    allowed_effects:
      - bridge.getStartDirs → shortcuts 播种
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  # ---------------- Vault（owner: useVaultStore，STAGE I-A，升级 FULLY）----------------
  openVault:
    meaning: 打开 Vault 目录并加载笔记快照
    owner: useVaultStore
    allowed_effects:
      - bridge.vaultOpen(path) → root/notes
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  pickVaultDirectory:
    meaning: 选择 Vault 目录（系统对话框）
    owner: useVaultStore
    allowed_effects:
      - openDialog(directory)
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  selectNote:
    meaning: 选中笔记（含行/源视图切换）
    owner: useVaultStore
    allowed_effects:
      - selected = path; line = row; sourceMode 条件置 true
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  followLink:
    meaning: 跟随 wikilink 跳转（歧义时给候选）
    owner: useVaultStore
    allowed_effects:
      - resolveNote → select / choices
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  # ---------------- Agent（owner: useAgentStore，STAGE E 同源）----------------
  loadAgents:
    meaning: 加载 Agent 清单
    owner: useAgentStore
    allowed_effects:
      - bridge.agentList → agents
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  selectAgent:
    meaning: 选中 Agent
    owner: useAgentStore
    allowed_effects:
      - selectedAgentId = id
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  installAgent:
    meaning: 安装 Agent（写 pending 到中性协调器，确认后 confirm_agent_install）
    owner: useAgentStore
    allowed_effects:
      - bridge.agentInstall（确认后）
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  runAgent:
    meaning: 运行 Agent（建会话壳 + agentChat 执行）
    owner: useAgentStore
    allowed_effects:
      - bridge.agentChat（执行）
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  cancelRun:
    meaning: 取消 Agent 运行
    owner: useAgentStore
    allowed_effects:
      - bridge.agentRunCancel
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  validateAgent:
    meaning: W9 只读校验（不写 Agent 定义）
    owner: useAgentStore
    allowed_effects:
      - bridge.agentValidate / agentParse / agentPermissionPreview → agentValidation/agentParseDef/agentPreview
    forbidden_effects:
      - 写 Agent 定义
    duplicate_names: []
    status: CURRENT_FACT

  # ---------------- Database（owner: useDatabaseStore）----------------
  refreshConnections:
    meaning: 刷新数据库连接列表
    owner: useDatabaseStore
    allowed_effects:
      - bridge.dbListConnections → connections/configs
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  connectDatabase:
    meaning: 建立外部数据库连接（高风险）
    owner: useDatabaseStore
    allowed_effects:
      - bridge.dbConnect(cfg, password)
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  queryDatabase:
    meaning: 执行 SQL（高风险，写语句经 requiresConfirm 闸门）
    owner: useDatabaseStore
    allowed_effects:
      - bridge.dbQuery（连接能力触发二次确认）
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  disconnectDatabase:
    meaning: 断开外部数据库连接
    owner: useDatabaseStore
    allowed_effects:
      - bridge.dbDisconnect
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  # ---------------- Git（owner: useGitStore，双段写闸门）----------------
  requestGitWrite:
    meaning: 阶段一：生成待确认预览（precheck 失败连请求都不发）
    owner: useGitStore
    allowed_effects:
      - bridge.requestGitWrite → preview
    forbidden_effects:
      - 真写文件/分支/推送
    duplicate_names: []
    status: CURRENT_FACT

  confirmGitWrite:
    meaning: 阶段二：dangerous 未二次确认则 confirm 命令根本不发（真正写文件/分支/推送）
    owner: useGitStore
    allowed_effects:
      - bridge.confirmGitWrite（stage/unstage/discard/commit/push）
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  loadGitStatus:
    meaning: 加载 Git 文件状态
    owner: useGitStore
    allowed_effects:
      - bridge.gitStatus → status
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  # ---------------- Skill（owner: useSkillStore，STAGE E 从 agent 拆出）----------------
  loadSkills:
    meaning: 加载 Skill 清单
    owner: useSkillStore
    allowed_effects:
      - bridge.skillList → skills
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  installSkill:
    meaning: 安装 Skill（写 pending 到中性协调器，确认后 confirm_skill_install）
    owner: useSkillStore
    allowed_effects:
      - bridge.skillInstall（确认后）
    forbidden_effects: []
    duplicate_names: []
    status: CURRENT_FACT

  validateSkill:
    meaning: W9 只读校验（不写 Skill 定义）
    owner: useSkillStore
    allowed_effects:
      - bridge.skillValidate / skillParse / skillPermissionPreview → skillValidation/skillParseDef/skillPreview
    forbidden_effects:
      - 写 Skill 定义
    duplicate_names: []
    status: CURRENT_FACT

