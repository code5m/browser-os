# ============================================================
# Semantic Side Effect Registry
#
# 记录**真实行为**，而不是函数名字。
# 目的：防止 AI / 开发者看到 position() 误认为"只是移动"。
# ============================================================

version: 1
registry_scope: Browser/Grid + View Navigation（Phase 1）+ Workspace/FilePanel（Phase 2）+ Bookmark（Phase 3）+ Terminal Lifecycle（Phase 4）+ Credential Security（Phase 5）已确认语义

# Rule 5 的声明方式：调用点所在函数体内（或调用行上下 6 行内）
# 出现 awareness marker 注释即视为"已知晓该副作用"。
awareness_marker: "side-effect"
awareness_window_lines: 6

side_effects:

  gridPosition:
    declared: position
    actual:
      - set_bounds
      - resize
      - show
    warning: position has visibility side effect —— 在屏 bounds 即 show，离屏即 hide
    call_sites: bridge.gridPosition
    requires_declaration: true
    status: ACCEPTED_ADR
    note: Rust 侧无 show_* 命令，显示=在屏定位（position → show 契约，不拆分）

  tabPosition:
    declared: position
    actual:
      - set_bounds
      - resize
      - show
    warning: position has visibility side effect —— 在屏 bounds 即 show，离屏即 hide
    call_sites: bridge.tabPosition
    requires_declaration: true
    status: ACCEPTED_ADR

  closeGrid:
    declared: destroy grid
    actual:
      - destroy native webviews
      - release grid child processes
    warning: 这是 DESTROY，不是 hide；不可用于普通视图切换
    call_sites: bridge.closeGrid
    requires_declaration: true
    status: ACCEPTED_ADR
    note: 仅 owner（useBrowserStore）可调用

  hideWebview:
    declared: hide one webview
    actual:
      - move offscreen
      - 资源仍存活
    warning: hide ≠ destroy；资源存活，可重新定位回屏
    call_sites: bridge.hideWebview
    requires_declaration: false
    status: ACCEPTED_ADR

  hideAllWebviews:
    declared: hide all webviews
    actual:
      - move all offscreen
      - 资源全部存活
    warning: hide ≠ destroy；这是视图切换时的正确动作（HIDE ONLY）
    call_sites: bridge.hideAllWebviews
    requires_declaration: false
    status: ACCEPTED_ADR

  rebuildGrid:
    declared: rebuild grid
    actual:
      - destroy existing grid webviews
      - create new grid webviews
      - gridSession += 1
      - 定位缓存失效
    warning: 真重建（有 destroy），不是重排；改格数/布局才可用
    call_sites: rebuildGrid
    requires_declaration: true
    status: ACCEPTED_ADR

  writeFile:
    declared: persist / mutate filesystem
    actual:
      - create file (createFile)
      - delete path (deletePath)
      - rename path (renamePath)
      - move path (movePath)
      - overwrite content (writeFile)
    warning: 文件系统变更，影响磁盘真实数据；非纯 UI 操作
    call_sites: bridge.writeFile
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 2 文档级登记（requires_declaration=false，避免对既有合法调用产生 R5 噪声）；
          若需收紧，改本条目为 true 并在 useWorkspaceStore 调用点加 `side-effect:` 标记（业务代码改动）

  bookmarkPersist:
    declared: persist bookmarks
    actual:
      - write backend data_dir/bookmarks.json (bookmarkAdd)
      - delete backend entry (bookmarkRemove)
      - 跨会话持久化
    warning: 后端持久化（与 useHomeStore 主页快捷方式的 localStorage 完全隔离）
    call_sites: bridge.bookmarkAdd
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 3 文档级登记（requires_declaration=false，同 writeFile 口径）；
          与主页快捷方式（localStorage）隔离，不共享写入路径（rejected mergeBookmarksIntoHome）

  termProcess:
    declared: spawn / kill / write PTY
    actual:
      - spawn OS PTY process (spawnTerm)
      - destroy OS PTY process (closeTerm)
      - write input to PTY (termWrite)
    warning: 创建/销毁 OS 进程（资源）；kill 必须释放 PTY，否则进程泄漏
    call_sites: bridge.spawnTerm
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 4 文档级登记（requires_declaration=false，同 writeFile/bookmarkPersist 口径）；
          Rust 端 spawn/kill 资源策略由 check-terminal-policy.py(29) 覆盖（Debt-004 自检 FAIL，既有债，本 Phase 不修）

  keyringWrite:
    declared: write credential to OS keyring
    actual:
      - persist secret in system keychain / credential-manager / secret-service
      - 语义依赖 OS 后端（macOS Keychain / Windows Credential Manager / Linux secret-service）
    warning: 写入系统密钥库（敏感凭据落地）；前端绝不经手原始值；命名空间隔离（repo.id / db:<conn_id> / cred.key）
    call_sites: KeyringStore.save_token
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 5 文档级登记（requires_declaration=false，同 writeFile/termProcess/bookmarkPersist 口径）；
          调用均经 bridge（已 check_invocation_source）后落 keyring，不新增 R5 噪声

  keyringDelete:
    declared: delete credential from OS keyring
    actual:
      - remove secret from system keychain
    warning: 撤销凭据（如 db_disconnect 一并撤销 db:<conn_id>）；与 git 命名空间隔离
    call_sites: KeyringStore.delete_token
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 5 文档级登记（requires_declaration=false，同 keyringWrite 口径）

  sensitiveInput:
    declared: sensitive credential input handling
    actual:
      - 密码/密钥等敏感输入只经安全凭据流（db.connect(password) → keyring）
      - 提交后立即从内存清空（password.value = ""）
    warning: 敏感输入禁止写入 console / localStorage / sessionStorage / 普通 store / export；只走安全凭据流
    forbidden:
      - log（console.log/error/warn/... 含敏感输入）
      - plainStorage（localStorage / sessionStorage.setItem）
      - export（export const x = <敏感输入>）
    allowed:
      - secureCredentialFlow（db.connect(password.value) 后清空）
    call_sites: db.connect（password 作为瞬时入参）
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 5.1-B 登记（Debt-5-1 收口）；R7 据此对 sensitive:true 状态的 frontend_ident（password）做泄露汇扫描，允许 db.connect 安全流与 redactSecrets 脱敏

# ------------------------------------------------------------
# 清单中列出但代码中不存在的项（如实标注，不得当作现状）
# ------------------------------------------------------------
not_found:
  sync_browser_scene:
    reason: 全仓 grep 无命中（src/ 与 src-tauri/src/ 均无）
    status: NOT_FOUND
    action: 不纳入 registry；若将来出现须先走 SCR 登记其真实副作用
