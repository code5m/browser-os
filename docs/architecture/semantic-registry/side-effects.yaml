# ============================================================
# Semantic Side Effect Registry
#
# 记录**真实行为**，而不是函数名字。
# 目的：防止 AI / 开发者看到 position() 误认为"只是移动"。
# ============================================================

version: 1
registry_scope: Browser/Grid + View Navigation（Phase 1）+ Workspace/FilePanel（Phase 2）+ Bookmark（Phase 3）+ Terminal Lifecycle（Phase 4）+ Credential Security（Phase 5）已确认语义

# Rule 5 的声明方式：调用点所在函数体内（或调用行上下 6 行内）
# 出现 awareness marker 注释即视为"已知晓该副作用"。
awareness_marker: "side-effect"
awareness_window_lines: 6

side_effects:

  gridPosition:
    declared: position
    actual:
      - set_bounds
      - resize
      - show
    warning: position has visibility side effect —— 在屏 bounds 即 show，离屏即 hide
    call_sites: bridge.gridPosition
    requires_declaration: true
    status: ACCEPTED_ADR
    note: Rust 侧无 show_* 命令，显示=在屏定位（position → show 契约，不拆分）

  tabPosition:
    declared: position
    actual:
      - set_bounds
      - resize
      - show
    warning: position has visibility side effect —— 在屏 bounds 即 show，离屏即 hide
    call_sites: bridge.tabPosition
    requires_declaration: true
    status: ACCEPTED_ADR

  closeGrid:
    declared: destroy grid
    actual:
      - destroy native webviews
      - release grid child processes
    warning: 这是 DESTROY，不是 hide；不可用于普通视图切换
    call_sites: bridge.closeGrid
    requires_declaration: true
    status: ACCEPTED_ADR
    note: 仅 owner（useBrowserStore）可调用

  hideWebview:
    declared: hide one webview
    actual:
      - move offscreen
      - 资源仍存活
    warning: hide ≠ destroy；资源存活，可重新定位回屏
    call_sites: bridge.hideWebview
    requires_declaration: false
    status: ACCEPTED_ADR

  hideAllWebviews:
    declared: hide all webviews
    actual:
      - move all offscreen
      - 资源全部存活
    warning: hide ≠ destroy；这是视图切换时的正确动作（HIDE ONLY）
    call_sites: bridge.hideAllWebviews
    requires_declaration: false
    status: ACCEPTED_ADR

  rebuildGrid:
    declared: rebuild grid
    actual:
      - destroy existing grid webviews
      - create new grid webviews
      - gridSession += 1
      - 定位缓存失效
    warning: 真重建（有 destroy），不是重排；改格数/布局才可用
    call_sites: rebuildGrid
    requires_declaration: true
    status: ACCEPTED_ADR

  writeFile:
    declared: persist / mutate filesystem
    actual:
      - create file (createFile)
      - delete path (deletePath)
      - rename path (renamePath)
      - move path (movePath)
      - overwrite content (writeFile)
    warning: 文件系统变更，影响磁盘真实数据；非纯 UI 操作
    call_sites: bridge.writeFile
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 2 文档级登记（requires_declaration=false，避免对既有合法调用产生 R5 噪声）；
          若需收紧，改本条目为 true 并在 useWorkspaceStore 调用点加 `side-effect:` 标记（业务代码改动）

  bookmarkPersist:
    declared: persist bookmarks
    actual:
      - write backend data_dir/bookmarks.json (bookmarkAdd)
      - delete backend entry (bookmarkRemove)
      - 跨会话持久化
    warning: 后端持久化（与 useHomeStore 主页快捷方式的 localStorage 完全隔离）
    call_sites: bridge.bookmarkAdd
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 3 文档级登记（requires_declaration=false，同 writeFile 口径）；
          与主页快捷方式（localStorage）隔离，不共享写入路径（rejected mergeBookmarksIntoHome）

  termProcess:
    declared: spawn / kill / write PTY
    actual:
      - spawn OS PTY process (spawnTerm)
      - destroy OS PTY process (closeTerm)
      - write input to PTY (termWrite)
    warning: 创建/销毁 OS 进程（资源）；kill 必须释放 PTY，否则进程泄漏
    call_sites: bridge.spawnTerm
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 4 文档级登记（requires_declaration=false，同 writeFile/bookmarkPersist 口径）；
          Rust 端 spawn/kill 资源策略由 check-terminal-policy.py(29) 覆盖（Debt-004 自检 FAIL，既有债，本 Phase 不修）

  keyringWrite:
    declared: write credential to OS keyring
    actual:
      - persist secret in system keychain / credential-manager / secret-service
      - 语义依赖 OS 后端（macOS Keychain / Windows Credential Manager / Linux secret-service）
    warning: 写入系统密钥库（敏感凭据落地）；前端绝不经手原始值；命名空间隔离（repo.id / db:<conn_id> / cred.key）
    call_sites: KeyringStore.save_token
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 5 文档级登记（requires_declaration=false，同 writeFile/termProcess/bookmarkPersist 口径）；
          调用均经 bridge（已 check_invocation_source）后落 keyring，不新增 R5 噪声

  keyringDelete:
    declared: delete credential from OS keyring
    actual:
      - remove secret from system keychain
    warning: 撤销凭据（如 db_disconnect 一并撤销 db:<conn_id>）；与 git 命名空间隔离
    call_sites: KeyringStore.delete_token
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 5 文档级登记（requires_declaration=false，同 keyringWrite 口径）

  keyringRead:
    declared: read credential from OS keyring
    actual:
      - read secret from system keychain
      - 语义依赖 OS 后端
    level: critical
    owner: credential
    warning: 读出的密钥禁止返回前端 / 写入日志 / 复制到剪贴板（前端只持不透明 metadata：credential_id / has_password）
    forbidden:
      - frontend_return（返回原始 password/token/secret 到网页）
      - log（console/println/tracing 含密钥）
      - clipboard（copyPassword 类复制到剪贴板）
    allowed:
      - injectViaCredentialId（Rust 读 keyring 后注入登录表单，组件不接触密码）
    call_sites: KeyringStore.get_token
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 5.1-C 登记（Debt-5-3 收口）；check-sensitive-side-effects.mjs 据此做 S1/S2 数据流护栏

  sensitiveInput:
    declared: sensitive credential input handling
    actual:
      - 密码/密钥等敏感输入只经安全凭据流（db.connect(password) → keyring）
      - 提交后立即从内存清空（password.value = ""）
    warning: 敏感输入禁止写入 console / localStorage / sessionStorage / 普通 store / export；只走安全凭据流
    forbidden:
      - log（console.log/error/warn/... 含敏感输入）
      - plainStorage（localStorage / sessionStorage.setItem）
      - export（export const x = <敏感输入>）
    allowed:
      - secureCredentialFlow（db.connect(password.value) 后清空）
    call_sites: db.connect（password 作为瞬时入参）
    requires_declaration: false
    status: CURRENT_FACT
    note: Phase 5.1-B 登记（Debt-5-1 收口）；R7 据此对 sensitive:true 状态的 frontend_ident（password）做泄露汇扫描，允许 db.connect 安全流与 redactSecrets 脱敏

  # ---------------- STAGE H / I-A / Home 新增副作用（requires_declaration=false 口径，同 writeFile/termProcess）----------------
  clipboardWrite:
    declared: copy to system clipboard
    actual:
      - write system clipboard via Tauri clipboard plugin
    warning: 系统剪贴板写入；历史仅内存（B11-1 红线，禁止落盘）
    call_sites: bridge.clipboardWrite
    requires_declaration: false
    status: CURRENT_FACT
    note: STAGE H 登记；避免对既有合法调用产生 R5 噪声

  clipboardRead:
    declared: read from system clipboard
    actual:
      - read system clipboard via Tauri clipboard plugin
    warning: 系统剪贴板读取；同步到 clipText（内存）
    call_sites: bridge.clipboardRead
    requires_declaration: false
    status: CURRENT_FACT
    note: STAGE H 登记；事件驱动（焦点/粘贴），无轮询

  appLaunch:
    declared: launch installed application
    actual:
      - spawn OS process (launch_app)
      - security_policy::check_launch_target 白名单解析（禁 sh -c）
    warning: 进程启动；exec 经 Rust 侧白名单校验，前端不得传任意命令
    call_sites: bridge.launchApp
    requires_declaration: false
    status: CURRENT_FACT
    note: apps/home 共用同一桥；W18-R 安全红线（TOOL_CAPABILITY_LEAK / SEED_CAPABILITY_LEAK 同源）

  toolOpen:
    declared: open tool in sub-webview
    actual:
      - 创建 tool:// 子 webview（零能力隔离，ACL 拒绝工具内 invoke）
    warning: 子 webview 创建；工具 HTML 即便调用 invoke() 亦被 ACL 拒
    call_sites: bridge.openTool
    requires_declaration: false
    status: CURRENT_FACT
    note: STAGE H 登记

  vaultOpen:
    declared: open vault directory
    actual:
      - read directory + parse notes (filesystem read)
      - 返回 root/notes 快照（有界 1000 文件 / 16 MiB）
    warning: 文件系统读取；前端仅持内存快照，不解析凭据
    call_sites: bridge.vaultOpen
    requires_declaration: false
    status: CURRENT_FACT
    note: STAGE I-A 登记；派生量 vault* 由 R6 护栏禁止写入

  # ---------------- SG-C：agent/database/git/skill 原生副作用（requires_declaration=false）----------------
  agentInstall:
    declared: install agent to runtime
    actual:
      - 写 Agent 定义到 Rust 后端（agent_install）
    warning: Agent 安装；installAgent 先写 pending 到中性协调器，确认窗 → confirm_agent_install
    call_sites: bridge.agentInstall
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-C 登记；与 agentChat 同源

  agentChat:
    declared: run agent (execute)
    actual:
      - Agent 执行（agent_chat，流式会话壳在前端）
    warning: Agent 执行；secret 不进 store（纵深脱敏）
    call_sites: bridge.agentChat
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-C 登记

  dbConnect:
    declared: establish external database connection
    actual:
      - 与外部数据库建立连接（db_connect，凭据瞬时传入不持久化）
    warning: 外部连接建立；password 只作组件本地瞬时态，连接后立刻清空（F2 红线）
    call_sites: bridge.dbConnect
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-C 登记

  dbQuery:
    declared: execute SQL
    actual:
      - 执行 SQL（db_query；写语句经 requiresConfirm 二次确认闸门）
    warning: SQL 执行；前端按连接 allow_write 触发确认，后端逐句分类（classify_sql_risk / is_production_database）
    call_sites: bridge.dbQuery
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-C 登记

  gitWrite:
    declared: stage/unstage/discard/commit/push
    actual:
      - 真正写文件 / 分支 / 推送（confirm_git_write）
    warning: 双段闸门：requestGitWrite 只生成预览，dangerous 须本地二次确认勾选后 confirm 才发；无 watch 自动写
    call_sites: bridge.confirmGitWrite
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-C 登记；requestGitWrite 无副作用（仅预览）

  skillInstall:
    declared: install skill to runtime
    actual:
      - 写 Skill 定义到 Rust 后端（skill_install）
    warning: Skill 安装；installSkill 先写 pending 到中性协调器，确认窗 → confirm_skill_install
    call_sites: bridge.skillInstall
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-C 登记；与 skillChat 同源

  # ---------------- SG-4：task 原生副作用（requires_declaration=false，文档级登记）----------------
  taskAdd:
    declared: create scheduled task
    actual:
      - 写定时任务定义到 Rust 后端（task_add）
    warning: 新建任务；guard 未就绪时前端 no-op 且零 invoke（LIMITED START 口径）
    call_sites: bridge.taskAdd
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-4 登记；与 agentInstall/skillInstall 同源（后端命令未落地前为只读壳）

  taskUpdate:
    declared: update scheduled task
    actual:
      - 更新定时任务定义到 Rust 后端（task_update，含 enabled 切换）
    warning: 编辑/启用禁用；覆盖变更字段，保留服务端时间戳
    call_sites: bridge.taskUpdate
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-4 登记

  taskRemove:
    declared: delete scheduled task
    actual:
      - 删除定时任务定义（task_remove）
    warning: 删除后前端过滤本地列表；选中态联动清空
    call_sites: bridge.taskRemove
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-4 登记

  taskRunNow:
    declared: trigger task execution immediately
    actual:
      - 手工触发一次执行（task_run_now），后端落盘持久历史
    warning: 会话内仅把快照并入 runs 供即时展示；持久历史仍由后端
    call_sites: bridge.taskRunNow
    requires_declaration: false
    status: CURRENT_FACT
    note: SG-4 登记

  # ---------------- SG Final-3：graph 原生副作用（requires_declaration=false，文档级登记）----------------
  graphQuery:
    declared: read graph nodes/edges (bounded projection)
    actual:
      - 从 graph.rs 有界投影读取图谱拓扑（删 props 第三闸）
    warning: graph.rs 为原生真源；前端仅缓存，不制造第二真源
    call_sites: bridge.graphQuery
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记；读型副作用

  graphNodeGet:
    declared: read single graph node detail
    actual:
      - 从 graph.rs 读取单节点详情
    warning: 原生真源读取
    call_sites: bridge.graphNodeGet
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记；读型副作用

  graphStats:
    declared: read graph capacity/stats
    actual:
      - 从 graph.rs 读取容量统计（truncated 信号）
    warning: 原生真源读取
    call_sites: bridge.graphStats
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记；读型副作用

  # ---------------- SG Final-3：plugin 原生副作用（requires_declaration=false）----------------
  pluginList:
    declared: list installed plugins (projection)
    actual:
      - 读取插件列表投影（无原文持久化）
    warning: 详情五态机真源在原生
    call_sites: bridge.pluginList
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记

  pluginGet:
    declared: get plugin detail
    actual:
      - 读取插件详情（detail.state 五态投影）
    warning: 不持久化/不回显签名原文、公钥原文、metadata 正文
    call_sites: bridge.pluginGet
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记

  pluginInstall:
    declared: install/update plugin
    actual:
      - 安装/更新插件（manifest + 资源路径）
    warning: 红线：不持久化/不回显签名原文、公钥原文、资源路径、metadata 正文、凭据、请求/响应体、stdout/stderr；瞬时输入成功即清空
    call_sites: bridge.pluginInstall
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记

  pluginEnable:
    declared: enable plugin
    actual:
      - 启用插件（按 detail.state 五态门控）
    warning: 五态机真源在原生
    call_sites: bridge.pluginEnable
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记

  pluginDisable:
    declared: disable plugin
    actual:
      - 禁用插件
    warning: 五态机真源在原生
    call_sites: bridge.pluginDisable
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记

  pluginKeysList:
    declared: list trusted keys (fingerprints only)
    actual:
      - 读取受信任密钥列表（仅 16-hex 指纹，无原文）
    warning: 仅指纹，不持有公钥原文
    call_sites: bridge.pluginKeysList
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记

  pluginKeysAdd:
    declared: add trusted key (fingerprint only)
    actual:
      - 添加受信任密钥（仅指纹）
    warning: 不持有公钥原文
    call_sites: bridge.pluginKeysAdd
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记

  pluginKeysRemove:
    declared: remove trusted key
    actual:
      - 移除受信任密钥
    warning: 仅指纹操作
    call_sites: bridge.pluginKeysRemove
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记

  # ---------------- SG Final-3：workspace 原生副作用（requires_declaration=false）----------------
  auditLog:
    declared: read governance audit log (projection)
    actual:
      - 读取 Governance AUDIT 镜像（bridge.auditLog）
    warning: 归 Governance 域，8C-0 不动；前端仅镜像
    call_sites: bridge.auditLog
    requires_declaration: false
    status: CURRENT_FACT
    note: SG Final-3 登记；读型副作用

# ------------------------------------------------------------
# 清单中列出但代码中不存在的项（如实标注，不得当作现状）
# ------------------------------------------------------------
not_found:
  sync_browser_scene:
    reason: 全仓 grep 无命中（src/ 与 src-tauri/src/ 均无）
    status: NOT_FOUND
    action: 不纳入 registry；若将来出现须先走 SCR 登记其真实副作用
