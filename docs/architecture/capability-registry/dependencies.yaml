# Capability Registry — dependencies.yaml
#
# 用途：声明能力之间的依赖边、共享基础设施节点，以及「谁不能依赖谁」的硬约束。
# 依赖边必须与 capabilities.yaml 的 dependsOn/optionalDependencies 一致（由 checker 校验）。

version: 1

# ── 共享基础设施节点（不是能力，不可卸载，任何能力都可依赖） ──────────────
shared_infrastructure:
  - id: bridge
    kind: ADAPTER
    evidence: src/bridge.ts（48 处 invoke）
    note: 唯一 Native 通道；绕过即违规
  - id: pinia
    kind: INFRASTRUCTURE
    evidence: src/main.ts
    note: 状态容器宿主
  - id: security_policy
    kind: INFRASTRUCTURE
    evidence: src-tauri/src/security_policy.rs
    note: 安全边界（程序黑名单 / 敏感数据）
  - id: shell
    kind: INFRASTRUCTURE
    evidence: src/App.vue + useLayoutStore
    note: 窗口 / 布局 / 导航

# ── 硬约束：禁止出现的依赖方向 ─────────────────────────────────────────
forbidden_edges:
  - from: credential
    to: browser
    reason: 凭据层不得反向依赖 UI 能力
  - from: credential
    to: terminal
    reason: 凭据层不得反向依赖进程能力
  - from: session
    to: browser
    reason: 关停链路不得依赖具体业务能力（避免关闭顺序耦合）
  - from: session
    to: grid
    reason: 同上

# ── 依赖边（与 capabilities.yaml 对齐） ────────────────────────────────
edges:
  - { from: browser,   to: bridge,   kind: required }
  - { from: bookmark,  to: browser, kind: optional }
  - { from: workspace, to: browser, kind: optional }
  - { from: bookmark,  to: bridge,   kind: required }
  - { from: workspace, to: bridge,   kind: required }
  - { from: grid,      to: browser,  kind: required }
  - { from: grid,      to: bridge,   kind: required }
  - { from: terminal,  to: bridge,   kind: required }
  # 注意：workspace 的「在终端打开」**不**声明 workspace→terminal 依赖边，
  # 而是经 shared 窄缝 src/composables/terminalNav.ts（与 browserNav/recentsNav 同族）。
  # 理由：声明 required 边会让 Terminal 缺失时 Workspace 无法装配，破坏「absent 可启动」。
  - { from: credential,to: bridge,   kind: required }
  - { from: database,  to: credential, kind: required }
  - { from: database,  to: bridge,   kind: required }
  - { from: git,       to: credential, kind: required }
  - { from: git,       to: workspace,  kind: required }
  - { from: git,       to: bridge,   kind: required }
  - { from: agent,     to: bridge,   kind: required }
  - { from: agent,     to: graph, kind: optional }
  - { from: skill,     to: bridge,   kind: required }
  - { from: plugin,    to: bridge,   kind: required }
  - { from: graph, to: bridge, kind: required }
  - { from: graph, to: agent,   kind: optional }
  - { from: vault,     to: bridge,   kind: required }
  - { from: vault,     to: browser,  kind: optional }
  - { from: task,      to: workspace, kind: required }
  - { from: task,      to: bridge,   kind: required }
  - { from: task,      to: script,   kind: optional }
  - { from: clipboard,  to: bridge,   kind: required }
  - { from: apps,       to: bridge,   kind: required }
  - { from: tools,      to: bridge,   kind: required }
  - { from: session,   to: bridge,   kind: required }
  - { from: script,    to: bridge,   kind: required }
  - { from: workbench, to: bridge,   kind: required }
  - { from: home,      to: browser,   kind: required }
  - { from: home,      to: workspace, kind: required }
  - { from: home,      to: apps,      kind: required }
  - { from: home,      to: bridge,    kind: required }
  # STAGE I-B：workspace 的「收藏目录」意图**不**声明 workspace→home 依赖边，
  # 而是经 shared 窄缝 src/composables/homeNav.ts（与 terminalNav/browserNav 同族）。
  # 理由：home→workspace 已是必须依赖，若再声明 workspace→home 将构成 CB-04 必须依赖环。
  # 该缝内部经 Home 的 public 边界访问，Workspace 侧不直接 import Home。

