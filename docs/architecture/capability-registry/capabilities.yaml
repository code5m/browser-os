# Capability Registry — capabilities.yaml
#
# 用途：回答「这个能力提供什么、依赖什么、生命周期与资源策略是什么」
#       —— 语义（这个状态/意图是什么意思、谁拥有、谁能写）归 Semantic Registry，此处只引用不重复。
#
# 铁律：
#   - semanticOwner 必须是 Semantic Registry 已登记的 owner；未登记则填 null + governanceStatus: OWNER_PENDING_SCR
#   - governanceStatus = OWNER_PENDING_SCR / LOCKED 的能力，lifecycle.activatable 必须为 false
#   - 新增语义必须走 SCR 更新 Semantic Registry 后，才能在此引用
#
# status 取值（禁止把目标写成现状）：
#   NOT_INTEGRATED          仅登记，未接入 Runtime
#   COMPATIBILITY_WRAPPED   经 Adapter 接入 Runtime，底层仍是既有系统
#   TARGET_COMPOSABLE       目标态，尚未实现

version: 1

capabilities:

  - id: browser
    name: Browser
    category: CAPABILITY
    semanticOwner: useBrowserStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    provides:
      - browser.navigate
      - browser.tab.open
      - browser.tab.close
      - browser.host
      - browser.grid
    dependsOn:
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [HEAVY, WEBVIEW, NATIVE]
      suspendable: false
      destroyable: false
    permissions:
      - webview.create
    persistence:
      scope: session
      sensitive: false
    entrypoint: src/capabilities/browser

  - id: grid
    name: Grid
    category: CAPABILITY
    semanticOwner: useBrowserStore
    governanceStatus: GOVERNED
    status: NOT_INTEGRATED
    provides:
      - grid.open
      - grid.layout
      - grid.archive
    dependsOn:
      - browser
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE]
      default: ACTIVE
      activatable: false
      resident: true
    resources:
      class: [VERY_HEAVY, MULTI_WEBVIEW, NATIVE]
      suspendable: false
      destroyable: false
    permissions:
      - webview.create
      - process.spawn
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/components/browser

  - id: workspace
    name: Workspace
    category: CAPABILITY
    semanticOwner: useWorkspaceStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    provides:
      - workspace.files
      - workspace.artifact
      - workspace.repo
      - workspace.script
      - workspace.snippet
      - workspace.main-view
    dependsOn:
      - browser
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [LIGHT, MEDIUM]
      suspendable: false
      destroyable: false
    permissions:
      - fs.read
      - fs.write
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/capabilities/workspace

  - id: terminal
    name: Terminal
    category: CAPABILITY
    # Phase 8E/Train D：owner 由 useSystemStore（混居）迁为专属 owner useTerminalStore
    # （SCR-20260920-terminal-owner-extraction；11 状态 7 意图零语义变更）。
    semanticOwner: useTerminalStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    provides:
      - terminal.spawn
      - terminal.write
      - terminal.kill
      - terminal.resize
      - terminal.grid
    dependsOn:
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [PROCESS, PTY]
      suspendable: false
      destroyable: true
    permissions:
      - process.spawn
    persistence:
      scope: session
      sensitive: false
    entrypoint: src/capabilities/terminal

  - id: bookmark
    name: Bookmark
    category: CAPABILITY
    semanticOwner: useBookmarkStore
    governanceStatus: GOVERNED
    status: NOT_INTEGRATED
    provides:
      - bookmark.list
      - bookmark.add
      - bookmark.remove
      - bookmark.togglePanel
    dependsOn:
      - browser
    optionalDependencies:
      - bridge
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [LIGHT]
      suspendable: true
      destroyable: true
    permissions: []
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/stores/useBookmarkStore.ts

  - id: credential
    name: Credential
    category: CAPABILITY
    semanticOwner: KeyringStore
    governanceStatus: GOVERNED
    status: NOT_INTEGRATED
    provides:
      - credential.save
      - credential.get
      - credential.delete
    dependsOn:
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE]
      default: ACTIVE
      activatable: false
      resident: true
    resources:
      class: [SECURITY_SENSITIVE]
      suspendable: false
      destroyable: false
    permissions:
      - keyring.access
    persistence:
      scope: os_keyring
      sensitive: true
    entrypoint: src-tauri/src/security_policy.rs

  - id: database
    name: Database
    category: CAPABILITY
    semanticOwner: useDatabaseStore
    governanceStatus: GOVERNED
    # Phase 8E/Train E 成熟度裁决：registered+governed 但 NOT_INTEGRATED（非 absent-composable）。
    # 物理仍是 always-loaded Workspace 面板（DatabasePanel 在 workspace/ui），connect 即建真实 DB 连接
    # （重资源 NETWORK+SECRET）。达到 C3 需抽为可选能力包（absent → 不挂载面板/不建连接），记为 Debt-8E-5。
    # 边界由 scripts/check-developer-owners.mjs (DEV-*) 机器固化（无合并 store / 凭据只经 Keyring）。
    status: NOT_INTEGRATED
    maturity: C1
    provides:
      - database.connect
      - database.query
      - database.cancel
    dependsOn:
      - credential
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: false
      resident: false
    resources:
      class: [NETWORK, SECRET]
      suspendable: true
      destroyable: true
    permissions:
      - network.connect
      - keyring.access
    persistence:
      scope: disk
      sensitive: true
    entrypoint: src/components/workspace/DatabasePanel.vue

  - id: git
    name: Git
    category: CAPABILITY
    semanticOwner: useGitStore
    governanceStatus: GOVERNED
    # Phase 8E/Train E 成熟度裁决：registered+governed 但 NOT_INTEGRATED（非 absent-composable）。
    # 物理仍是 always-loaded Workspace 面板（GitPanel 在 workspace/ui），操作即 spawn git 子进程（重资源）。
    # 达到 C3 需抽为可选能力包（absent → 不挂载面板/不 spawn），记为 Debt-8E-6。
    # 边界由 scripts/check-developer-owners.mjs (DEV-*) 机器固化。
    status: NOT_INTEGRATED
    maturity: C1
    provides:
      - git.status
      - git.diff
      - git.log
      - git.commit
    dependsOn:
      - credential
      - workspace
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: false
      resident: false
    resources:
      class: [MEDIUM, NETWORK]
      suspendable: true
      destroyable: true
    permissions:
      - fs.read
      - fs.write
      - keyring.access
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/components/workspace/GitPanel.vue

