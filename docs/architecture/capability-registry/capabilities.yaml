  # 后端 task_list/add/update/remove/run_now 已实现；进程内唯一调度线程（scheduler.rs）驱动，执行复用 script_runner。
  - id: task
    name: Task
    category: CAPABILITY
    semanticOwner: useTaskStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    maturity: C2
    provides:
