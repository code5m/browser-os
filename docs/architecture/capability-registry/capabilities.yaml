  # 分类：Workspace 子能力（与 artifact/repo/snippet 同宿于 src/capabilities/workspace/，
  # 由 workspace 贡献 view='scripts' 渲染）。独立语义 owner = useScriptStore。
  # 保留条目而非并入 workspace：script.run 真实派生进程（PROCESS + process.spawn），需独立治理。
  - id: script
    name: Script
    category: CAPABILITY
    semanticOwner: useScriptStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    maturity: C2
    provides:
