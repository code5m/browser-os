      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [MEDIUM]
      suspendable: true
      destroyable: true
    permissions: []
    persistence:
