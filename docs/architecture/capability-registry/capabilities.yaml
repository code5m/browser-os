    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE]
      default: ACTIVE
      activatable: false
      resident: true
    resources:
      class: [SECURITY_SENSITIVE]
      suspendable: false
      destroyable: false
    permissions:
      - keyring.access
    persistence:
      scope: os_keyring
      sensitive: true
    entrypoint: src-tauri/src/security_policy.rs

  - id: database
    name: Database
    category: CAPABILITY
    semanticOwner: useDatabaseStore
    governanceStatus: GOVERNED
    # Capability Library Expansion v1：Database 升格为独立 Capability（不再内嵌于 Workspace 的 DatabasePanel）。
    # 物理：DatabasePanel 迁入 src/capabilities/database/ui，经通用 Contribution Registry 的 WORKBENCH_MAIN 槽
    # （view='db'）贡献给 MainArea；MainArea 只按槽渲染、不 import 内部（C3 关键）。
    # 资源法（§18）：连接资源由 Rust 在 connect/query 时瞬态建连即弃，不驻留全局；前端零明文凭据（仅 keyring id）。
    # absent → 无面板挂载 → 无 connect → 无 keyring 读、无 DbPool（§18 满足）。
    # 仍遗留（诚实，不谎报）：useDatabaseStore 物理在 src/stores（未迁入 capabilities/database/state）；
    # 无 database 专属 absence 运行时门禁；mainView='db' 导航项仍硬编码于 LayoutStore/Home（未贡献驱动）。
    status: COMPATIBILITY_WRAPPED
    maturity: C2
    provides:
      - database.connect
      - database.query
      - database.cancel
    dependsOn:
      - credential
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: false
      resident: false
    resources:
      class: [NETWORK, SECRET]
      suspendable: true
      destroyable: true
    permissions:
      - network.connect
      - keyring.access
    persistence:
      scope: disk
      sensitive: true
    entrypoint: src/capabilities/database/index.ts

  - id: git
    name: Git
    category: CAPABILITY
    semanticOwner: useGitStore
    governanceStatus: GOVERNED
    # Capability Library Expansion v1：Git 升格为独立 Capability（不再内嵌于 Workspace 的 RepoPanel）。
    # 物理：GitPanel/GitDiffViewer/GitWriteConfirmDialog 迁入 src/capabilities/git/ui，
    # 经通用 Contribution Registry 的 REPO_SUBVIEW 槽贡献给 RepoPanel（RepoPanel 只按槽渲染，不 import 内部）。
    # 写操作仍 spawn git 子进程（重资源）；absent 态不挂载面板、不 spawn（C3 一致）。
    # 边界由 scripts/check-developer-owners.mjs (DEV-*) 机器固化。
    status: COMPATIBILITY_WRAPPED
    maturity: C2
    provides:
      - git.status
      - git.diff
      - git.log
      - git.commit
      - git.write
    dependsOn:
      - credential
      - workspace
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [MEDIUM, NETWORK]
      suspendable: true
      destroyable: true
    permissions:
      - fs.read
      - fs.write
      - keyring.access
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/capabilities/git/index.ts

  - id: agent
    name: Agent
    category: CAPABILITY
    semanticOwner: useAgentStore
    governanceStatus: GOVERNED
    # Capability Library Expansion v1：Agent 升格为独立 Capability（AgentManagerPanel 迁入 capabilities/agent/ui）。
    # 诚实缺口：执行后端（agent_chat/run/install）Rust 未实现（AGENT_SKILL_COMMANDS_AVAILABLE=false），
    # 仅 agent_parse/validate/permission_preview 只读命令就绪 → 当前为只读壳，maturity C1。
    # useAgentStore 同时持有 skill 状态（skill 无专属 store），STAGE E 处理 skill 拆分。
    status: COMPATIBILITY_WRAPPED
    maturity: C1
    provides:
      - agent.chat
      - agent.run
      - agent.memory
    dependsOn:
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [MEDIUM, NETWORK]
      suspendable: true
      destroyable: true
    permissions:
      - network.connect
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/capabilities/agent/index.ts

  - id: skill
    name: Skill
    category: CAPABILITY
    semanticOwner: useSkillStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
