      sensitive: false
    entrypoint: src/capabilities/skill/index.ts

  # Capability Library Expansion v1（STAGE F）：Plugin 物理迁入 capabilities/plugin/（manifest/public/index/ui/state）。
  # 诚实边界（Stage-I 登记簿）：后端 plugin_list/get/install/enable/disable/keys_* 已实现（本地登记簿 + 状态机 + 信任指纹），
  #   但无 plugin 运行时（不解包/不真验签/不动态加载/不执行/不联网）→ 无 owned 资源实例，maturity C2（运行时 LOCKED）。
  # 五态分别判定（AVAILABLE/INSTALLED/ENABLED/ACTIVE/RESOURCE_EXISTS），禁止合并成单一 boolean（§18）。
  - id: plugin
    name: Plugin
    category: CAPABILITY
    semanticOwner: usePluginStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    maturity: C2
    provides:
      - plugin.list
      - plugin.manifest
    dependsOn:
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [HEAVY, NATIVE]
      suspendable: false
      destroyable: false
    permissions: []
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/capabilities/plugin/index.ts

  # Capability Library Expansion v1（STAGE G）：知识图谱能力 id 由 `knowledge_graph` 统一为 `graph`
  # （下划线不满足 Building Block Contract 的 id 规则 ^[a-z][a-z0-9.]*$）；物理迁入 capabilities/graph/。
  # 后端 graph_query/graph_node_get/graph_stats 已实现（只读内存快照）；无 worker/webview/写盘。
  - id: graph
    name: KnowledgeGraph
    category: CAPABILITY
    semanticOwner: useGraphStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    maturity: C2
    provides:
