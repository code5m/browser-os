    lifecycle:
      supported: [ACTIVE, BACKGROUND]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [BACKGROUND]
      suspendable: true
      destroyable: true
    permissions:
      - process.spawn
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/capabilities/task/index.ts

