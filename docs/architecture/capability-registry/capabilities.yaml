      - script.snippet
    dependsOn:
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [PROCESS]
      suspendable: false
      destroyable: true
    permissions:
      - process.spawn
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/capabilities/script/index.ts

