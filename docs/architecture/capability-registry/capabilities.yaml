      - bookmark.add
      - bookmark.remove
      - bookmark.togglePanel
    dependsOn: [bridge]
    optionalDependencies: [browser]
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [LIGHT]
      suspendable: true
      destroyable: true
    permissions: []
    persistence:
