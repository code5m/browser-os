# Capability Registry — capabilities.yaml
#
# 用途：回答「这个能力提供什么、依赖什么、生命周期与资源策略是什么」
#       —— 语义（这个状态/意图是什么意思、谁拥有、谁能写）归 Semantic Registry，此处只引用不重复。
#
# 铁律：
#   - semanticOwner 必须是 Semantic Registry 已登记的 owner；未登记则填 null + governanceStatus: OWNER_PENDING_SCR
#   - governanceStatus = OWNER_PENDING_SCR / LOCKED 的能力，lifecycle.activatable 必须为 false
#   - 新增语义必须走 SCR 更新 Semantic Registry 后，才能在此引用
#
# status 取值（禁止把目标写成现状）：
#   NOT_INTEGRATED          仅登记，未接入 Runtime
#   COMPATIBILITY_WRAPPED   经 Adapter 接入 Runtime，底层仍是既有系统
#   TARGET_COMPOSABLE       目标态，尚未实现

version: 1

capabilities:

  - id: browser
    name: Browser
    category: CAPABILITY
    semanticOwner: useBrowserStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    provides:
      - browser.navigate
      - browser.tab.open
      - browser.tab.close
      - browser.host
      - browser.grid
    dependsOn:
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [HEAVY, WEBVIEW, NATIVE]
      suspendable: false
      destroyable: false
    permissions:
      - webview.create
    persistence:
      scope: session
      sensitive: false
    entrypoint: src/capabilities/browser

  - id: grid
    name: Grid
    category: CAPABILITY
    semanticOwner: useBrowserStore
    governanceStatus: GOVERNED
    status: NOT_INTEGRATED
    provides:
      - grid.open
      - grid.layout
      - grid.archive
    dependsOn:
      - browser
      - bridge
    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE]
      default: ACTIVE
      activatable: false
      resident: true
    resources:
      class: [VERY_HEAVY, MULTI_WEBVIEW, NATIVE]
      suspendable: false
      destroyable: false
    permissions:
      - webview.create
      - process.spawn
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/components/browser

  - id: workspace
    name: Workspace
    category: CAPABILITY
    semanticOwner: useWorkspaceStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    provides:
      - workspace.files
      - workspace.artifact
      - workspace.repo
      - workspace.script
      - workspace.snippet
      - workspace.main-view
    dependsOn: [bridge]
    optionalDependencies: [browser]
    lifecycle:
      supported: [ACTIVE, SUSPENDED]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [LIGHT, MEDIUM]
      suspendable: false
      destroyable: false
    permissions:
      - fs.read
      - fs.write
    persistence:
      scope: disk
      sensitive: false
    entrypoint: src/capabilities/workspace

  - id: terminal
    name: Terminal
    category: CAPABILITY
    # Phase 8E/Train D：owner 由 useSystemStore（混居）迁为专属 owner useTerminalStore
    # （SCR-20260920-terminal-owner-extraction；11 状态 7 意图零语义变更）。
    semanticOwner: useTerminalStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    provides:
      - terminal.spawn
      - terminal.write
      - terminal.kill
      - terminal.resize
      - terminal.grid
    dependsOn:
