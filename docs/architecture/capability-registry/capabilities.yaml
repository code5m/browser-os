    optionalDependencies: []
    lifecycle:
      supported: [ACTIVE]
      default: ACTIVE
      activatable: true
      resident: false
    resources:
      class: [PROCESS, PTY]
      suspendable: false
      destroyable: true
    permissions:
      - process.spawn
    persistence:
      scope: session
      sensitive: false
    entrypoint: src/capabilities/terminal

  - id: bookmark
    name: Bookmark
    category: CAPABILITY
    semanticOwner: useBookmarkStore
    governanceStatus: GOVERNED
    status: COMPATIBILITY_WRAPPED
    provides:
