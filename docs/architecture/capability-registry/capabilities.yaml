      sensitive: false
    entrypoint: src/capabilities/bookmark/index.ts

  - id: credential
    name: Credential
    category: CAPABILITY
    semanticOwner: KeyringStore
    governanceStatus: GOVERNED
    status: NOT_INTEGRATED
    provides:
      - credential.save
      - credential.get
      - credential.delete
    dependsOn:
